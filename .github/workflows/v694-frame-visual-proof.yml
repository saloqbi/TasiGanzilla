name: V701 Production Frame Visual Proof

on:
  push:
    branches:
      - verify/v694-frame-visual-proof
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show runtime
        run: |
          google-chrome --version
          node --version
          npm --version

      - name: Wait for production page
        shell: bash
        run: |
          set -euo pipefail
          url='https://tasi-ganzilla.vercel.app/v672.html?v=701-production-proof-20260801-0322'
          for attempt in $(seq 1 30); do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ]; then
              echo "Production page ready on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 5
          done
          exit 1

      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.15.0

      - name: Capture and audit production frame
        shell: bash
        run: |
          set -euo pipefail
          cat > capture-frame.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const target = 'https://tasi-ganzilla.vercel.app/v672.html?v=701-production-proof-20260801-0322';
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-gpu',
              '--disable-dev-shm-usage',
              '--disable-background-networking',
              '--hide-scrollbars'
            ]
          });

          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1800, deviceScaleFactor: 1 });
            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await new Promise((resolve) => setTimeout(resolve, 25000));

            const audit = await page.evaluate(() => {
              const wheel = Array.from(document.querySelectorAll('canvas'))
                .filter((canvas) => canvas.width > 300 && canvas.height > 300 && !canvas.closest('aside'))
                .sort((a, b) => {
                  const ar = a.getBoundingClientRect();
                  const br = b.getBoundingClientRect();
                  return (br.width * br.height) - (ar.width * ar.height);
                })[0] || null;
              const wheelRect = wheel?.getBoundingClientRect?.() || null;
              return {
                href: location.href,
                title: document.title,
                hook: typeof window.__auditGannzillaV701DocumentPrototypeFrameHook === 'function'
                  ? window.__auditGannzillaV701DocumentPrototypeFrameHook()
                  : null,
                runtime: typeof window.__auditGannzillaOrnateOuterFrameV685 === 'function'
                  ? window.__auditGannzillaOrnateOuterFrameV685()
                  : null,
                runtimeFlag: Boolean(window.__gannzillaOrnateOuterFrameV685),
                wheelRenderKey: wheel?.dataset?.gannzillaOrnateOuterFrameRenderKeyV685 || null,
                wheel: wheelRect ? {
                  left: wheelRect.left,
                  top: wheelRect.top,
                  width: wheelRect.width,
                  height: wheelRect.height
                } : null
              };
            });

            fs.writeFileSync('frame-audit.json', JSON.stringify(audit, null, 2));
            await page.screenshot({ path: 'frame-visual-proof.png', fullPage: false });
            console.log(JSON.stringify(audit, null, 2));
          } finally {
            await browser.close();
          }
          EOF
          node ./capture-frame.mjs
          test -s frame-visual-proof.png
          test -s frame-audit.json
          file frame-visual-proof.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: v701-production-frame-visual-proof
          path: |
            frame-visual-proof.png
            frame-audit.json
          if-no-files-found: error
          retention-days: 2
