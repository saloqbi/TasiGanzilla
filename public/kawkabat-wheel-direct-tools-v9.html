<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية — Direct Tools V9</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#F7F1E3}body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">جارٍ تحميل العجلة المصححة…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/0ec477030d639e2c21db6d2c214391170714575b/public/kawkabat-wheel-direct-tools-v8.html';
    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('V8_SOURCE_HTTP_'+response.status);
      var source=await response.text();
      source=source.replace('Direct Tools V8','Direct Tools V9');
      source=source.replace('level%2?.11:.075','level%2 ? 0.11 : 0.075');
      if(source.indexOf('level%2?.11:.075')>=0)throw new Error('INVALID_TERNARY_STILL_PRESENT');
      if(source.indexOf('level%2 ? 0.11 : 0.075')<0)throw new Error('TERNARY_CORRECTION_FAILED');
      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Runtime V9: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
