<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Display Cycle 1–360 Only V43</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/05f68f1bb9eda171517c7180ba659ba89b6200e1/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornate-frame-angle-ticks-inner-copper-boundary-v41.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var observer=null;

function findDocument(doc,predicate,depth){
  if(!doc||depth>110)return null;
  try{if(predicate(doc))return doc;}catch(error){}
  var frames=[];
  try{frames=doc.querySelectorAll('iframe');}catch(error){return null;}
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=findDocument(frames[i].contentDocument,predicate,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function applyDisplayCycleOnly(){
  try{
    var root=frame.contentDocument;
    if(!root)return false;
    var wheelDoc=findDocument(root,function(doc){
      return !!doc.getElementById('wheel')&&!!doc.querySelector('.number-text[data-value]');
    },0);
    if(!wheelDoc)return false;

    var nodes=wheelDoc.querySelectorAll('.number-text[data-value]');
    if(!nodes.length)return false;

    nodes.forEach(function(node){
      var value=node.getAttribute('data-value');
      if(!value)return;
      var target=String(value).trim();
      if(String(node.textContent||'').trim()!==target){
        while(node.firstChild)node.removeChild(node.firstChild);
        node.textContent=target;
      }
    });

    wheelDoc.documentElement.dataset.displayCycleOneTo360V43='true';
    wheelDoc.documentElement.dataset.displayCycleSource='data-value-only';
    wheelDoc.documentElement.dataset.v43BaseVersion='V41';
    wheelDoc.documentElement.dataset.v43GeometryLocked='true';
    wheelDoc.documentElement.dataset.v43PresentationLocked='true';

    if(!observer||observer.__wheelDocument!==wheelDoc){
      if(observer)observer.disconnect();
      observer=new MutationObserver(function(){applyDisplayCycleOnly();});
      observer.__wheelDocument=wheelDoc;
      observer.observe(wheelDoc.getElementById('wheel'),{childList:true,subtree:true,characterData:true});
    }

    var view=wheelDoc.defaultView;
    if(view){
      view.__auditKawkabatDisplayCycleOneTo360V43=function(){
        var first=wheelDoc.querySelector('.number-text[data-value="1"]');
        var last=wheelDoc.querySelector('.number-text[data-value="360"]');
        return{
          ok:!!first&&!!last&&String(first.textContent||'').trim()==='1'&&String(last.textContent||'').trim()==='360',
          baseVersion:'V41',
          changedArea:'displayed-wheel-number-text-only',
          sequence:'1-360',
          geometryLocked:true,
          presentationLocked:true,
          inputValueChanged:false,
          panelChanged:false,
          wheelGeometryChanged:false,
          ornateOuterFrameChanged:false,
          turquoiseGemsChanged:false,
          innerCopperBoundaryChanged:false,
          blueAngleBandChanged:false,
          angleTicksChanged:false,
          angleLabelsChanged:false,
          zodiacChanged:false
        };
      };
    }
    return true;
  }catch(error){
    return false;
  }
}

function start(){
  if(poll)clearInterval(poll);
  var attempts=0;
  poll=setInterval(function(){
    attempts+=1;
    if(applyDisplayCycleOnly()||attempts>=1800){
      clearInterval(poll);
      poll=null;
    }
  },100);
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
