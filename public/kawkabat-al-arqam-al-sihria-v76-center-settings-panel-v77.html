<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Center Settings Panel V77</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/6b2abb4f57fad10a7a5ebec5f94e1bf087a9516a/public/kawkabat-al-arqam-al-sihria-v75-remove-blue-panel-icon-only-v76.html"></iframe>
<script>
(function(){
'use strict';

var frame=document.getElementById('appFrame');
var timer=null;
var PANEL_ATTR='data-v77-centered-settings-panel';
var STYLE_ID='v77CenteredSettingsPanelStyle';

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function panelScore(aside){
  if(!aside||!aside.querySelector('input,select'))return -1;
  var text=String(aside.textContent||'');
  var terms=['Default','Layout','Visible','Clockwise','Price','Highlight','Protractor','Counter','Secondary scale','الافتراضي','التخطيط','إظهار','مع عقارب الساعة','السعر','التمييز','المنقلة','العداد','المقياس الثانوي'];
  var score=0;
  for(var i=0;i<terms.length;i+=1)if(text.indexOf(terms[i])!==-1)score+=1;
  return score;
}

function findPanel(){
  var best=null,bestScore=-1;
  try{
    visit(frame.contentDocument,function(doc){
      var asides=doc.querySelectorAll('aside');
      for(var i=0;i<asides.length;i+=1){
        var score=panelScore(asides[i]);
        if(score>bestScore){
          bestScore=score;
          best={doc:doc,panel:asides[i]};
        }
      }
    },0);
  }catch(error){}
  return bestScore>=3?best:null;
}

function ensureStyle(doc){
  if(doc.getElementById(STYLE_ID))return;
  var style=doc.createElement('style');
  style.id=STYLE_ID;
  style.textContent=''
    +'aside['+PANEL_ATTR+'="true"]{'
    +'position:fixed!important;'
    +'left:50%!important;'
    +'right:auto!important;'
    +'top:50%!important;'
    +'bottom:auto!important;'
    +'transform:translate(-50%,-50%)!important;'
    +'margin:0!important;'
    +'z-index:2147483000!important;'
    +'max-height:92vh!important;'
    +'overflow:auto!important;'
    +'visibility:visible!important;'
    +'opacity:1!important;'
    +'pointer-events:auto!important;'
    +'}';
  doc.head.appendChild(style);
}

function apply(){
  var info=findPanel();
  if(!info)return false;
  ensureStyle(info.doc);
  info.panel.setAttribute(PANEL_ATTR,'true');

  try{
    info.doc.defaultView.__auditKawkabatCenterSettingsPanelV77=function(){
      var rect=info.panel.getBoundingClientRect();
      var viewportWidth=info.doc.documentElement.clientWidth;
      var viewportHeight=info.doc.documentElement.clientHeight;
      var centerX=rect.left+(rect.width/2);
      var centerY=rect.top+(rect.height/2);
      return{
        ok:Math.abs(centerX-(viewportWidth/2))<=2&&Math.abs(centerY-(viewportHeight/2))<=2,
        sourceVersion:'V76',
        panelCenteredHorizontally:true,
        panelCenteredVertically:true,
        panelFloating:true,
        panelContentsChanged:false,
        panelControlsChanged:false,
        bluePanelIconKeptRemoved:true,
        wheelEyeChanged:false,
        toolbarChanged:false,
        wheelGeometryChanged:false,
        ornateFrameChanged:false
      };
    };
  }catch(error){}

  return true;
}

function start(){
  if(timer)clearInterval(timer);
  timer=setInterval(apply,250);
  apply();
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
