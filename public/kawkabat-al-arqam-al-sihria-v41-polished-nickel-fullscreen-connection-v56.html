<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kawkabat V56 — Active Fullscreen and Connection</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#bar{height:58px;flex:0 0 58px;display:flex;justify-content:flex-end;align-items:stretch;direction:ltr;padding:0 6px;background:linear-gradient(#fff,#d7dadd 52%,#fafafa);border-bottom:1px solid #858b90;box-shadow:0 2px 5px #0004;z-index:20}
.group{display:flex;height:100%}.btn{height:100%;min-width:58px;border:0;border-left:1px solid #fff;border-right:1px solid #9aa1a733;background:linear-gradient(#fff,#eceeef 52%,#fff);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#111}.btn:hover{background:linear-gradient(#fff,#dfe7ed,#fff)}.btn:focus-visible{outline:2px solid #5885d8;outline-offset:-3px}.btn svg{width:35px;height:35px}.zoomIcon svg{width:39px;height:39px}#zoomText{min-width:150px;font-size:28px}.lang{padding:0 18px;font-size:27px;min-width:210px}.flag{font-size:32px}.caret{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #222;margin-left:10px}
#full[aria-pressed="true"]{background:linear-gradient(#fff,#dce8ff,#fff);box-shadow:inset 0 0 0 2px #7c9bd6}
#view{position:relative;flex:1;overflow:hidden;background:#f7f1e3}#stage{position:relative;width:100%;height:100%;overflow:hidden}#app{display:block;border:0;width:100%;height:100%;transform-origin:top left;background:#fff}
.modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:66px;background:#0005;z-index:1000}.modal.open{display:flex}.dialog{background:#f4f4f4;color:#111;border:1px solid #8f8f8f;box-shadow:0 20px 50px #0008;direction:ltr}.dialogHead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #c5c5c5;font-size:15px}.dialogX{border:0;background:transparent;color:#111;font-size:23px;cursor:pointer;line-height:1}.dialogBody{padding:11px}
#connectionDialog{width:min(310px,94vw)}.proxyRow{display:flex;align-items:center;gap:8px;margin-bottom:9px}.switch{position:relative;width:29px;height:13px;border:0;padding:0;border-radius:999px;background:#ccc;cursor:pointer}.switch:before{content:"";position:absolute;width:9px;height:9px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 0 2px #555}.switch.on{background:linear-gradient(90deg,#6db6ff,#dc4a4a)}.switch.on:before{left:18px}.formLabel{display:block;font-size:12px;color:#555;margin:6px 0 2px}.field,.select{width:100%;height:23px;border:1px solid #b7b7b7;background:#fff;padding:2px 5px}.row{display:grid;grid-template-columns:1fr 58px;gap:5px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dialogButtons{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.rightButtons{display:flex;gap:6px}.action{min-width:55px;height:24px;border:1px solid #aaa;background:linear-gradient(#fff,#e7e7e7);cursor:pointer}.action.primary{border:2px solid #2585d5}
#aboutDialog{width:min(370px,92vw);background:#070707;color:#f7d77f;border:1px solid #d3a12e;direction:rtl}.aboutHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #b78016;font-weight:700}.aboutBody{padding:12px 16px 14px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 10px;padding:8px 12px;width:max-content;max-width:100%;border:1px solid #b78016;border-radius:999px;background:#2b210d}.brand strong{display:block;font-size:17px}.brand small{display:block;color:#e8c66f}.mark{width:34px;height:44px}.poster{position:relative;overflow:hidden;min-height:290px;border:2px solid #6e4500;box-shadow:inset 0 0 0 1px #e6b946;background:radial-gradient(circle at 50% 20%,#3344aa88,transparent 24%),radial-gradient(circle at 22% 62%,#2387ff66,transparent 18%),radial-gradient(circle at 78% 55%,#ffc24744,transparent 21%),linear-gradient(#080e22,#050505 55%,#090909);padding:14px;text-align:center}.rings{position:absolute;inset:-70px 28px auto;height:220px;border:2px solid #dca93b66;border-radius:50%;box-shadow:0 0 0 10px #dca93b22,0 0 0 22px #dca93b14}.arrow{position:absolute;right:18px;top:36px;width:105px;height:125px}.hood{position:relative;margin:52px auto 8px;width:92px;height:104px;border-radius:40px 40px 48px 48px/22px 22px 78px 78px;background:linear-gradient(#1b2147,#020205 65%);box-shadow:0 0 30px #247cff88}.hood:before,.hood:after{content:"";position:absolute;top:40px;width:18px;height:7px;border-radius:9px;background:#2bbcff;box-shadow:0 0 14px #2bbcff}.hood:before{right:19px;transform:rotate(-9deg)}.hood:after{left:19px;transform:rotate(9deg)}.title{font-size:25px;font-weight:900;color:#ffd86e;text-shadow:0 0 12px #ffb00088}.sub{font-size:13px;font-weight:700}.gold{display:inline-block;margin:5px 0;padding:2px 20px;border:1px solid #b78016;border-radius:999px;font-size:20px;font-weight:900}.info{text-align:center;line-height:1.55;margin-top:10px}.closeRow{text-align:left;margin-top:10px}.close{background:transparent;border:1px solid #d3a12e;color:#ffe093;padding:4px 13px;cursor:pointer}
</style>
</head>
<body>
<div id="shell">
  <div id="bar">
    <div class="group">
      <button id="minus" class="btn zoomIcon" aria-label="Zoom out"><svg viewBox="0 0 64 64"><circle cx="26" cy="26" r="21" fill="#fff" stroke="#4b6fd3" stroke-width="5"/><rect x="14" y="23" width="24" height="6" rx="3" fill="#325ccf"/><rect x="7" y="42" width="18" height="6" rx="3" fill="#aaa" transform="rotate(-45 16 45)"/></svg></button>
      <button id="zoomText" class="btn" aria-label="Reset zoom">95%</button>
      <button id="plus" class="btn zoomIcon" aria-label="Zoom in"><svg viewBox="0 0 64 64"><circle cx="26" cy="26" r="21" fill="#fff" stroke="#4b6fd3" stroke-width="5"/><rect x="14" y="23" width="24" height="6" rx="3" fill="#325ccf"/><rect x="23" y="14" width="6" height="24" rx="3" fill="#325ccf"/><rect x="7" y="42" width="18" height="6" rx="3" fill="#aaa" transform="rotate(-45 16 45)"/></svg></button>
    </div>
    <div class="group">
      <button id="full" class="btn" aria-label="Fullscreen" aria-pressed="false" title="Fullscreen"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="8" width="48" height="48" fill="#fafafa" stroke="#d0d0d0"/><path d="M14 27V14h13M37 14h13v13M50 37v13H37M27 50H14V37" fill="none" stroke="#6f91da" stroke-width="5" stroke-linecap="square"/></svg></button>
      <button id="reset" class="btn" aria-label="Reset zoom"><svg viewBox="0 0 64 64"><rect x="14" y="10" width="36" height="44" fill="#f7f7f7" stroke="#bbb"/><rect x="21" y="18" width="22" height="28" fill="#ddd"/><rect x="27" y="18" width="10" height="28" fill="#999"/></svg></button>
    </div>
    <div class="group"><button id="language" class="btn lang" aria-label="Language"><span id="langFlag" class="flag">🇬🇧</span><span id="langText">English</span><span class="caret"></span></button></div>
    <div class="group"><button id="connection" class="btn" aria-label="Connection settings" title="Connection settings"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="phoneG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcecff"/><stop offset=".5" stop-color="#6f9ac5"/><stop offset="1" stop-color="#365f88"/></linearGradient></defs><path d="M20 8c-3 0-7 7-7 12 0 16 15 31 31 31 5 0 12-4 12-7 0-2-8-11-11-11-2 0-6 5-8 5-5 0-14-9-14-14 0-2 5-6 5-8 0-3-6-8-8-8z" fill="url(#phoneG)" stroke="#526779" stroke-width="2"/><path d="M49 13h9l-4.5 6z" fill="#333"/></svg></button></div>
    <div class="group"><button id="about" class="btn" aria-label="About"><svg viewBox="0 0 64 64"><defs><radialGradient id="ig" cx="35%" cy="28%" r="70%"><stop offset="0" stop-color="#a8c3ff"/><stop offset=".35" stop-color="#4f84f5"/><stop offset="1" stop-color="#2457b9"/></radialGradient></defs><circle cx="32" cy="32" r="24" fill="url(#ig)" stroke="#93b0f6" stroke-width="2"/><rect x="29.3" y="25" width="5.4" height="18" rx="2.7" fill="#fff"/><circle cx="32" cy="18" r="3.2" fill="#fff"/></svg></button></div>
  </div>
  <div id="view"><div id="stage"><iframe id="app" allowfullscreen scrolling="yes" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/v41-display-locked/public/kawkabat-al-arqam-al-sihria-v41-polished-nickel-chart-settings-full-v51.html"></iframe></div></div>
</div>

<div id="connectionOverlay" class="modal" aria-hidden="true"><div id="connectionDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="connectionTitle"><div class="dialogHead"><span id="connectionTitle">Connection settings</span><button id="connectionX" class="dialogX" aria-label="Close">×</button></div><div class="dialogBody"><div class="proxyRow"><button id="proxySwitch" class="switch" type="button" role="switch" aria-checked="false"></button><span>Use proxy</span></div><label class="formLabel" for="proxyType">Type:</label><select id="proxyType" class="select" disabled><option>HTTP</option><option>SOCKS5</option></select><div class="row"><div><label class="formLabel" for="server">Server:</label><input id="server" class="field" disabled></div><div><label class="formLabel" for="port">Port:</label><input id="port" class="field" disabled></div></div><div class="row2"><div><label class="formLabel" for="login">Login:</label><input id="login" class="field" disabled></div><div><label class="formLabel" for="password">Password:</label><input id="password" type="password" class="field" disabled></div></div><div class="dialogButtons"><button id="testConnection" class="action" type="button">Test</button><div class="rightButtons"><button id="saveConnection" class="action primary" type="button">OK</button><button id="cancelConnection" class="action" type="button">Cancel</button></div></div></div></div></div>

<div id="aboutOverlay" class="modal" aria-hidden="true"><div id="aboutDialog" role="dialog" aria-modal="true"><div class="aboutHead"><button id="aboutX" class="dialogX" style="color:#ffd766">×</button><span>حول البرنامج</span></div><div class="aboutBody"><div class="brand"><svg class="mark" viewBox="0 0 64 88"><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff0a7"/><stop offset=".48" stop-color="#f4c548"/><stop offset="1" stop-color="#b57000"/></linearGradient></defs><path d="M18 84V18c0-4 3-7 7-7h8c4 0 7 3 7 7v66z" fill="url(#gg)" stroke="#ffe6a0" stroke-width="2"/><path d="M32 50L56 28" stroke="#ffd76a" stroke-width="6"/><path d="M50 26h10v10" fill="none" stroke="#ffd76a" stroke-width="6"/></svg><div><strong>كوكبة تاسي GOLD</strong><small>سحر الرقم للذهب</small></div></div><div class="poster"><div class="rings"></div><svg class="arrow" viewBox="0 0 100 120"><path d="M4 108L23 84L40 89L56 61L73 47L91 10" fill="none" stroke="#ffcc52" stroke-width="5"/><path d="M91 10L86 20M91 10L80 11" fill="none" stroke="#ffcc52" stroke-width="5"/></svg><div class="hood"></div><div class="title">كوكبة تاسي</div><div class="sub">سحر الرقم للذهب</div><div class="gold">GOLD</div></div><div class="info"><strong>كوكبة الأرقام السحرية</strong><br>الإصدار:<br>الوليد بن محمود سمان<br><span dir="ltr">m.a.m.1392@gmail.com</span><br><br>© 2026 كوكبة تاسي<br>جميع الحقوق محفوظة</div><div class="closeRow"><button id="aboutClose" class="close">إغلاق</button></div></div></div></div>

<script>
(()=>{'use strict';let z=.95,currentLang='en';const app=document.getElementById('app'),stage=document.getElementById('stage'),txt=document.getElementById('zoomText'),full=document.getElementById('full'),connectionOverlay=document.getElementById('connectionOverlay'),aboutOverlay=document.getElementById('aboutOverlay');
function apply(){z=Math.max(.25,Math.min(5,Math.round(z*100)/100));txt.textContent=Math.round(z*100)+'%';app.style.transform='scale('+z+')';app.style.width=(100/z)+'%';app.style.height=(100/z)+'%';stage.style.width='100%';stage.style.height='100%'}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null}
async function enterFullscreen(){const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(!fn)return false;try{const result=fn.call(el,{navigationUI:'hide'});if(result&&result.then)await result;return true}catch(e){try{const result=fn.call(el);if(result&&result.then)await result;return true}catch(_){return false}}}
async function exitFullscreen(){const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;if(!fn)return false;try{const result=fn.call(document);if(result&&result.then)await result;return true}catch(e){return false}}
async function toggleFullscreen(){if(fsElement())await exitFullscreen();else await enterFullscreen();syncFullscreenState()}
function syncFullscreenState(){const active=!!fsElement();full.setAttribute('aria-pressed',String(active));full.title=active?'Exit fullscreen':'Fullscreen'}
function applyLang(lang){currentLang=lang;const ar=lang==='ar';document.getElementById('langText').textContent=ar?'العربية':'English';document.getElementById('langFlag').textContent=ar?'🇸🇦':'🇬🇧';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';document.getElementById('bar').style.direction='ltr';try{app.contentWindow?.postMessage({type:'KAWKABAT_LANGUAGE_CHANGE',language:lang,direction:ar?'rtl':'ltr'},'*')}catch(e){}}
function openModal(el){el.classList.add('open');el.setAttribute('aria-hidden','false')}
function closeModal(el){el.classList.remove('open');el.setAttribute('aria-hidden','true')}
document.getElementById('minus').onclick=()=>{z-=.05;apply()};document.getElementById('plus').onclick=()=>{z+=.05;apply()};document.getElementById('reset').onclick=txt.onclick=()=>{z=.95;apply()};full.onclick=toggleFullscreen;['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(e=>document.addEventListener(e,syncFullscreenState));
document.getElementById('language').onclick=()=>applyLang(currentLang==='en'?'ar':'en');document.getElementById('connection').onclick=()=>openModal(connectionOverlay);document.getElementById('connectionX').onclick=document.getElementById('cancelConnection').onclick=()=>closeModal(connectionOverlay);document.getElementById('saveConnection').onclick=()=>closeModal(connectionOverlay);document.getElementById('testConnection').onclick=()=>alert('Connection settings are ready for testing.');
const proxySwitch=document.getElementById('proxySwitch'),proxyFields=['proxyType','server','port','login','password'].map(id=>document.getElementById(id));proxySwitch.onclick=()=>{const on=proxySwitch.getAttribute('aria-checked')!=='true';proxySwitch.setAttribute('aria-checked',String(on));proxySwitch.classList.toggle('on',on);proxyFields.forEach(el=>el.disabled=!on)};
document.getElementById('about').onclick=()=>openModal(aboutOverlay);document.getElementById('aboutX').onclick=document.getElementById('aboutClose').onclick=()=>closeModal(aboutOverlay);[connectionOverlay,aboutOverlay].forEach(el=>el.onclick=e=>{if(e.target===el)closeModal(el)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal(connectionOverlay);closeModal(aboutOverlay)}});apply();applyLang('en');syncFullscreenState()})();
</script>
</body>
</html>
