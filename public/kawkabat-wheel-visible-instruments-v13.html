<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية — Visible Instruments V13</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#F7F1E3}body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">جارٍ تحميل الأدوات داخل الجزء المرئي…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/1e78e173bdc2ff51a4827bb608831b3d7e81d17a/public/kawkabat-wheel-unified-tools-v11.html';
    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('V11_SOURCE_HTTP_'+response.status);
      var source=await response.text();
      source=source.replace('Unified Tools V11','Visible Instruments V13');
      source=source.replace('var guaranteedChronometerRadius=980;','var guaranteedChronometerRadius=520;');
      source=source.replace('var guaranteedProtractorRadius=1160;','var guaranteedProtractorRadius=680;');
      source=source.replace("'stroke-width':14", "'stroke-width':20");
      source=source.replace("'stroke-width':12", "'stroke-width':18");
      if(source.indexOf('var guaranteedChronometerRadius=520;')<0)throw new Error('CHRONOMETER_VISIBLE_RADIUS_PATCH_FAILED');
      if(source.indexOf('var guaranteedProtractorRadius=680;')<0)throw new Error('PROTRACTOR_VISIBLE_RADIUS_PATCH_FAILED');
      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل V13: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
