<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — الهيكل النهائي</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل الهيكل النهائي…</div>
  <script>
    (async function(){
      'use strict';
      var blobApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/13faefc8f64a97bd974281f6bc90cccc1536d828';
      try{
        var response=await fetch(blobApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok)throw new Error('SOURCE_HTTP_'+response.status);
        var payload=await response.json();
        var binary=atob(String(payload.content||'').replace(/\s/g,''));
        var bytes=new Uint8Array(binary.length);
        for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
        var html=new TextDecoder('utf-8').decode(bytes);

        html=html.replace(
          ".angle-band-inner-line{stroke:url(#ornateGold)!important;opacity:.95}",
          ".angle-band-inner-line{stroke:#C1872D!important;stroke-width:5.5!important;opacity:.82!important;filter:none!important}"
        );
        html=html.replace(
          "innerAngleGoldUnified:true,innerAngleGoldOpacity:.95,",
          "innerAngleGoldUnified:true,innerAngleGoldColor:'#C1872D',innerAngleGoldOpacity:.82,"
        );
        html=html.replace('build:43,','build:44,');

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading">تعذر تحميل الهيكل: '+String(error.message||error)+'</div>';
      }
    }());
  </script>
</body>
</html>
