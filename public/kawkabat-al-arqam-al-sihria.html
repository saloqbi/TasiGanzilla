<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Instruments V11</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل أدوات V11…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/75befd26d0a9668974130b0abfcc05d2da1c28b9/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/edca767d5f359d4a1dce97e81402eff508724df3/public/kawkabat-wheel-unified-tools-v10.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/1e78e173bdc2ff51a4827bb608831b3d7e81d17a/public/kawkabat-wheel-unified-tools-v11.html';
    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('V10_MAIN_HTTP_'+response.status);
      var source=await response.text();
      source=source.replace('Unified Tools V10','Instruments V11');
      if(source.indexOf(oldRuntime)<0)throw new Error('V10_RUNTIME_REFERENCE_NOT_FOUND');
      source=source.replace(oldRuntime,newRuntime);
      if(source.indexOf(newRuntime)<0)throw new Error('V11_RUNTIME_LINK_FAILED');
      if(source.indexOf(oldRuntime)>=0)throw new Error('V10_RUNTIME_STILL_PRESENT');
      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل أدوات V11: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
