<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Increment Active V1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العمل مع Increment…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/a99cfc66117a93c6f1af5e3c143d8286fa0cd397/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';
    var findRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/78f95dc694b82ec99293721361ed3aa694ffd2a9/public/kawkabat-wheel-runtime-find-v2.html';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('STABLE_PAGE_HTTP_'+response.status);
      var source=await response.text();
      source=source.replace('Magic Numbers Constellation — Direct Runtime','Magic Numbers Constellation — Increment Active V1');
      source=source.replace(oldRuntime,findRuntime);

      source=source.replace(
        "        var incrementControl=document.querySelector('[aria-label=\"Increment\"]');",
        "        var incrementControl=document.querySelector('[aria-label=\"Increment\"]');\n        var findControl=document.querySelector('[aria-label=\"Find\"]');"
      );

      source=source.replace(
        "        function numeric(control,fallback){\n          var parsed=Number(String(control&&control.value||fallback).replace(',','.'));\n          return Number.isFinite(parsed)?parsed:fallback;\n        }",
        "        function normalizeNumericText(value){\n          var arabic='٠١٢٣٤٥٦٧٨٩',persian='۰۱۲۳۴۵۶۷۸۹';\n          return String(value==null?'':value).trim()\n            .replace(/[٠-٩]/g,function(d){return String(arabic.indexOf(d));})\n            .replace(/[۰-۹]/g,function(d){return String(persian.indexOf(d));})\n            .replace(/[،,٫]/g,'.');\n        }\n        function numeric(control,fallback){\n          var parsed=Number(normalizeNumericText(control&&control.value||fallback));\n          return Number.isFinite(parsed)?parsed:fallback;\n        }"
      );

      source=source.replace(
        "        function applyDirection(){",
        "        var buildRuntimeUrlWithoutFind=buildRuntimeUrl;\n        buildRuntimeUrl=function(direction,nonce){\n          var url=buildRuntimeUrlWithoutFind(direction,nonce);\n          var findText=normalizeNumericText(findControl&&findControl.value||'');\n          return url+'&find='+encodeURIComponent(findText);\n        };\n        function applyDirection(){"
      );

      source=source.replace(
        "&&valueControl&&incrementControl){",
        "&&valueControl&&incrementControl&&findControl){"
      );

      source=source.replace(
        "          incrementControl.value='1';incrementControl.inputMode='decimal';",
        "          incrementControl.value='1';incrementControl.inputMode='decimal';incrementControl.step='any';incrementControl.setAttribute('step','any');\n          findControl.value='0.01';findControl.inputMode='decimal';"
      );

      source=source.replace(
        "          incrementControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();reloadWheels();}});",
        "          incrementControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();reloadWheels();}});\n          findControl.addEventListener('input',scheduleReload);\n          findControl.addEventListener('change',reloadWheels);\n          findControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();reloadWheels();}});\n          window.__auditKawkabatIncrementBindingV1=function(){return{ok:true,value:numeric(valueControl,0.01),increment:numeric(incrementControl,1),decimalStep:incrementControl.step==='any'};};"
      );

      source=source.replace(
        "          setStatus('error','تعذر تهيئة أدوات العجلة');",
        "          setStatus('error','تعذر تهيئة أدوات العجلة أو Increment أو Find');"
      );

      if(source.indexOf(findRuntime)<0)throw new Error('INCREMENT_RUNTIME_LINK_FAILED');
      if(source.indexOf('function normalizeNumericText')<0)throw new Error('INCREMENT_NORMALIZER_FAILED');
      if(source.indexOf("incrementControl.addEventListener('input',scheduleReload)")<0)throw new Error('INCREMENT_INPUT_BINDING_FAILED');
      if(source.indexOf("incrementControl.addEventListener('change',reloadWheels)")<0)throw new Error('INCREMENT_CHANGE_BINDING_FAILED');
      if(source.indexOf("incrementControl.step='any'")<0)throw new Error('INCREMENT_DECIMAL_STEP_FAILED');
      if(source.indexOf('window.__auditKawkabatIncrementBindingV1')<0)throw new Error('INCREMENT_AUDIT_FAILED');

      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Increment: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
