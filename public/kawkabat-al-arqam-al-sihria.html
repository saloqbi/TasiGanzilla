<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Square of 9 Angle Wheel V2</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Tahoma,sans-serif;color:#4d4740}
body{display:grid;place-items:center}.loading{font-weight:800}.error{max-width:760px;padding:14px;border:1px solid #a32935;border-radius:7px;background:#fff3f3;color:#8c101c}
</style>
</head>
<body>
<div class="loading">جارٍ ضبط عجلة الزوايا والأبراج والكواكب…</div>
<script>
(async function(){
'use strict';
var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/6546286934d7f1df46fc96ddf5ea59af64dc07d3/public/kawkabat-al-arqam-al-sihria.html';
function replaceBetween(source,start,end,replacement){
  var from=source.indexOf(start);
  if(from<0)throw new Error('START_MARKER_NOT_FOUND_'+start);
  var to=source.indexOf(end,from+start.length);
  if(to<0)throw new Error('END_MARKER_NOT_FOUND_'+end);
  return source.slice(0,from)+replacement+'\n'+source.slice(to);
}
try{
  var response=await fetch(sourceUrl,{cache:'no-store'});
  if(!response.ok)throw new Error('SOURCE_HTTP_'+response.status);
  var source=await response.text();
  source=source.replace('Square of 9 Reference Engine','Square of 9 Angle Wheel V2');

  var zodiacReplacement=`function drawZodiac(parent){
    for(let i=0;i<12;i++){
      const mid=i*30-90,a0=mid-15,a1=mid+15;
      parent.appendChild(S('path',{d:polarArc(452,474,a0,a1),fill:zodiac[i][2],stroke:'#cfcfcf','stroke-width':1}));
      const p=pt(463,mid);let rot=((mid%360)+360)%360;if(rot>90&&rot<270)rot+=180;
      text(parent,zodiac[i][0],p.x,p.y,9.4,'#222',750,rot);
      const b=pt(452,a0);
      parent.appendChild(S('circle',{cx:b.x,cy:b.y,r:15.5,fill:'#fff','fill-opacity':.54,stroke:zodiac[i][2],'stroke-width':2.2}));
      text(parent,zodiac[i][1],b.x,b.y,19.5,zodiac[i][2],900);
    }
    document.documentElement.dataset.zodiacOrientation='aries-left-cancer-top';
  }`;

  var angleReplacement=`function drawDegreeRings(parent){
    parent.appendChild(S('circle',{cx:500,cy:500,r:438,fill:'#fff','fill-opacity':.72,stroke:'#aaa','stroke-width':1.1}));
    [430,422,414,404,394,382,370].forEach((r,i)=>parent.appendChild(S('circle',{cx:500,cy:500,r,fill:'none',stroke:i===0?'#949494':i===2?'#b1b1b1':'#d2d2d2','stroke-width':i===0?1.2:i===2?1:.65})));
    for(let geo=0;geo<360;geo+=1){
      const shown=(geo+90)%360;
      const major=shown%10===0,medium=!major&&shown%5===0;
      const outer=pt(422,geo),inner=pt(422-(major?14:medium?8:4),geo);
      const cardinal=shown%90===0;
      line(parent,outer,inner,major?'#d34b4b':medium?'#6f6f6f':'#b9b9b9',cardinal?2.1:major?1.35:medium?.8:.4,major?1:.82,.95);
      if(shown%5===0){
        const p=pt(398,geo);let rot=((geo%360)+360)%360;if(rot>90&&rot<270)rot+=180;
        const label=shown===0?'0°':shown+'°';
        text(parent,label,p.x,p.y,cardinal?10.8:major?8.4:7.1,cardinal?'#111':major?'#343434':'#777',cardinal?900:major?750:500,rot);
      }
    }
    const dateLabels=[[0,'21 JUN',true],[90,'22 SEP',true],[180,'21 DEC',true],[270,'21 MAR',true],[30,'23 JUL',false],[60,'6 JUL',false],[120,'22 AUG',false],[150,'7 OCT',false],[210,'21 NOV',false],[240,'6 NOV',false],[300,'6 MAY',false],[330,'21 MAY',false]];
    dateLabels.forEach(([geo,label,isQuarter])=>{
      const p=pt(isQuarter?432:410,geo);const fill=isQuarter?'#f8dada':'#edf6e9',stroke=isQuarter?'#e96f6f':'#70af6a';
      const width=label.length*5.6+10;let rot=((geo%360)+360)%360;if(rot>90&&rot<270)rot+=180;
      parent.appendChild(S('rect',{x:p.x-width/2,y:p.y-8,width,height:16,rx:7,fill,stroke,'stroke-width':1.1,transform:'rotate('+rot+' '+p.x+' '+p.y+')'}));
      text(parent,label,p.x,p.y,8,isQuarter?'#7a2727':'#315d31',isQuarter?850:700,rot);
    });
    [[0,'90°'],[90,'180°'],[180,'270°'],[270,'0°']].forEach(([geo,label])=>{
      const p=pt(366,geo);text(parent,label,p.x,p.y,10.8,'#111',900,((geo%360)+360)%360>90&&((geo%360)+360)%360<270?geo+180:geo);
    });
    document.documentElement.dataset.angleWheelReady='true';
    document.documentElement.dataset.angleWheelOrientation='0-left-90-top-180-right-270-bottom';
  }`;

  var planetReplacement=`function drawPlanets(parent){
    const ring=360;
    planetData.forEach(([glyph,displayAngle,c],i)=>{
      const geo=displayAngle-90,p=pt(ring,geo);
      parent.appendChild(S('circle',{cx:p.x,cy:p.y,r:i<2?13:5.5,fill:'#fff','fill-opacity':.92,stroke:c,'stroke-width':i<2?2:1.2}));
      text(parent,glyph,p.x,p.y,12,c,900);
    });
    aspects.forEach(([c,i,j])=>{
      const a=pt(ring,planetData[i][1]-90),b=pt(ring,planetData[j][1]-90);
      line(parent,a,b,c,c==='red'?2:1.4,c==='red'?.45:.6,c==='green'?'5 4':'');
    });
    document.documentElement.dataset.planetOrientation='display-angle-minus-90';
  }`;

  var markerReplacement=`function drawOrbitMarkers(parent){
    const markers=[[315,'♀','#61b865'],[300,'♀','#61b865'],[270,'☾','#e75b5b'],[55,'☉','#ef5b5b'],[125,'♂','#ef5b5b'],[210,'☽','#61b865']];
    markers.forEach(([displayAngle,glyph,c])=>{
      const p=pt(378,displayAngle-90);
      parent.appendChild(S('circle',{cx:p.x,cy:p.y,r:12,fill:c,'fill-opacity':.18,stroke:c,'stroke-width':1.5}));
      text(parent,glyph,p.x,p.y,13,c,900);
    });
  }`;

  var figuresReplacement=`function drawOptionalFigures(parent){
    const figs={Triangle:3,Square:4,Pentagon:5,Hexagon:6,Septagon:7,Octagon:8,Nonagon:9,Dodecagon:12};
    let idx=0;
    Object.entries(figs).forEach(([name,sides])=>{
      if(!val('figure.'+name+'.visible',false))return;
      const r=250+idx*13,displayAngle=Number(val('figure.'+name+'.angle',0))||0,geo=displayAngle-90,c=color(name,'#777');
      let d='';for(let i=0;i<sides;i++){const p=pt(r,geo+i*360/sides);d+=(i?'L':'M')+p.x+' '+p.y+' '}
      parent.appendChild(S('path',{d:d+'Z',fill:'none',stroke:c,'stroke-width':val('figure.'+name+'.highlight',true)?4:2,'stroke-opacity':.72}));idx++;
    });
  }`;

  source=replaceBetween(source,'function drawZodiac(parent){','function drawDegreeRings(parent){',zodiacReplacement);
  source=replaceBetween(source,'function drawDegreeRings(parent){','function drawSquare(parent){',angleReplacement);
  source=replaceBetween(source,'function drawPlanets(parent){','function drawOrbitMarkers(parent){',planetReplacement);
  source=replaceBetween(source,'function drawOrbitMarkers(parent){','function drawOptionalFigures(parent){',markerReplacement);
  source=replaceBetween(source,'function drawOptionalFigures(parent){','function renderSquare9(){',figuresReplacement);
  source=source.replace("status.textContent='Square of 9 • 19×19 • 1–361 • الشعار والإطار مخفيان'","status.textContent='Square of 9 • عجلة الزوايا 0°–360° • 90° أعلى • 19×19 • 1–361'");

  if(source.indexOf("angleWheelOrientation='0-left-90-top-180-right-270-bottom'")<0)throw new Error('ANGLE_WHEEL_PATCH_FAILED');
  if(source.indexOf("zodiacOrientation='aries-left-cancer-top'")<0)throw new Error('ZODIAC_ORIENTATION_PATCH_FAILED');
  if(source.indexOf("planetOrientation='display-angle-minus-90'")<0)throw new Error('PLANET_ORIENTATION_PATCH_FAILED');
  document.open();document.write(source);document.close();
}catch(error){
  document.body.innerHTML='<div class="error">تعذر تشغيل النسخة المصححة: '+String(error&&error.message||error)+'</div>';
}
}());
</script>
</body>
</html>
