<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Data Type Active</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading Data type work…</div>
  <script>
  (async function(){
    'use strict';

    var newWorkUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/c611a5bdcca7a18125113fa9382ea346e376ff9b/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/112477f023dfe9b8e66f0b49f5a27a507cd46a7e/public/kawkabat-wheel-view-runtime.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/736c141a7e0b063c5c15c3ec695050774e241c51/public/kawkabat-wheel-data-runtime-v4.html';

    try{
      var response=await fetch(newWorkUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('NEW_WORK_HTTP_'+response.status);
      var html=await response.text();

      html=html.replace('Clockwise, Size and View','Clockwise, Size, View and Data Type');
      html=html.replace(oldRuntime,newRuntime);

      var reloadPattern=/clockwiseWheel\.src=buildViewUrl\('cw'\);\s*counterclockwiseWheel\.src=buildViewUrl\('ccw'\);\s*applyWheelDirection\(\);/;
      var reloadCode=
        "var nextClockwiseUrl=buildViewUrl('cw');\n"+
        "          var nextCounterclockwiseUrl=buildViewUrl('ccw');\n"+
        "          clockwiseWheel.src='about:blank';\n"+
        "          counterclockwiseWheel.src='about:blank';\n"+
        "          window.setTimeout(function(){\n"+
        "            clockwiseWheel.src=nextClockwiseUrl;\n"+
        "            counterclockwiseWheel.src=nextCounterclockwiseUrl;\n"+
        "            applyWheelDirection();\n"+
        "          },0);";
      html=html.replace(reloadPattern,reloadCode);

      html=html.replace(
        "        var viewControl=document.querySelector('[aria-label=\"View\"]');\n        var panelStatus=document.querySelector('.panel-bottom');",
        "        var viewControl=document.querySelector('[aria-label=\"View\"]');\n        var dataTypeControl=document.querySelector('[aria-label=\"Data type\"]');\n        var panelStatus=document.querySelector('.panel-bottom');"
      );

      html=html.replace(
        "        function setWheelStatus(mode,message){",
        "        var dataTypeOptions=[\n          {value:'price',label:'Price'},\n          {value:'date',label:'Date'},\n          {value:'time',label:'Time'},\n          {value:'priceDate',label:'Price and date'},\n          {value:'priceTime',label:'Price and time'}\n        ];\n\n        function setWheelStatus(mode,message){"
      );

      html=html.replace(
        "        function buildViewUrl(direction){\n          var view=viewControl&&viewControl.value?viewControl.value:'circle36';\n          return runtimeBase+'#view='+encodeURIComponent(view)+'&direction='+direction;\n        }",
        "        function buildViewUrl(direction){\n          var view=viewControl&&viewControl.value?viewControl.value:'circle36';\n          var dataType=dataTypeControl&&dataTypeControl.value?dataTypeControl.value:'price';\n          return runtimeBase+'#view='+encodeURIComponent(view)+'&direction='+direction+'&dataType='+encodeURIComponent(dataType);\n        }"
      );

      html=html.replace(
        "        function applyWheelDirection(){",
        "        function populateDataTypeOptions(){\n          if(!dataTypeControl)return;\n          dataTypeControl.innerHTML='';\n          dataTypeOptions.forEach(function(item){\n            var option=document.createElement('option');\n            option.value=item.value;\n            option.textContent=item.label;\n            dataTypeControl.appendChild(option);\n          });\n          dataTypeControl.value='price';\n        }\n\n        function selectedDataTypeLabel(){\n          return dataTypeControl&&dataTypeControl.options[dataTypeControl.selectedIndex]?dataTypeControl.options[dataTypeControl.selectedIndex].textContent:'Price';\n        }\n\n        function applyWheelDirection(){"
      );

      html=html.replace(
        "          setWheelStatus('success',(clockwiseControl.checked?'مع عقارب الساعة':'عكس عقارب الساعة')+' • '+selectedViewLabel());",
        "          setWheelStatus('success',(clockwiseControl.checked?'مع عقارب الساعة':'عكس عقارب الساعة')+' • '+selectedViewLabel()+' • '+selectedDataTypeLabel());"
      );

      html=html.replace(
        "        if(wheelStack&&clockwiseWheel&&counterclockwiseWheel&&clockwiseControl&&visibleControl&&sizeControl&&viewControl){",
        "        if(wheelStack&&clockwiseWheel&&counterclockwiseWheel&&clockwiseControl&&visibleControl&&sizeControl&&viewControl&&dataTypeControl){"
      );

      html=html.replace(
        "          populateViewOptions();",
        "          populateViewOptions();\n          populateDataTypeOptions();"
      );

      html=html.replace(
        "          viewControl.addEventListener('change',loadSelectedView);",
        "          viewControl.addEventListener('change',loadSelectedView);\n          dataTypeControl.addEventListener('change',loadSelectedView);"
      );

      html=html.replace(
        "          setWheelStatus('error','تعذر تهيئة Clockwise أو Size أو View');",
        "          setWheelStatus('error','تعذر تهيئة Clockwise أو Size أو View أو Data type');"
      );

      if(html.indexOf(newRuntime)<0)throw new Error('DATA_RUNTIME_LINK_FAILED');
      if(html.indexOf(oldRuntime)>=0)throw new Error('OLD_VIEW_RUNTIME_STILL_PRESENT');
      if(html.indexOf('var dataTypeControl=')<0)throw new Error('DATA_TYPE_CONTROL_PATCH_FAILED');
      if(html.indexOf("dataTypeControl.addEventListener('change',loadSelectedView)")<0)throw new Error('DATA_TYPE_EVENT_PATCH_FAILED');
      if(html.indexOf("&dataType=")<0)throw new Error('DATA_TYPE_URL_PATCH_FAILED');
      if(html.indexOf("clockwiseWheel.src='about:blank'")<0)throw new Error('FORCE_RELOAD_PATCH_FAILED');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load Data type work: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
