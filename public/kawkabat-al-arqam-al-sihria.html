<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Value Active V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading Value work…</div>
  <script>
  (async function(){
    'use strict';

    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/ed08ec6d205d80ef203060556dc790b0ee99418a/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/736c141a7e0b063c5c15c3ec695050774e241c51/public/kawkabat-wheel-data-runtime-v4.html';
    var valueRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/0f42c11b7d9787c065bb6c702c646e136e8c36f7/public/kawkabat-wheel-data-runtime-v4.html';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('VALUE_SOURCE_HTTP_'+response.status);
      var source=await response.text();

      source=source.replace('Data Type Active','Value Active V3');
      source=source.replace(oldRuntime,valueRuntime);

      var sourceWriteMarker="      document.open();\n      document.write(html);\n      document.close();";
      var valuePatch=`      var panelRuntimeMarker='requestAnimationFrame(updateThumb);';
      if(html.indexOf(panelRuntimeMarker)<0)throw new Error('VALUE_PANEL_RUNTIME_MARKER_NOT_FOUND');

      var valueBinding=
        "var valueControl=document.querySelector('[aria-label=\\\"Value\\\"]'),incrementControl=document.querySelector('[aria-label=\\\"Increment\\\"]');"+
        "var valueReloadTimer=0;"+
        "function normalizeValueNumber(control,fallback){var parsed=Number(String(control&&control.value||fallback).replace(',','.'));return Number.isFinite(parsed)?parsed:fallback;}"+
        "buildViewUrl=function(direction){var view=viewControl&&viewControl.value?viewControl.value:'circle36',dataType=dataTypeControl&&dataTypeControl.value?dataTypeControl.value:'price',value=normalizeValueNumber(valueControl,0.01),increment=normalizeValueNumber(incrementControl,1);if(increment===0)increment=1;return runtimeBase+'#view='+encodeURIComponent(view)+'&direction='+direction+'&dataType='+encodeURIComponent(dataType)+'&value='+encodeURIComponent(value)+'&increment='+encodeURIComponent(increment);};"+
        "function applyValueNow(){window.clearTimeout(valueReloadTimer);if(!valueControl||!incrementControl)return;var value=normalizeValueNumber(valueControl,0.01),increment=normalizeValueNumber(incrementControl,1);if(increment===0){increment=1;incrementControl.value='1';}valueControl.value=String(value);loadSelectedView();setWheelStatus('success','Value = '+value+' • Increment = '+increment);}"+
        "function scheduleValueApply(){window.clearTimeout(valueReloadTimer);valueReloadTimer=window.setTimeout(applyValueNow,260);}"+
        "if(valueControl&&incrementControl){valueControl.value='0.01';valueControl.inputMode='decimal';incrementControl.inputMode='decimal';valueControl.addEventListener('input',scheduleValueApply);incrementControl.addEventListener('input',scheduleValueApply);valueControl.addEventListener('change',applyValueNow);incrementControl.addEventListener('change',applyValueNow);valueControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyValueNow();}});incrementControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyValueNow();}});window.setTimeout(applyValueNow,0);}else{setWheelStatus('error','تعذر ربط Value و Increment');}";

      html=html.replace(panelRuntimeMarker,valueBinding+panelRuntimeMarker);
      if(html.indexOf("valueControl.addEventListener('input',scheduleValueApply)")<0)throw new Error('VALUE_INPUT_BINDING_FAILED');
      if(html.indexOf("+'&value='+encodeURIComponent(value)")<0)throw new Error('VALUE_URL_BINDING_FAILED');
`;

      if(source.indexOf(sourceWriteMarker)<0)throw new Error('VALUE_SOURCE_WRITE_MARKER_NOT_FOUND');
      source=source.replace(sourceWriteMarker,valuePatch+sourceWriteMarker);
      if(source.indexOf(valueRuntime)<0)throw new Error('VALUE_RUNTIME_LINK_FAILED');
      if(source.indexOf(oldRuntime)>=0)throw new Error('OLD_VALUE_RUNTIME_STILL_PRESENT');

      document.open();
      document.write(source);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load Value work: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
