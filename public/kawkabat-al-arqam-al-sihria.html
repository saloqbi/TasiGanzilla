<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Value Active V2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading Value work…</div>
  <script>
  (async function(){
    'use strict';

    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/ed08ec6d205d80ef203060556dc790b0ee99418a/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/736c141a7e0b063c5c15c3ec695050774e241c51/public/kawkabat-wheel-data-runtime-v4.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/34ba76c9c3bbfd094c3771d9c3a89fc7119c11e4/public/kawkabat-wheel-data-runtime-v4.html';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('VALUE_SOURCE_HTTP_'+response.status);
      var source=await response.text();

      source=source.replace('Data Type Active','Value Active V2');
      source=source.replace(oldRuntime,newRuntime);

      var sourceWriteMarker="      document.open();\n      document.write(html);\n      document.close();";
      var valuePatch=`      /* Value binding V2: patch the fully generated panel page. */
      html=html.replace(
        /(var dataTypeControl=document\\.querySelector\\('\\[aria-label=\"Data type\"\\]'\\);)\\s*(var panelStatus=document\\.querySelector\\('\\.panel-bottom'\\);)/,
        "$1\\n        var valueControl=document.querySelector('[aria-label=\\\"Value\\\"]');\\n        var incrementControl=document.querySelector('[aria-label=\\\"Increment\\\"]');\\n        $2"
      );

      html=html.replace(
        /function buildViewUrl\\(direction\\)\\{[\\s\\S]*?return runtimeBase\\+'#view='\\+encodeURIComponent\\(view\\)\\+'&direction='\\+direction\\+'&dataType='\\+encodeURIComponent\\(dataType\\);\\s*\\}/,
        "function buildViewUrl(direction){\\n          var view=viewControl&&viewControl.value?viewControl.value:'circle36';\\n          var dataType=dataTypeControl&&dataTypeControl.value?dataTypeControl.value:'price';\\n          var value=Number(String(valueControl&&valueControl.value||'0.01').replace(',','.'));\\n          var increment=Number(String(incrementControl&&incrementControl.value||'1').replace(',','.'));\\n          if(!Number.isFinite(value))value=0.01;\\n          if(!Number.isFinite(increment)||increment===0)increment=1;\\n          return runtimeBase+'#view='+encodeURIComponent(view)+'&direction='+direction+'&dataType='+encodeURIComponent(dataType)+'&value='+encodeURIComponent(value)+'&increment='+encodeURIComponent(increment);\\n        }"
      );

      html=html.replace(
        '&&viewControl&&dataTypeControl){',
        '&&viewControl&&dataTypeControl&&valueControl&&incrementControl){'
      );

      html=html.replace(
        '          populateDataTypeOptions();',
        "          populateDataTypeOptions();\\n          valueControl.value='0.01';\\n          valueControl.inputMode='decimal';"
      );

      html=html.replace(
        "          dataTypeControl.addEventListener('change',loadSelectedView);",
        "          dataTypeControl.addEventListener('change',loadSelectedView);\\n          valueControl.addEventListener('change',loadSelectedView);\\n          incrementControl.addEventListener('change',loadSelectedView);\\n          valueControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();loadSelectedView();}});\\n          incrementControl.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();loadSelectedView();}});"
      );

      html=html.replace(
        'تعذر تهيئة Clockwise أو Size أو View أو Data type',
        'تعذر تهيئة Clockwise أو Size أو View أو Data type أو Value'
      );

      if(html.indexOf('var valueControl=')<0)throw new Error('VALUE_CONTROL_PATCH_FAILED');
      if(html.indexOf("valueControl.value='0.01'")<0)throw new Error('VALUE_DEFAULT_PATCH_FAILED');
      if(html.indexOf("+'&value='+encodeURIComponent(value)")<0)throw new Error('VALUE_URL_PATCH_FAILED');
      if(html.indexOf("valueControl.addEventListener('change',loadSelectedView)")<0)throw new Error('VALUE_EVENT_PATCH_FAILED');
`;

      if(source.indexOf(sourceWriteMarker)<0)throw new Error('VALUE_SOURCE_WRITE_MARKER_NOT_FOUND');
      source=source.replace(sourceWriteMarker,valuePatch+sourceWriteMarker);

      if(source.indexOf(newRuntime)<0)throw new Error('VALUE_RUNTIME_LINK_FAILED');
      if(source.indexOf(oldRuntime)>=0)throw new Error('OLD_DATA_RUNTIME_STILL_PRESENT');

      document.open();
      document.write(source);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load Value work: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
