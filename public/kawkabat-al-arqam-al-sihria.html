<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — الهيكل النهائي</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل الهيكل النهائي…</div>
  <script>
    (async function(){
      'use strict';
      var blobApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/b8cec022685d53af5a5d1c7ed3b5e99a2c25d47a';
      try{
        var response=await fetch(blobApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok)throw new Error('SOURCE_HTTP_'+response.status);
        var payload=await response.json();
        var binary=atob(String(payload.content||'').replace(/\s/g,''));
        var bytes=new Uint8Array(binary.length);
        for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
        var html=new TextDecoder('utf-8').decode(bytes);

        html=html.replace(
          /<linearGradient id="angleGoldBand"[\s\S]*?<\/linearGradient>/,
          '<linearGradient id="angleGoldBand" x1="0%" y1="0%" x2="0%" y2="100%">'+
          '<stop offset="0%" stop-color="#75665E"/>'+
          '<stop offset="12%" stop-color="#A38F82"/>'+
          '<stop offset="28%" stop-color="#C7B3A4"/>'+
          '<stop offset="44%" stop-color="#DFD0C3"/>'+
          '<stop offset="57%" stop-color="#BBA697"/>'+
          '<stop offset="72%" stop-color="#D1BDAE"/>'+
          '<stop offset="87%" stop-color="#9C887B"/>'+
          '<stop offset="100%" stop-color="#6B5D56"/>'+
          '</linearGradient>'+
          '<linearGradient id="angleTaupeEdge" x1="0%" y1="0%" x2="100%" y2="100%">'+
          '<stop offset="0%" stop-color="#514640"/>'+
          '<stop offset="20%" stop-color="#927C6F"/>'+
          '<stop offset="40%" stop-color="#DFCBBB"/>'+
          '<stop offset="55%" stop-color="#AC9585"/>'+
          '<stop offset="75%" stop-color="#C8B09D"/>'+
          '<stop offset="100%" stop-color="#50453F"/>'+
          '</linearGradient>'
        );

        html=html
          .replace('.angle-band-shadow{fill:none;stroke:#3A2112;', '.angle-band-shadow{fill:none;stroke:#4A403A;')
          .replace('stroke:url(#ornateGold);vector-effect:non-scaling-stroke}.angle-band-inner-line', 'stroke:url(#angleTaupeEdge);vector-effect:non-scaling-stroke}.angle-band-inner-line')
          .replace('.angle-band-highlight{fill:none;stroke:#FFF0BE;', '.angle-band-highlight{fill:none;stroke:#EFE2D5;')
          .replace('stroke:#F4D99D;stroke-width:.8;', 'stroke:#D1BFAF;stroke-width:.8;');

        html=html.replace('window.__auditKawkabatFinalStructureV3=function(){return{','window.__auditKawkabatFinalStructureV5=function(){return{anglePalette:\'approved-light-champagne-taupe\',angleGeometryChanged:false,');
        html=html.replace('build:27,','build:29,');

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading">تعذر تحميل الهيكل: '+String(error.message||error)+'</div>';
      }
    }());
  </script>
</body>
</html>
