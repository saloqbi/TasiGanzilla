<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Square of 9 بدون الإطار الأسود</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#fff;color:#554b42;font-weight:800}
#error{position:fixed;right:16px;bottom:14px;z-index:8;display:none;max-width:560px;padding:9px 12px;border:1px solid #a32935;border-radius:6px;background:#fff3f3;color:#8c101c;font-weight:800}
</style>
</head>
<body>
<iframe id="app" title="Square of 9 without persisted black frame"></iframe>
<div id="loading">جارٍ إزالة الإطار الأسود المحفوظ…</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var SOURCE='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/d28c06559b52617bb92b4df75da0bf4ba942d427/public/kawkabat-al-arqam-al-sihria.html';
var STORAGE='kawkabat-complete-panel-v1';
var MIGRATION='kawkabat-square9-remove-black-optional-frame-v4';
var FIGURES=['Triangle','Square','Pentagon','Hexagon','Septagon','Octagon','Nonagon','Decagon','Hendecagon','Dodecagon'];
var frame=document.getElementById('app');
var loading=document.getElementById('loading');
var errorBox=document.getElementById('error');

function readState(){
  try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')||{};}catch(_){return {};}
}
function writeState(state){localStorage.setItem(STORAGE,JSON.stringify(state));}
function clearPersistedOptionalFiguresOnce(){
  if(localStorage.getItem(MIGRATION)==='done')return;
  var state=readState();
  FIGURES.forEach(function(name){
    state['figure.'+name+'.visible']=false;
  });
  state['figures.hide']=false;
  state['vectors.visible']=false;
  state['locator.visible']=false;
  state['vortex.visible']=false;
  state['marker.visible']=false;
  writeState(state);
  localStorage.setItem(MIGRATION,'done');
}
function anyOptionalFigureEnabled(){
  var state=readState();
  return FIGURES.some(function(name){return state['figure.'+name+'.visible']===true||state['figure.'+name+'.visible']==='true';})||
    state['vectors.visible']===true||state['vectors.visible']==='true'||
    state['locator.visible']===true||state['locator.visible']==='true'||
    state['vortex.visible']===true||state['vortex.visible']==='true';
}
function innerDocument(){
  try{return frame.contentDocument||null;}catch(_){return null;}
}
function applyBlackFrameGate(){
  try{
    var doc=innerDocument();
    if(!doc)return false;
    var square=doc.getElementById('squareSvg');
    if(!square)return false;
    var optional=doc.getElementById('optional');
    var enabled=anyOptionalFigureEnabled();
    if(optional){
      optional.style.setProperty('display',enabled?'':'none','important');
      optional.setAttribute('aria-hidden',enabled?'false':'true');
      if(!enabled&&optional.childNodes.length)optional.replaceChildren();
    }
    doc.querySelectorAll('[data-black-optional-frame="true"]').forEach(function(node){node.remove();});
    doc.documentElement.dataset.square9OptionalFiguresEnabled=enabled?'true':'false';
    doc.documentElement.dataset.square9BlackFrameRemoved=enabled?'false':'true';
    errorBox.style.display='none';
    return true;
  }catch(error){
    errorBox.style.display='block';
    errorBox.textContent='BLACK FRAME GATE ERROR: '+String(error&&error.message||error);
    return false;
  }
}

clearPersistedOptionalFiguresOnce();
frame.addEventListener('load',function(){
  if(loading)loading.remove();
  setTimeout(applyBlackFrameGate,180);
  setTimeout(applyBlackFrameGate,600);
  setTimeout(applyBlackFrameGate,1300);
});
frame.src=SOURCE;
window.setInterval(applyBlackFrameGate,350);
window.__auditSquare9RemoveBlackFrameV4=function(){
  var doc=innerDocument();
  var optional=doc?doc.getElementById('optional'):null;
  return{
    ok:!!doc,
    migration:localStorage.getItem(MIGRATION),
    optionalFiguresEnabled:anyOptionalFigureEnabled(),
    optionalGroupVisible:optional?optional.style.display!=='none':null,
    blackFrameRemoved:doc?doc.documentElement.dataset.square9BlackFrameRemoved:null,
    controlledFigures:FIGURES.slice()
  };
};
}());
</script>
</body>
</html>
