<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — الهيكل الأساسي للعجلة</title>
  <meta name="description" content="القاعدة الجديدة المستقلة لهيكل عجلة كوكبة الأرقام السحرية" />
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4efe3;
      color: #17120b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.98), rgba(247,242,230,.96) 58%, #e8deca 100%);
    }
    main {
      width: min(96vw, 1180px);
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 800;
      color: #2e1b08;
      text-align: center;
    }
    .subtitle {
      margin: 0;
      color: #75654e;
      font-size: clamp(13px, 1.5vw, 17px);
      text-align: center;
    }
    .wheel-shell {
      width: min(88vw, 880px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 30px rgba(61,39,11,.14));
    }
    .wheel-field {
      fill: #fffdf7;
      stroke: #caa66a;
      stroke-width: 2.2;
    }
    .outer-band {
      fill: none;
      stroke-linecap: round;
    }
    .outer-1 { stroke: #241407; stroke-width: 18; }
    .outer-2 { stroke: #c98a2d; stroke-width: 10; }
    .outer-3 { stroke: #f3d48e; stroke-width: 4; }
    .inner-boundary {
      fill: #fffdf7;
      stroke: #a87528;
      stroke-width: 3;
    }
    .ring {
      fill: none;
      stroke: #d9cdb6;
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
    }
    .ring-major {
      stroke: #b89250;
      stroke-width: 2.2;
    }
    .spoke {
      stroke: #d3c6ad;
      stroke-width: 1.15;
      vector-effect: non-scaling-stroke;
    }
    .spoke-third {
      stroke: #b79b6c;
      stroke-width: 1.8;
    }
    .spoke-cardinal {
      stroke: #8d5b16;
      stroke-width: 4.4;
    }
    .center-disc {
      fill: #fffaf0;
      stroke: #9c681b;
      stroke-width: 4;
    }
    .center-ring {
      fill: none;
      stroke: #e4c98b;
      stroke-width: 9;
    }
    .center-title {
      font-family: Arial, Tahoma, sans-serif;
      font-size: 25px;
      font-weight: 800;
      fill: #56360d;
      text-anchor: middle;
    }
    .center-subtitle {
      font-family: Arial, Tahoma, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #8b713f;
      text-anchor: middle;
    }
    .cardinal-label circle {
      fill: #211307;
      stroke: #d19a42;
      stroke-width: 3;
    }
    .cardinal-label text {
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      fill: #fff1bd;
    }
    footer {
      font-size: 13px;
      color: #776a57;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>كوكبة الأرقام السحرية</h1>
    <p class="subtitle">الهيكل الأساسي الجديد — 36 شعاعًا × 10 حلقات × سلطة SVG واحدة</p>
