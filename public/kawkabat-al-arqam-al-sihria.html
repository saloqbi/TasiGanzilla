<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Square of 9 Fraction Guides V10</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;color:#554b42;font-weight:800}
#error{position:fixed;right:16px;bottom:14px;z-index:30;display:none;max-width:620px;padding:10px 14px;border:1px solid #a32935;border-radius:6px;background:#fff3f3;color:#8c101c;font-weight:800}
</style>
</head>
<body>
<iframe id="app" title="Square of 9 fraction guides"></iframe>
<div id="loading">جارٍ إضافة الكسور ونقاط المحاور الناقصة…</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var SOURCE='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/59bc862aa4a2d4e049a6d1e564e8be3c88660451/public/kawkabat-al-arqam-al-sihria.html';
var NS='http://www.w3.org/2000/svg';
var ROOT_ID='fractionGuidesV10';
var frame=document.getElementById('app');
var loading=document.getElementById('loading');
var errorBox=document.getElementById('error');

function findSquareDocument(win,seen){
  seen=seen||new Set();
  try{
    if(!win||seen.has(win))return null;
    seen.add(win);
    var doc=win.document;
    if(doc&&doc.getElementById('squareSvg'))return doc;
    var frames=doc?Array.from(doc.querySelectorAll('iframe')):[];
    for(var i=0;i<frames.length;i++){
      try{var found=findSquareDocument(frames[i].contentWindow,seen);if(found)return found;}catch(_){}
    }
  }catch(_){}
  return null;
}
function S(doc,tag,attrs,text){
  var node=doc.createElementNS(NS,tag);
  Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,String(attrs[key]));});
  if(text!==undefined)node.textContent=String(text);
  return node;
}
function addText(doc,root,label,x,y,color,size){
  root.appendChild(S(doc,'text',{
    x:x,y:y,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Arial,Tahoma,sans-serif','font-size':size||13,
    'font-weight':'900',fill:color,'paint-order':'stroke fill',
    stroke:'#fffdf8','stroke-width':'1.5','stroke-opacity':'0.96'
  },label));
}
function addPoint(doc,root,x,y,color,r){
  root.appendChild(S(doc,'circle',{cx:x,cy:y,r:r||4.2,fill:color,stroke:'#fff','stroke-width':'1.5'}));
  root.appendChild(S(doc,'circle',{cx:x,cy:y,r:1.45,fill:'#fff','fill-opacity':'0.96',stroke:'none'}));
}
function removeOldLabels(doc){
  var main=doc.getElementById('mainShapes');
  if(!main)return;
  var labels={'1/4':1,'1/2':1,'1/3':1,'2/3':1,'3/4':1};
  Array.from(main.querySelectorAll('text')).forEach(function(node){
    if(labels[String(node.textContent||'').trim()])node.style.setProperty('display','none','important');
  });
}
function applyFractionGuides(){
  try{
    var doc=findSquareDocument(frame.contentWindow);
    if(!doc)return false;
    var square=doc.getElementById('squareSvg');
    if(!square||doc.defaultView.getComputedStyle(square).display==='none')return false;
    var old=doc.getElementById(ROOT_ID);if(old)old.remove();
    removeOldLabels(doc);

    var root=S(doc,'g',{id:ROOT_ID,'data-fraction-guides':'complete','pointer-events':'none'});
    square.appendChild(root);

    var red='#e36a63',orange='#d88b00',green='#4c9b19',dark='#222';
    var top={x:500,y:160},right={x:840,y:500},bottom={x:500,y:840},left={x:160,y:500};
    var greenTop={x:740.42,y:259.58},greenBottom={x:740.42,y:740.42};

    addPoint(doc,root,top.x,top.y,red,4.3);
    addPoint(doc,root,right.x,right.y,red,4.3);
    addPoint(doc,root,bottom.x,bottom.y,red,4.3);
    addPoint(doc,root,left.x,left.y,red,4.3);
    root.appendChild(S(doc,'circle',{cx:143,cy:500,r:3.4,fill:'#fff',stroke:dark,'stroke-width':'1.3'}));
    root.appendChild(S(doc,'line',{x1:146.5,y1:500,x2:155.5,y2:500,stroke:red,'stroke-width':'1.4'}));
    addPoint(doc,root,greenTop.x,greenTop.y,green,3.6);
    addPoint(doc,root,greenBottom.x,greenBottom.y,green,3.6);

    root.appendChild(S(doc,'path',{d:'M493 177 L500 163 L507 177 Z',fill:red,'fill-opacity':'0.72',stroke:red,'stroke-width':'0.8'}));
    root.appendChild(S(doc,'path',{d:'M824 493 L839 500 L824 507 Z',fill:red,'fill-opacity':'0.72',stroke:red,'stroke-width':'0.8'}));
    root.appendChild(S(doc,'path',{d:'M493 823 L500 839 L507 823 Z',fill:red,'fill-opacity':'0.72',stroke:red,'stroke-width':'0.8'}));

    addText(doc,root,'1/4',500,188,orange,13);
    addText(doc,root,'1/2',812,500,orange,13);
    addText(doc,root,'1/3',719,276,green,12.5);
    addText(doc,root,'2/3',719,724,green,12.5);
    addText(doc,root,'3/4',500,812,orange,13);

    doc.documentElement.dataset.fractionGuidesV10='true';
    doc.documentElement.dataset.fractionLabelCountV10='5';
    doc.documentElement.dataset.fractionAnchorCountV10='7';
    errorBox.style.display='none';
    return true;
  }catch(error){
    errorBox.style.display='block';
    errorBox.textContent='FRACTION GUIDES V10 ERROR: '+String(error&&error.message||error);
    return false;
  }
}
frame.addEventListener('load',function(){
  if(loading)loading.remove();
  setTimeout(applyFractionGuides,260);
  setTimeout(applyFractionGuides,850);
  setTimeout(applyFractionGuides,1700);
});
frame.src=SOURCE;
window.setInterval(function(){
  var doc=findSquareDocument(frame.contentWindow);
  if(!doc||!doc.getElementById(ROOT_ID))applyFractionGuides();
},450);
window.__auditSquare9FractionGuidesV10=function(){
  var doc=findSquareDocument(frame.contentWindow);
  var root=doc?doc.getElementById(ROOT_ID):null;
  return{
    ok:!!root,
    labelCount:doc?doc.documentElement.dataset.fractionLabelCountV10:null,
    anchorCount:doc?doc.documentElement.dataset.fractionAnchorCountV10:null,
    guideState:root?root.dataset.fractionGuides:null
  };
};
}());
</script>
</body>
</html>
