<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Numbers Constellation — Gannzilla Shell Controls</title>
<style>
:root{color-scheme:light;--bar:#efefef;--line:#b9b9b9;--blue:#2d85c4;--panel-width:300px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Segoe UI,Arial,Tahoma,sans-serif;color:#222}
#toolbar{position:fixed;inset:0 0 auto 0;height:30px;z-index:100;display:flex;align-items:center;border-bottom:1px solid #aaa;background:linear-gradient(#f9f9f9,#e6e6e6);box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:12px;direction:ltr}
.brand{width:300px;height:100%;display:flex;align-items:center;padding:0 8px;border-right:1px solid #c3c3c3;font-weight:800;gap:6px}.brand-mark{width:15px;height:15px;border:2px solid #d39a22;border-radius:2px;transform:rotate(5deg)}
.tools{flex:1;display:flex;align-items:center;justify-content:flex-end;padding:0 7px;gap:2px}
.tool-btn,.zoom-btn,.quick-btn{height:23px;min-width:23px;padding:0 5px;border:1px solid transparent;border-radius:2px;background:transparent;color:#216fa7;font:700 13px Segoe UI,Arial;cursor:pointer}.tool-btn:hover,.zoom-btn:hover,.quick-btn:hover{border-color:#a8b9c5;background:#fff}.tool-btn.active{border-color:#69a4cc;background:#dceeff;box-shadow:inset 0 0 0 1px #fff}.separator{width:1px;height:19px;margin:0 4px;background:#c0c0c0}.zoom-readout{min-width:42px;text-align:center;font-weight:700;color:#333}.language{display:flex;align-items:center;gap:4px;margin-left:4px;padding:2px 5px;cursor:pointer;color:#222}.flag{font-size:14px}
#stage{position:fixed;inset:30px 0 0 0;background:#f7f1e3}#app{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f7f1e3}
.rail{position:fixed;z-index:120;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 5px;border:1px solid #d8d8d8;border-radius:18px;background:rgba(250,250,250,.92);box-shadow:0 1px 5px rgba(0,0,0,.12);backdrop-filter:blur(2px)}
#viewRail{left:310px;top:150px}#shapeRail{right:14px;top:150px}
.rail-btn{width:35px;height:35px;display:grid;place-items:center;padding:0;border:1px solid #d3d3d3;border-radius:5px;background:#fafafa;color:#9aa5aa;font:800 15px Segoe UI,Arial;cursor:pointer;transition:.12s}.rail-btn:hover{border-color:#93b8cf;background:#fff;color:#4d7f9d}.rail-btn.active{border-color:#2e84bd;background:#e8f4fb;color:#174f75;box-shadow:0 0 0 2px rgba(50,143,199,.14)}.rail-btn.round{border-radius:50%;font-size:13px}.rail-btn.green{color:#5ac56c}.rail-btn.red{color:#ec6e79}.rail-btn.gold{color:#b99a58}.rail-btn.vortex{font-size:24px}.rail-caption{font-size:8px;font-weight:700;color:#7d858a;line-height:1}
.poly{width:22px;height:22px;border:2px solid currentColor;background:transparent}.tri{clip-path:polygon(50% 4%,96% 92%,4% 92%)}.pent{clip-path:polygon(50% 0%,98% 36%,80% 100%,20% 100%,2% 36%)}.hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}.oct{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
#loading{position:fixed;inset:30px 0 0 0;z-index:90;display:grid;place-items:center;background:#f7f1e3;color:#50463f;font-weight:800}
@media(max-width:900px){:root{--panel-width:270px}.brand{width:270px}#viewRail{left:278px}.rail-btn{width:31px;height:31px}}
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand"><span class="brand-mark"></span><span>Gannzilla Pro</span></div>
  <div class="tools">
    <button class="tool-btn active" data-tool="cursor" title="Cursor">↖</button>
    <button class="tool-btn" data-tool="line" title="Line">―</button>
    <button class="tool-btn" data-tool="rectangle" title="Rectangle">□</button>
    <button class="tool-btn" data-tool="text" title="Text">T</button>
    <button class="tool-btn" data-tool="lock" title="Lock">▣</button>
    <button class="tool-btn" data-tool="search" title="Find">⌕</button>
    <span class="separator"></span>
    <button id="zoomOut" class="zoom-btn" title="Zoom out">−</button>
    <span id="zoomReadout" class="zoom-readout">100%</span>
    <button id="zoomIn" class="zoom-btn" title="Zoom in">＋</button>
    <button id="fit" class="quick-btn" title="Fit">⛶</button>
    <button id="fullScreen" class="quick-btn" title="Full screen">▣</button>
    <span class="separator"></span>
    <div id="language" class="language"><span class="flag">🇬🇧</span><span id="languageText">English</span><span>▾</span></div>
    <button class="quick-btn" title="Information">ⓘ</button>
  </div>
</header>
<div id="stage"><iframe id="app" title="Magic Numbers Constellation"></iframe></div>

<nav id="viewRail" class="rail" aria-label="View tools">
  <button class="rail-btn round" data-view="circle12">12</button>
  <button class="rail-btn round" data-view="circle24">24</button>
  <button class="rail-btn round" data-view="circle36">36</button>
  <button class="rail-btn" data-view="square4"><span>↗</span><span class="rail-caption">4</span></button>
  <button class="rail-btn" data-view="square9"><span>↘</span><span class="rail-caption">9</span></button>
  <button class="rail-btn" data-view="permanentSquare">N</button>
  <button class="rail-btn" data-view="tetragon">◆</button>
  <button class="rail-btn" data-figure="Pentagon">⬠</button>
  <button class="rail-btn" data-figure="Hexagon">⬡</button>
  <button class="rail-btn" data-figure="Octagon">⯃</button>
  <button class="rail-btn" data-figure="Dodecagon">✺</button>
</nav>

<nav id="shapeRail" class="rail" aria-label="Figure tools">
  <button class="rail-btn green" data-figure="Triangle" title="Triangle"><span class="poly tri"></span></button>
  <button class="rail-btn red" data-figure="Square" title="Square"><span class="poly"></span></button>
  <button class="rail-btn" data-figure="Pentagon" title="Pentagon"><span class="poly pent"></span></button>
  <button class="rail-btn" data-figure="Hexagon" title="Hexagon"><span class="poly hex"></span></button>
  <button class="rail-btn" data-figure="Septagon" title="Septagon">⬡</button>
  <button class="rail-btn" data-figure="Octagon" title="Octagon"><span class="poly oct"></span></button>
  <button class="rail-btn" data-figure="Nonagon" title="Nonagon">⯃</button>
  <button class="rail-btn gold" data-figure="Dodecagon" title="Dodecagon">◯</button>
  <button class="rail-btn" data-action="locator" title="Locator">∠</button>
  <button class="rail-btn" data-action="marker" title="Marker">◒</button>
  <button class="rail-btn vortex" data-action="vortex" title="Vortex">◎</button>
</nav>
<div id="loading">جارٍ تشغيل أدوات Gannzilla…</div>

<script>
(function(){
'use strict';
var STORAGE='kawkabat-complete-panel-v1';
var MIGRATION='kawkabat-square9-default-migration-v1';
var state={};
try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(_){state={}}
if(localStorage.getItem(MIGRATION)!=='done'){
  Object.assign(state,{
    'core.visible':true,'core.clockwise':true,'core.size':'10','core.view':'square9','core.dataType':'price','core.value':'1','core.find':'1','core.increment':'1',
    'core.highlightVisible':true,'core.highlightFill':'cross','core.showMarks':true,'core.showNumbers':false,
    'protractor.visible':true,'protractor.clockwise':true,'protractor.angle':'0',
    'chronometer.visible':true,'chronometer.clockwise':true,'chronometer.angle':'0','chronometer.range':'Annual',
    'cosmogram.visible':true,'cosmogram.clockwise':true,'cosmogram.angle':'0','cosmogram.system':'Geocentric','moon.visible':true,'cycles.visible':true
  });
  localStorage.setItem(STORAGE,JSON.stringify(state));localStorage.setItem(MIGRATION,'done');
}
var frame=document.getElementById('app');
frame.src='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/ef7b3237ee1a48bc9761b9b0ee8657cbc45a43bd/public/kawkabat-al-arqam-al-sihria.html';
var loading=document.getElementById('loading'),zoomReadout=document.getElementById('zoomReadout');
var activeTool='cursor';
function panelDocument(){
  try{
    var outer=frame.contentDocument;if(!outer)return null;
    var nested=outer.getElementById('app');
    return nested&&nested.contentDocument?nested.contentDocument:null;
  }catch(_){return null}
}
function control(key){var doc=panelDocument();if(!doc)return null;return Array.from(doc.querySelectorAll('[data-key]')).find(function(node){return node.dataset.key===key})||null}
function emit(node,name){var win=node.ownerDocument.defaultView;node.dispatchEvent(new win.Event(name,{bubbles:true}))}
function setControl(key,next){var node=control(key);if(!node)return false;if(node.type==='checkbox')node.checked=!!next;else node.value=String(next);emit(node,'input');emit(node,'change');setTimeout(sync,80);return true}
function getControlValue(key,fallback){var node=control(key);if(!node)return fallback;return node.type==='checkbox'?node.checked:node.value}
function changeZoom(delta){var current=Number(getControlValue('core.size',10));if(!Number.isFinite(current))current=10;setControl('core.size',Math.max(1,Math.min(20,Math.round(current+delta))))}
function sync(){
  var view=String(getControlValue('core.view','square9'));
  document.querySelectorAll('[data-view]').forEach(function(button){button.classList.toggle('active',button.dataset.view===view)});
  document.querySelectorAll('[data-figure]').forEach(function(button){button.classList.toggle('active',!!getControlValue('figure.'+button.dataset.figure+'.visible',false))});
  document.querySelector('[data-action="locator"]')?.classList.toggle('active',!!getControlValue('locator.visible',false));
  document.querySelector('[data-action="marker"]')?.classList.toggle('active',!!getControlValue('marker.visible',false));
  document.querySelector('[data-action="vortex"]')?.classList.toggle('active',!!getControlValue('vortex.visible',false));
  var size=Number(getControlValue('core.size',10));zoomReadout.textContent=Math.round((Number.isFinite(size)?size:10)*10)+'%';
}
frame.addEventListener('load',function(){if(loading)loading.remove();setTimeout(sync,700)});
document.querySelectorAll('[data-tool]').forEach(function(button){button.addEventListener('click',function(){activeTool=button.dataset.tool;document.querySelectorAll('[data-tool]').forEach(function(item){item.classList.toggle('active',item.dataset.tool===activeTool)})})});
document.querySelectorAll('[data-view]').forEach(function(button){button.addEventListener('click',function(){setControl('core.view',button.dataset.view)})});
document.querySelectorAll('[data-figure]').forEach(function(button){button.addEventListener('click',function(){var key='figure.'+button.dataset.figure+'.visible';setControl(key,!getControlValue(key,false))})});
document.querySelector('[data-action="locator"]').addEventListener('click',function(){setControl('locator.visible',!getControlValue('locator.visible',false))});
document.querySelector('[data-action="marker"]').addEventListener('click',function(){setControl('marker.visible',!getControlValue('marker.visible',false))});
document.querySelector('[data-action="vortex"]').addEventListener('click',function(){setControl('vortex.visible',!getControlValue('vortex.visible',false))});
document.getElementById('zoomOut').addEventListener('click',function(){changeZoom(-1)});document.getElementById('zoomIn').addEventListener('click',function(){changeZoom(1)});document.getElementById('fit').addEventListener('click',function(){setControl('core.size',10)});
document.getElementById('fullScreen').addEventListener('click',function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.getElementById('language').addEventListener('click',function(){var text=document.getElementById('languageText');text.textContent=text.textContent==='English'?'العربية':'English'});
window.setInterval(sync,700);
window.__auditGannzillaShellControlsV1=function(){return{ok:true,activeTool:activeTool,view:getControlValue('core.view','square9'),size:getControlValue('core.size',10),topToolbar:true,leftViewRail:true,rightShapeRail:true}};
}());
</script>
</body>
</html>
