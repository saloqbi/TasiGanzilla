<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — إضافة 9 عجلات</title>
  <style>
    :root { background: #F7F1E3; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F1E3;
    }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
    }
    svg {
      display: block;
      width: min(98vw, 1800px);
      height: min(98vh, 1800px);
      filter: drop-shadow(0 10px 20px rgba(35, 57, 68, .24));
    }
    .ray-shadow {
      stroke: #263943;
      stroke-width: 4.4;
      stroke-linecap: round;
      opacity: .88;
      vector-effect: non-scaling-stroke;
    }
    .ray-metal {
      stroke: url(#blueSteelStroke);
      stroke-width: 2.7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .ray-highlight {
      stroke: url(#blueSteelHighlight);
      stroke-width: .85;
      stroke-linecap: round;
      opacity: .98;
      vector-effect: non-scaling-stroke;
    }
    .special-ray-shadow {
      stroke: #6A4A3A;
      stroke-width: 5.2;
      stroke-linecap: round;
      opacity: .86;
      vector-effect: non-scaling-stroke;
    }
    .special-ray-metal {
      stroke: url(#roseBronzeStroke);
      stroke-width: 3.35;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .special-ray-highlight {
      stroke: url(#roseBronzeHighlight);
      stroke-width: 1.05;
      stroke-linecap: round;
      opacity: .99;
      vector-effect: non-scaling-stroke;
    }
    .frame-shadow {
      fill: none;
      stroke: #263943;
      stroke-width: 7.4;
      opacity: .82;
      vector-effect: non-scaling-stroke;
    }
    .frame-metal {
      fill: none;
      stroke: url(#blueSteelStroke);
      stroke-width: 5.2;
      vector-effect: non-scaling-stroke;
    }
    .frame-highlight {
      fill: none;
      stroke: url(#blueSteelHighlight);
      stroke-width: 1.5;
      opacity: .96;
      vector-effect: non-scaling-stroke;
    }
    .special-fill {
      fill: url(#roseBronzeCell);
      stroke: none;
      opacity: .48;
    }
    .special-arc-shadow {
      fill: none;
      stroke: #6A4A3A;
      stroke-width: 6.2;
      opacity: .84;
      vector-effect: non-scaling-stroke;
    }
    .special-arc-metal {
      fill: none;
      stroke: url(#roseBronzeStroke);
      stroke-width: 4.1;
      vector-effect: non-scaling-stroke;
    }
    .special-arc-highlight {
      fill: none;
      stroke: url(#roseBronzeHighlight);
      stroke-width: 1.15;
      opacity: .99;
      vector-effect: non-scaling-stroke;
    }
    .number-text {
      font-family: Arial, Tahoma, sans-serif;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
      dominant-baseline: central;
      direction: ltr;
      unicode-bidi: bidi-override;
      paint-order: stroke fill;
      stroke: #E7CB84;
      stroke-width: 1.05;
      stroke-opacity: .72;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.82));
    }
    .ring-one-number { font-size: 24px; }
    .ring-two-number { font-size: 29px; }
    .cardinal-number { font-weight: 900; }
    .number-red { fill: #B21F2D; }
    .number-blue { fill: #174B98; }
    .number-black { fill: #17191B; }
    #logoImage { opacity: 0; transition: opacity .18s linear; }
    html[data-logo-ready="true"] #logoImage { opacity: 1; }
  </style>
</head>
<body>
  <svg id="wheel" viewBox="0 0 3200 3200" role="img" aria-label="اثنتا عشرة عجلة؛ عجلتان بالأرقام وعشر عجلات فارغة">
    <defs>
      <clipPath id="logoClip"><circle cx="1600" cy="1600" r="179" /></clipPath>
      <linearGradient id="blueSteelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#20333D" />
        <stop offset="18%" stop-color="#6F8793" />
        <stop offset="36%" stop-color="#DDE8EC" />
        <stop offset="50%" stop-color="#8AA0AA" />
        <stop offset="68%" stop-color="#4D6875" />
        <stop offset="84%" stop-color="#B9D4DE" />
        <stop offset="100%" stop-color="#263B46" />
      </linearGradient>
      <linearGradient id="blueSteelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F1FBFF" />
        <stop offset="42%" stop-color="#9AD7ED" />
        <stop offset="100%" stop-color="#557685" />
      </linearGradient>
      <linearGradient id="roseBronzeCell" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8C6247" />
        <stop offset="14%" stop-color="#C2A086" />
        <stop offset="36%" stop-color="#F0DED2" />
        <stop offset="50%" stop-color="#FFF8F3" />
        <stop offset="64%" stop-color="#E6D1C2" />
        <stop offset="84%" stop-color="#B98B68" />
        <stop offset="100%" stop-color="#6A4938" />
      </linearGradient>
      <linearGradient id="roseBronzeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5C4032" />
        <stop offset="16%" stop-color="#8C6247" />
        <stop offset="34%" stop-color="#C2A086" />
        <stop offset="50%" stop-color="#F4E4DB" />
        <stop offset="66%" stop-color="#D7C3B3" />
        <stop offset="84%" stop-color="#B98B68" />
        <stop offset="100%" stop-color="#5C4032" />
      </linearGradient>
      <linearGradient id="roseBronzeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFDFC" />
        <stop offset="42%" stop-color="#F1E2D9" />
        <stop offset="100%" stop-color="#B98B68" />
      </linearGradient>
    </defs>

    <g id="specialFills"></g>
    <g id="divisions"></g>
    <image id="logoImage" x="1421" y="1421" width="358" height="358" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)" />
    <g id="frames"></g>
    <g id="specialArcs"></g>
    <g id="numbersRingOne"></g>
    <g id="numbersRingTwo"></g>
  </svg>

  <script>
    (function () {
      'use strict';
      var NS = 'http://www.w3.org/2000/svg';
      var XLINK = 'http://www.w3.org/1999/xlink';
      var cx = 1600;
      var cy = 1600;
      var radii = [180, 290, 400, 510, 620, 730, 840, 950, 1060, 1170, 1280, 1390, 1500];
      var cardinalCells = [0, 9, 18, 27];
      var specialBoundaries = {0:true,1:true,9:true,10:true,18:true,19:true,27:true,28:true};
      var divisions = document.getElementById('divisions');
      var specialFills = document.getElementById('specialFills');
      var specialArcs = document.getElementById('specialArcs');
      var frames = document.getElementById('frames');
      var ringOne = document.getElementById('numbersRingOne');
      var ringTwo = document.getElementById('numbersRingTwo');
      var logo = document.getElementById('logoImage');
      var textRadiusOne = (radii[0] + radii[1]) / 2;
      var textRadiusTwo = (radii[1] + radii[2]) / 2;

      function polar(radius, degrees) {
        var angle = degrees * Math.PI / 180;
        return { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius };
      }
      function appendLine(group, className, p1, p2) {
        var line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', String(p1.x));
        line.setAttribute('y1', String(p1.y));
        line.setAttribute('x2', String(p2.x));
        line.setAttribute('y2', String(p2.y));
        line.setAttribute('class', className);
        group.appendChild(line);
      }
      function appendPath(group, className, d) {
        var path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', className);
        group.appendChild(path);
      }
      function appendCircle(group, className, radius) {
        var circle = document.createElementNS(NS, 'circle');
        circle.setAttribute('cx', String(cx));
        circle.setAttribute('cy', String(cy));
        circle.setAttribute('r', String(radius));
        circle.setAttribute('class', className);
        group.appendChild(circle);
      }
      function sectorPath(innerRadius, outerRadius, startDegrees, endDegrees) {
        var outerStart = polar(outerRadius, startDegrees);
        var outerEnd = polar(outerRadius, endDegrees);
        var innerEnd = polar(innerRadius, endDegrees);
        var innerStart = polar(innerRadius, startDegrees);
        return [
          'M', outerStart.x, outerStart.y,
          'A', outerRadius, outerRadius, 0, 0, 1, outerEnd.x, outerEnd.y,
          'L', innerEnd.x, innerEnd.y,
          'A', innerRadius, innerRadius, 0, 0, 0, innerStart.x, innerStart.y,
          'Z'
        ].join(' ');
      }
      function arcPath(radius, startDegrees, endDegrees) {
        var start = polar(radius, startDegrees);
        var end = polar(radius, endDegrees);
        return ['M', start.x, start.y, 'A', radius, radius, 0, 0, 1, end.x, end.y].join(' ');
      }
      function addFrame(radius) {
        appendCircle(frames, 'frame-shadow', radius);
        appendCircle(frames, 'frame-metal', radius);
        appendCircle(frames, 'frame-highlight', radius - 6);
      }
      function addSpecialArc(radius, startDegrees, endDegrees) {
        var d = arcPath(radius, startDegrees, endDegrees);
        appendPath(specialArcs, 'special-arc-shadow', d);
        appendPath(specialArcs, 'special-arc-metal', d);
        appendPath(specialArcs, 'special-arc-highlight', d);
      }
      function numberColorClass(value) {
        var remainder = value % 3;
        if (remainder === 1) return 'number-red';
        if (remainder === 2) return 'number-blue';
        return 'number-black';
      }
      function addNumber(group, value, degrees, radius, ringClass, isCardinal) {
        var point = polar(radius, degrees);
        var text = document.createElementNS(NS, 'text');
        text.setAttribute('x', String(point.x));
        text.setAttribute('y', String(point.y));
        text.setAttribute('class', 'number-text ' + ringClass + ' ' + numberColorClass(value) + (isCardinal ? ' cardinal-number' : ''));
        text.textContent = String(value);
        group.appendChild(text);
      }

      cardinalCells.forEach(function (cellIndex) {
        var startDegrees = cellIndex * 10 - 95;
        var endDegrees = cellIndex * 10 - 85;
        for (var ringIndex = 0; ringIndex < radii.length - 1; ringIndex += 1) {
          appendPath(
            specialFills,
            'special-fill',
            sectorPath(radii[ringIndex], radii[ringIndex + 1], startDegrees, endDegrees)
          );
        }
        radii.forEach(function (radius) {
          addSpecialArc(radius, startDegrees, endDegrees);
        });
      });

      radii.forEach(addFrame);

      for (var i = 0; i < 36; i += 1) {
        var boundaryDegrees = i * 10 - 95;
        var startPoint = polar(radii[0], boundaryDegrees);
        var endPoint = polar(radii[radii.length - 1], boundaryDegrees);
        var special = Boolean(specialBoundaries[i]);
        var group = document.createElementNS(NS, 'g');
        group.setAttribute('data-ray-index', String(i));
        group.setAttribute('data-special-boundary', String(special));

        if (special) {
          appendLine(group, 'special-ray-shadow', startPoint, endPoint);
          appendLine(group, 'special-ray-metal', startPoint, endPoint);
          appendLine(group, 'special-ray-highlight', startPoint, endPoint);
        } else {
          appendLine(group, 'ray-shadow', startPoint, endPoint);
          appendLine(group, 'ray-metal', startPoint, endPoint);
          appendLine(group, 'ray-highlight', startPoint, endPoint);
        }
        divisions.appendChild(group);

        var centerDegrees = i * 10 - 90;
        var fullValue = i === 0 ? 36 : i;
        var digitalRootValue = i % 9 === 0 ? 9 : i % 9;
        var isCardinal = i % 9 === 0;
        addNumber(ringOne, fullValue, centerDegrees, textRadiusOne, 'ring-one-number', isCardinal);
        addNumber(ringTwo, digitalRootValue, centerDegrees, textRadiusTwo, 'ring-two-number', isCardinal);
      }

      var chunkBase = 'https://raw.githubusercontent.com/saloqbi/TasiGanzilla/main/public/kawkabat-logo-v1/chunk-';
      Promise.all([0,1,2,3,4].map(function (index) {
        return fetch(chunkBase + index + '.txt', { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('LOGO_CHUNK_HTTP_' + response.status);
          return response.text();
        });
      })).then(function (chunks) {
        var source = 'data:image/webp;base64,' + chunks.join('').trim();
        logo.setAttribute('href', source);
        logo.setAttributeNS(XLINK, 'href', source);
        document.documentElement.dataset.logoReady = 'true';
      }).catch(function () {
        document.documentElement.dataset.logoReady = 'false';
      });

      window.__auditKawkabatAddNineWheelsV1 = function () {
        return {
          ok: divisions.children.length === 36 && ringOne.children.length === 36 && ringTwo.children.length === 36,
          build: 13,
          existingWheelCountBeforeAddition: 3,
          newlyAddedWheelCount: 9,
          totalWheelCount: radii.length - 1,
          numberedWheelCount: 2,
          emptyWheelCount: (radii.length - 1) - 2,
          eachWheelCellCount: 36,
          outerNineWheelsEmpty: true,
          baseColor: 'glossy-blue-steel',
          specialColor: 'satin-rose-bronze-high-contrast',
          highlightedDirections: ['12', '3', '6', '9'],
          cell28Highlighted: false,
          logoReady: document.documentElement.dataset.logoReady === 'true'
        };
      };
    }());
  </script>
</body>
</html>
