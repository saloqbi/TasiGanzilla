<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — الهيكل النهائي</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A3C2B}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل الهيكل النهائي…</div>
  <script>
    (async function(){
      'use strict';
      var blobApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/b8cec022685d53af5a5d1c7ed3b5e99a2c25d47a';
      try{
        var response=await fetch(blobApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok)throw new Error('SOURCE_HTTP_'+response.status);
        var payload=await response.json();
        var binary=atob(String(payload.content||'').replace(/\s/g,''));
        var bytes=new Uint8Array(binary.length);
        for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
        var html=new TextDecoder('utf-8').decode(bytes);

        html=html.replace(
          /<linearGradient id="angleGoldBand"[\s\S]*?<\/linearGradient>/,
          '<linearGradient id="angleGoldBand" x1="0%" y1="0%" x2="0%" y2="100%">'+
          '<stop offset="0%" stop-color="#6A3A20"/>'+
          '<stop offset="12%" stop-color="#9A5A32"/>'+
          '<stop offset="28%" stop-color="#C98A5C"/>'+
          '<stop offset="44%" stop-color="#E8B78E"/>'+
          '<stop offset="57%" stop-color="#C77E4B"/>'+
          '<stop offset="72%" stop-color="#DE9E6D"/>'+
          '<stop offset="87%" stop-color="#9C5936"/>'+
          '<stop offset="100%" stop-color="#5B321E"/>'+
          '</linearGradient>'+
          '<linearGradient id="angleTaupeEdge" x1="0%" y1="0%" x2="100%" y2="100%">'+
          '<stop offset="0%" stop-color="#5A3424"/>'+
          '<stop offset="20%" stop-color="#A8653D"/>'+
          '<stop offset="40%" stop-color="#EDC29D"/>'+
          '<stop offset="55%" stop-color="#B8714A"/>'+
          '<stop offset="75%" stop-color="#D69B72"/>'+
          '<stop offset="100%" stop-color="#523022"/>'+
          '</linearGradient>'+
          '<linearGradient id="outerRoseFrameBand" x1="0%" y1="0%" x2="0%" y2="100%">'+
          '<stop offset="0%" stop-color="#6A4938"/>'+
          '<stop offset="12%" stop-color="#9B6F58"/>'+
          '<stop offset="28%" stop-color="#D3A58F"/>'+
          '<stop offset="44%" stop-color="#F3D2C3"/>'+
          '<stop offset="58%" stop-color="#C58B72"/>'+
          '<stop offset="72%" stop-color="#E3B9A7"/>'+
          '<stop offset="88%" stop-color="#9D6853"/>'+
          '<stop offset="100%" stop-color="#5C4032"/>'+
          '</linearGradient>'
        );

        html=html
          .replace('.angle-band-shadow{fill:none;stroke:#3A2112;', '.angle-band-shadow{fill:none;stroke:#4B2D20;')
          .replace('stroke:url(#ornateGold);vector-effect:non-scaling-stroke}.angle-band-inner-line', 'stroke:url(#angleTaupeEdge);vector-effect:non-scaling-stroke}.angle-band-inner-line')
          .replace('.angle-band-highlight{fill:none;stroke:#FFF0BE;', '.angle-band-highlight{fill:none;stroke:#F6D8BE;')
          .replace('stroke:#F4D99D;stroke-width:.8;', 'stroke:#D7AA83;stroke-width:.8;')
          .replace('.outer-black-band{fill:none;stroke:url(#blackFrameBand);', '.outer-black-band{fill:none;stroke:url(#outerRoseFrameBand);');

        html=html.replace('window.__auditKawkabatFinalStructureV3=function(){return{','window.__auditKawkabatFinalStructureV7=function(){return{anglePalette:\'calm-copper-orange\',outerFramePalette:\'rose-bronze-only\',angleGeometryChanged:false,outerFrameGeometryChanged:false,');
        html=html.replace('build:27,','build:31,');

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading">تعذر تحميل الهيكل: '+String(error.message||error)+'</div>';
      }
    }());
  </script>
</body>
</html>
