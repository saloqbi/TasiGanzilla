<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Angle Frames Overlay V12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#frameOverlay{position:fixed;inset:0;width:100%;height:100%;z-index:2147483000;pointer-events:none;overflow:visible;display:none}
#frameOverlay .red-frame{fill:none;stroke:#df3f3f;stroke-width:3;stroke-opacity:.98;vector-effect:non-scaling-stroke}
#frameOverlay .green-frame{fill:none;stroke:#1f9f3a;stroke-width:3;stroke-opacity:.98;vector-effect:non-scaling-stroke}
#frameOverlay .frame-highlight{fill:none;stroke:#fff;stroke-width:.75;stroke-opacity:.72;vector-effect:non-scaling-stroke}
#loading{position:fixed;inset:0;z-index:2147483600;display:grid;place-items:center;background:#fff;color:#554b42;font-weight:800}
#error{position:fixed;right:16px;bottom:14px;z-index:2147483640;display:none;max-width:680px;padding:10px 14px;border:1px solid #a32935;border-radius:6px;background:#fff3f3;color:#8c101c;font-weight:800;direction:ltr}
</style>
</head>
<body>
<iframe id="app" title="Square of 9 with synchronized angle frames"></iframe>
<svg id="frameOverlay" aria-hidden="true"></svg>
<div id="loading">جارٍ تثبيت الإطارين فوق Square of 9…</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var SOURCE='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/d9df106c948df16d8e08bb712cc27ae26cd42ba0/public/kawkabat-al-arqam-al-sihria.html';
var NS='http://www.w3.org/2000/svg';
var ZODIAC=new Set(['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓']);
var INNER_FRAME_IDS=['cleanAngleFramesV11','protractor','chronometer','engineProtractor','engineChronometer','chronometerGuaranteedLayer','protractorGuaranteedLayer','protractorIntegratedLayer','chronometerIntegratedLayer'];
var frame=document.getElementById('app');
var overlay=document.getElementById('frameOverlay');
var loading=document.getElementById('loading');
var errorBox=document.getElementById('error');
var lastMetrics=null;

function showError(error){
  errorBox.style.display='block';
  errorBox.textContent='ANGLE FRAME OVERLAY V12 ERROR: '+String(error&&error.message||error);
}
function findSquareContext(win,seen){
  seen=seen||new Set();
  try{
    if(!win||seen.has(win))return null;
    seen.add(win);
    var doc=win.document;
    var square=doc&&doc.getElementById('squareSvg');
    if(square)return{win:win,doc:doc,square:square};
    var frames=doc?Array.from(doc.querySelectorAll('iframe')):[];
    for(var i=0;i<frames.length;i++){
      try{
        var found=findSquareContext(frames[i].contentWindow,seen);
        if(found)return found;
      }catch(_){}
    }
  }catch(_){}
  return null;
}
function globalRect(element){
  var rect=element.getBoundingClientRect();
  var left=rect.left,top=rect.top,width=rect.width,height=rect.height;
  var win=element.ownerDocument.defaultView;
  while(win&&win!==window){
    var frameElement=win.frameElement;
    if(!frameElement)break;
    var frameRect=frameElement.getBoundingClientRect();
    left+=frameRect.left;
    top+=frameRect.top;
    win=frameElement.ownerDocument.defaultView;
  }
  return{left:left,top:top,width:width,height:height};
}
function removeInnerFramesAndZodiac(context){
  var doc=context.doc,square=context.square;
  INNER_FRAME_IDS.forEach(function(id){
    var node=doc.getElementById(id);
    if(node)node.style.setProperty('display','none','important');
  });
  ['approvedZodiacInsideGridV7','approvedZodiacInsideGridV8','approvedZodiacInsideGridV9','approvedZodiacInsideGridV10'].forEach(function(id){
    var node=doc.getElementById(id);if(node)node.remove();
  });
  Array.from(square.querySelectorAll('text')).forEach(function(node){
    if(ZODIAC.has(String(node.textContent||'').trim()))node.remove();
  });
  Array.from(square.querySelectorAll('circle')).forEach(function(circle){
    var r=Number(circle.getAttribute('r'));
    if(!Number.isFinite(r)||r<325||r>390)return;
    var stroke=String(circle.getAttribute('stroke')||circle.style.stroke||'').toLowerCase();
    if(stroke.includes('df3f3f')||stroke.includes('1f9f3a')||stroke.includes('e75b5b')||stroke.includes('008000')||stroke==='red'||stroke==='green'){
      circle.style.setProperty('display','none','important');
    }
  });
}
function createCircle(className,cx,cy,r){
  var circle=document.createElementNS(NS,'circle');
  circle.setAttribute('class',className);
  circle.setAttribute('cx',String(cx));
  circle.setAttribute('cy',String(cy));
  circle.setAttribute('r',String(r));
  return circle;
}
function renderOverlay(){
  try{
    var context=findSquareContext(frame.contentWindow);
    if(!context){overlay.style.display='none';return false;}
    var style=context.win.getComputedStyle(context.square);
    if(style.display==='none'||style.visibility==='hidden'||Number(style.opacity)===0){overlay.style.display='none';return false;}
    removeInnerFramesAndZodiac(context);
    var rect=globalRect(context.square);
    if(rect.width<10||rect.height<10){overlay.style.display='none';return false;}
    var scale=Math.min(rect.width/1000,rect.height/1000);
    var contentWidth=1000*scale,contentHeight=1000*scale;
    var contentLeft=rect.left+(rect.width-contentWidth)/2;
    var contentTop=rect.top+(rect.height-contentHeight)/2;
    var cx=contentLeft+500*scale;
    var cy=contentTop+500*scale;
    var redRadius=346*scale;
    var greenRadius=363*scale;
    var metrics=[cx,cy,redRadius,greenRadius,window.innerWidth,window.innerHeight].map(function(v){return Math.round(v*100)/100;}).join('|');
    if(metrics===lastMetrics&&overlay.childElementCount===4){return true;}
    lastMetrics=metrics;
    overlay.setAttribute('viewBox','0 0 '+window.innerWidth+' '+window.innerHeight);
    overlay.replaceChildren(
      createCircle('green-frame',cx,cy,greenRadius),
      createCircle('frame-highlight',cx,cy,greenRadius-1.3),
      createCircle('red-frame',cx,cy,redRadius),
      createCircle('frame-highlight',cx,cy,redRadius-1.3)
    );
    overlay.style.display='block';
    overlay.dataset.frameCount='2';
    overlay.dataset.layout='red-inner-green-outer';
    overlay.dataset.scale=String(scale);
    errorBox.style.display='none';
    return true;
  }catch(error){
    overlay.style.display='none';
    showError(error);
    return false;
  }
}
function sync(){renderOverlay();}
frame.addEventListener('load',function(){
  if(loading)loading.remove();
  setTimeout(sync,250);
  setTimeout(sync,800);
  setTimeout(sync,1600);
});
frame.src=SOURCE;
window.addEventListener('resize',function(){lastMetrics=null;sync();});
window.setInterval(sync,180);
window.__auditSquare9AngleFramesOverlayV12=function(){
  var context=findSquareContext(frame.contentWindow);
  return{
    ok:overlay.style.display!=='none'&&overlay.childElementCount===4,
    visibleFrameCount:overlay.dataset.frameCount||null,
    layout:overlay.dataset.layout||null,
    scale:overlay.dataset.scale||null,
    squareFound:!!context,
    zodiacGlyphCount:context?Array.from(context.square.querySelectorAll('text')).filter(function(node){return ZODIAC.has(String(node.textContent||'').trim());}).length:null
  };
};
}());
</script>
</body>
</html>
