<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Gannzilla Tools Engine V1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading Gannzilla tools engine…</div>
  <script>
  (async function(){
    'use strict';
    var approvedApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var wheelUrl='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/6a636f7b0a015b2661694efa7fd9e1b70667ecd3/public/kawkabat-wheel-direct-controls.html';
    var partsBase='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/cycle-1-wheel-3-v1/public/gannzilla-tools-v1/';
    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '.panel-bottom{display:flex!important;align-items:center!important;padding:0 10px!important;font-size:12px!important;font-weight:800!important;color:#33444c!important}'+
        '.panel-bottom[data-status="ready"]::before{content:"";width:9px;height:9px;border-radius:50%;background:#3fa35b;margin-right:7px;box-shadow:0 0 0 2px rgba(63,163,91,.18)}'+
        '.panel-bottom[data-status="waiting"]::before{content:"";width:9px;height:9px;border-radius:50%;background:#d59a2f;margin-right:7px;box-shadow:0 0 0 2px rgba(213,154,47,.18)}'+
        '.panel-action,.panel-info{cursor:pointer;user-select:none}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');
      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<iframe id="workFrame" class="work-frame" title="Magic Numbers Constellation" tabindex="0" src="'+wheelUrl+'"></iframe>'
      );
      var closeTag='</scr'+'ipt>';
      var loader='<script id="gannzilla-tools-loader-v1">(async function(){try{var names=["part-01.js","part-02.js","part-03.js","part-04.js","part-05.js","part-06.js","part-07.js"];var texts=await Promise.all(names.map(function(name){return fetch("'+partsBase+'"+name,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("TOOLS_PART_HTTP_"+r.status+"_"+name);return r.text();});}));var script=document.createElement("script");script.id="gannzilla-tools-engine-v1";script.textContent=texts.join("");document.body.appendChild(script);}catch(error){var bottom=document.querySelector(".panel-bottom");if(bottom){bottom.textContent="Tools failed: "+String(error.message||error);bottom.dataset.status="waiting";}}}());'+closeTag;
      html=html.replace('</body>',loader+'</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
