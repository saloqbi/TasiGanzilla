<script>
(function(){
'use strict';
const SVG_NS='http://www.w3.org/2000/svg';
const TABLE_SCALE=1.50;
const SHAPE_SCALE=346/340;
const FRAME_RADIUS=346;
const ARROW_ID='directDirectionArrowsV15';
const svg=document.getElementById('squareSvg');
const badge=document.getElementById('v15Badge');
let applying=false;
function S(tag,attrs){const n=document.createElementNS(SVG_NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,String(v)));return n}
function displayPoint(radius,displayAngle){const a=(displayAngle-180)*Math.PI/180;return{x:500+Math.cos(a)*radius,y:500+Math.sin(a)*radius}}
function arrowPath(displayAngle,radius,length,width){const a=(displayAngle-180)*Math.PI/180;const tip=displayPoint(radius,displayAngle);const base=displayPoint(radius-length,displayAngle);const px=-Math.sin(a)*width,py=Math.cos(a)*width;return`M${tip.x} ${tip.y}L${base.x+px} ${base.y+py}L${base.x-px} ${base.y-py}Z`}
function addArrow(root,angle,color,length,width){root.appendChild(S('path',{d:arrowPath(angle,FRAME_RADIUS,length,width),fill:color,stroke:color,'stroke-width':1,'fill-opacity':.92,'stroke-opacity':1,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'}))}
function buildArrows(){const g=S('g',{id:ARROW_ID,'data-arrow-count':'6','pointer-events':'none'});[0,90,180,270].forEach(a=>addArrow(g,a,'#df5f59',24,10));[135,225].forEach(a=>addArrow(g,a,'#38923e',21,8));return g}
function apply(){
 if(applying||!svg||getComputedStyle(svg).display==='none')return false;
 const square=svg.querySelector('#square'),shapes=svg.querySelector('#mainShapes');
 if(!square||!shapes)return false;
 applying=true;
 try{
   square.setAttribute('transform',`translate(500 500) scale(${TABLE_SCALE}) translate(-500 -500)`);
   shapes.setAttribute('transform',`translate(500 500) scale(${SHAPE_SCALE}) translate(-500 -500)`);
   square.dataset.directScale=String(TABLE_SCALE);
   shapes.dataset.directScale=String(SHAPE_SCALE);
   svg.querySelector('#'+ARROW_ID)?.remove();
   svg.appendChild(buildArrows());
   const status=document.getElementById('status');
   if(status)status.textContent='Square of 9 • table 684×684 • shapes touching frame • arrows restored';
   badge.textContent='V15 ACTIVE • table 1.50× • arrows 6';
   badge.style.borderColor='#2b7a43';badge.style.color='#246238';
   document.documentElement.dataset.directExpandedV15='true';
   return true;
 }finally{applying=false;}
}
const observer=new MutationObserver(()=>setTimeout(apply,0));
observer.observe(svg,{childList:true});
setInterval(()=>{const square=svg?.querySelector('#square');if(!square||square.dataset.directScale!==String(TABLE_SCALE)||!svg.querySelector('#'+ARROW_ID))apply()},180);
window.addEventListener('resize',apply);
window.__auditSquare9DirectExpandedV15=()=>({ok:document.documentElement.dataset.directExpandedV15==='true',tableScale:svg.querySelector('#square')?.dataset.directScale||null,shapeScale:svg.querySelector('#mainShapes')?.dataset.directScale||null,arrowCount:svg.querySelector('#'+ARROW_ID)?.querySelectorAll('path').length||0,estimatedTableSide:456*TABLE_SCALE,frameDiameter:FRAME_RADIUS*2});
setTimeout(apply,50);setTimeout(apply,400);setTimeout(apply,1000);
}());
</script></body></html>
