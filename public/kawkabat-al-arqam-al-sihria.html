<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Circle 36 Branding Gate</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e3}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#f7f1e3;color:#50463f;font-weight:800}
#error{position:fixed;right:18px;bottom:18px;z-index:10;display:none;max-width:520px;padding:10px 14px;border:1px solid #a32935;border-radius:6px;background:#fff3f3;color:#8c101c;font-weight:800}
</style>
</head>
<body>
<iframe id="app" title="Magic Numbers Constellation"></iframe>
<div id="loading">جارٍ تطبيق إظهار الشعار والإطار حسب نوع العجلة…</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var SOURCE='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/e1426c05e59c3395e9fb54c1b6482139b07a1551/public/kawkabat-al-arqam-al-sihria.html';
var BRANDING_IDS=['logoImage','angleFrame','angleTicks','angleLabels','outerBlackFrame','cardinalOrnaments'];
var frame=document.getElementById('app');
var loading=document.getElementById('loading');
var errorBox=document.getElementById('error');
var lastWheelFrame=null;

function showError(error){
  errorBox.style.display='block';
  errorBox.textContent='BRANDING GATE ERROR: '+String(error&&error.message||error);
}
function shellDocument(){
  try{return frame.contentDocument||null;}catch(_){return null;}
}
function panelDocument(){
  try{
    var shell=shellDocument();
    if(!shell)return null;
    var functional=shell.getElementById('app');
    if(!functional||!functional.contentDocument)return null;
    var panelFrame=functional.contentDocument.getElementById('app');
    return panelFrame&&panelFrame.contentDocument?panelFrame.contentDocument:null;
  }catch(_){return null;}
}
function wheelFrame(){
  var panel=panelDocument();
  return panel?panel.getElementById('wheelFrame'):null;
}
function wheelDocument(){
  try{var wf=wheelFrame();return wf&&wf.contentDocument?wf.contentDocument:null;}catch(_){return null;}
}
function viewControl(){
  var panel=panelDocument();
  if(!panel)return null;
  return Array.from(panel.querySelectorAll('[data-key]')).find(function(node){return node.dataset.key==='core.view';})||null;
}
function currentView(){
  var control=viewControl();
  return control?String(control.value):'square9';
}
function applyBrandingGate(){
  try{
    var doc=wheelDocument();
    if(!doc)return false;
    var view=currentView();
    var visible=view==='circle36';
    BRANDING_IDS.forEach(function(id){
      var node=doc.getElementById(id);
      if(!node)return;
      node.style.setProperty('display',visible?'':'none','important');
      node.setAttribute('aria-hidden',visible?'false':'true');
    });
    doc.documentElement.dataset.circle36BrandingVisible=visible?'true':'false';
    doc.documentElement.dataset.circle36BrandingView=view;
    errorBox.style.display='none';
    return true;
  }catch(error){showError(error);return false;}
}
function bindWheelLoad(){
  var wf=wheelFrame();
  if(!wf||wf===lastWheelFrame)return;
  lastWheelFrame=wf;
  wf.addEventListener('load',function(){
    setTimeout(applyBrandingGate,40);
    setTimeout(applyBrandingGate,180);
    setTimeout(applyBrandingGate,500);
  });
}
function bindPanel(){
  var panel=panelDocument();
  if(!panel||panel.documentElement.dataset.circle36BrandingHooked==='true')return;
  panel.documentElement.dataset.circle36BrandingHooked='true';
  panel.addEventListener('input',function(event){if(event.target&&event.target.dataset&&event.target.dataset.key==='core.view')setTimeout(applyBrandingGate,40);},true);
  panel.addEventListener('change',function(event){if(event.target&&event.target.dataset&&event.target.dataset.key==='core.view'){setTimeout(applyBrandingGate,40);setTimeout(applyBrandingGate,250);}},true);
}
function sync(){bindPanel();bindWheelLoad();applyBrandingGate();}

frame.addEventListener('load',function(){
  if(loading)loading.remove();
  setTimeout(sync,250);
  setTimeout(sync,700);
  setTimeout(sync,1400);
});
frame.src=SOURCE;
window.setInterval(sync,500);
window.__auditCircle36BrandingGateV1=function(){
  var doc=wheelDocument();
  return{
    ok:!!doc,
    view:currentView(),
    brandingVisible:doc?doc.documentElement.dataset.circle36BrandingVisible:null,
    controlledIds:BRANDING_IDS.slice(),
    logoVisible:doc&&doc.getElementById('logoImage')?doc.getElementById('logoImage').style.display!=='none':null,
    outerFrameVisible:doc&&doc.getElementById('outerBlackFrame')?doc.getElementById('outerBlackFrame').style.display!=='none':null
  };
};
}());
</script>
</body>
</html>
