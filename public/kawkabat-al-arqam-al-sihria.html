<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Wheel Scrollbar Removed</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading approved structure…</div>
  <script>
    (async function(){
      'use strict';
      var sourceApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
      try{
        var response=await fetch(sourceApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok)throw new Error('SOURCE_HTTP_'+response.status);
        var payload=await response.json();
        var binary=atob(String(payload.content||'').replace(/\s/g,''));
        var bytes=new Uint8Array(binary.length);
        for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
        var html=new TextDecoder('utf-8').decode(bytes);

        html=html.replace('</style>',
          '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important}'+
          '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
          '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
          '</style>');

        html=html.replace(
          '<iframe class="work-frame"',
          '<iframe class="work-frame" scrolling="no"'
        );

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
      }
    }());
  </script>
</body>
</html>
