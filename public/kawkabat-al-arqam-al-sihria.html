<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية — Square of 9 Reference Layout V17</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/saloqbi/TasiGanzilla/square9-direct-expanded-v15/public/kawkabat-square9-v13.css">
  <style>
    #v16Badge{
      position:fixed;
      right:12px;
      bottom:10px;
      z-index:3000;
      padding:5px 8px;
      border:1px solid #7a7a7a;
      border-radius:4px;
      background:rgba(255,255,255,.94);
      font:700 11px Arial;
      color:#555;
      direction:ltr
    }
  </style>
</head>
<body>
  <header id="toolbar">
    <div class="brand">
      <span class="brand-logo"></span>
      <span>Gannzilla Pro — كوكبة تاسي</span>
    </div>
    <div class="tools">
      <button class="tool active" data-tool="cursor">↖</button>
      <button class="tool" data-tool="line">―</button>
      <button class="tool" data-tool="rectangle">□</button>
      <button class="tool" data-tool="text">T</button>
      <button class="tool" data-tool="lock">▣</button>
      <button class="tool" data-tool="search">⌕</button>
      <span class="sep"></span>
      <button id="zoomOut" class="quick">−</button>
      <span id="zoomReadout" class="zoom-text">100%</span>
      <button id="zoomIn" class="quick">＋</button>
      <button id="fit" class="quick">⛶</button>
      <button id="full" class="quick">▣</button>
      <span class="sep"></span>
      <div id="lang" class="lang"><span>🇬🇧</span><span id="langText">English</span><span>▾</span></div>
      <button class="quick">ⓘ</button>
    </div>
  </header>

  <iframe
    id="panelFrame"
    title="Gannzilla property panel"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/286ae8235df5ddc68e0ef2980701d7cddee2bcbf/public/kawkabat-al-arqam-al-sihria.html">
  </iframe>

  <main id="stage">
    <svg id="squareSvg" viewBox="0 0 1000 1000" role="img" aria-label="Square of 9 reference-aligned angle wheel"></svg>
    <iframe id="circleFrame" title="Circle of 36"></iframe>
    <div id="status">Square of 9 • reference-aligned wheel • 19×19 • 1–361</div>
  </main>

  <nav id="viewRail" class="rail" aria-label="Views">
    <button class="round" data-view="circle12">12</button>
    <button class="round" data-view="circle24">24</button>
    <button class="round" data-view="circle36">36</button>
    <button data-view="square4">4</button>
    <button class="active" data-view="square9">9</button>
    <button data-view="permanentSquare">N</button>
    <button data-view="tetragon">◆</button>
    <button data-figure="Pentagon">⬠</button>
    <button data-figure="Hexagon">⬡</button>
    <button data-figure="Octagon">⯃</button>
    <button data-figure="Dodecagon">✺</button>
  </nav>

  <nav id="shapeRail" class="rail" aria-label="Figures">
    <button class="green" data-figure="Triangle"><span class="poly tri"></span></button>
    <button class="red" data-figure="Square"><span class="poly"></span></button>
    <button data-figure="Pentagon"><span class="poly pent"></span></button>
    <button class="cyan" data-figure="Hexagon"><span class="poly hex"></span></button>
    <button class="violet" data-figure="Septagon">⬡</button>
    <button class="violet" data-figure="Octagon"><span class="poly oct"></span></button>
    <button class="violet" data-figure="Nonagon">⯃</button>
    <button class="gold" data-figure="Dodecagon">◯</button>
    <button data-action="locator">∠</button>
    <button data-action="marker">◒</button>
    <button class="vortex" data-action="vortex">◎</button>
  </nav>

  <div id="loading">جارٍ بناء العرض المرجعي وضبط الجدول والهندسة…</div>
  <div id="v16Badge">V17 waiting…</div>

  <script>
    (async()=>{
      try{
        const base='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/square9-direct-expanded-v15/public/';
        const parts=[
          'kawkabat-square9-v13.part1.txt',
          'kawkabat-square9-v13.part2.txt',
          'kawkabat-square9-v13.part3.txt'
        ];
        const code=await Promise.all(parts.map(name=>fetch(base+name,{cache:'no-store'}).then(response=>{
          if(!response.ok)throw Error(name+' HTTP '+response.status);
          return response.text();
        })));
        (0,eval)(code.join('\n'));

        const patchUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/64142cbec36d93b8ea779d91255a2359e503c1c4/public/kawkabat-square9-v17-reference-patch.js';
        const patch=await fetch(patchUrl,{cache:'no-store'}).then(response=>{
          if(!response.ok)throw Error('V17 PATCH HTTP '+response.status);
          return response.text();
        });
        (0,eval)(patch);
      }catch(error){
        document.getElementById('loading').textContent='تعذر تشغيل المحرك: '+error.message;
        document.getElementById('v16Badge').textContent='V17 ERROR';
      }
    })();
  </script>
</body>
</html>
