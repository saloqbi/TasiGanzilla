<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كود أول عجلة اللوجو بتنظيم</title>
  <style>
    :root { background: #F7F1E3; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F1E3;
    }
    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }
    svg {
      display: block;
      width: min(94vw, 900px);
      height: min(94vh, 900px);
      filter: drop-shadow(0 7px 14px rgba(35, 57, 68, .24));
    }
    .ray-shadow {
      stroke: #263943;
      stroke-width: 4.4;
      stroke-linecap: round;
      opacity: .88;
      vector-effect: non-scaling-stroke;
    }
    .ray-metal {
      stroke: url(#blueSteelStroke);
      stroke-width: 2.7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .ray-highlight {
      stroke: url(#blueSteelHighlight);
      stroke-width: .85;
      stroke-linecap: round;
      opacity: .98;
      vector-effect: non-scaling-stroke;
    }
    .frame-shadow {
      fill: none;
      stroke: #263943;
      stroke-width: 7.4;
      opacity: .82;
      vector-effect: non-scaling-stroke;
    }
    .frame-metal {
      fill: none;
      stroke: url(#blueSteelStroke);
      stroke-width: 5.2;
      vector-effect: non-scaling-stroke;
    }
    .frame-highlight {
      fill: none;
      stroke: url(#blueSteelHighlight);
      stroke-width: 1.5;
      opacity: .96;
      vector-effect: non-scaling-stroke;
    }
    .number-text {
      font-family: Arial, Tahoma, sans-serif;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      direction: ltr;
      unicode-bidi: bidi-override;
      paint-order: stroke fill;
      stroke: #E7CB84;
      stroke-width: 1.05;
      stroke-opacity: .72;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.82));
    }
    .ring-one-number { font-size: 28px; }
    .ring-two-number { font-size: 29px; }
    .number-red { fill: #B21F2D; }
    .number-blue { fill: #174B98; }
    .number-black { fill: #17191B; }
    #logoImage {
      opacity: 0;
      transition: opacity .18s linear;
    }
    html[data-logo-ready="true"] #logoImage { opacity: 1; }
  </style>
</head>
<body>
  <svg id="wheel" viewBox="0 0 1000 1000" role="img" aria-label="كود أول عجلة اللوجو بتنظيم">
    <defs>
      <clipPath id="logoClip">
        <circle cx="500" cy="500" r="179" />
      </clipPath>

      <linearGradient id="blueSteelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#20333D" />
        <stop offset="18%" stop-color="#6F8793" />
        <stop offset="36%" stop-color="#DDE8EC" />
        <stop offset="50%" stop-color="#8AA0AA" />
        <stop offset="68%" stop-color="#4D6875" />
        <stop offset="84%" stop-color="#B9D4DE" />
        <stop offset="100%" stop-color="#263B46" />
      </linearGradient>

      <linearGradient id="blueSteelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F1FBFF" />
        <stop offset="42%" stop-color="#9AD7ED" />
        <stop offset="100%" stop-color="#557685" />
      </linearGradient>
    </defs>

    <g id="divisions"></g>

    <image
      id="logoImage"
      x="321"
      y="321"
      width="358"
      height="358"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#logoClip)"
    />

    <!-- إطار الشعار -->
    <circle class="frame-shadow" cx="500" cy="500" r="180" />
    <circle class="frame-metal" cx="500" cy="500" r="180" />
    <circle class="frame-highlight" cx="500" cy="500" r="174" />

    <!-- الإطار الثاني: الأرقام 1 إلى 36 -->
    <circle class="frame-shadow" cx="500" cy="500" r="290" />
    <circle class="frame-metal" cx="500" cy="500" r="290" />
    <circle class="frame-highlight" cx="500" cy="500" r="284" />

    <!-- الإطار الثالث: الاختزال الرقمي 1 إلى 9 -->
    <circle class="frame-shadow" cx="500" cy="500" r="400" />
    <circle class="frame-metal" cx="500" cy="500" r="400" />
    <circle class="frame-highlight" cx="500" cy="500" r="394" />

    <g id="numbersRingOne" aria-label="تسلسل الأرقام من 1 إلى 36"></g>
    <g id="numbersRingTwo" aria-label="تسلسل الاختزال الرقمي من 1 إلى 9"></g>
  </svg>

  <script>
    (function () {
      'use strict';

      var SVG_NS = 'http://www.w3.org/2000/svg';
      var XLINK_NS = 'http://www.w3.org/1999/xlink';
      var divisions = document.getElementById('divisions');
      var numbersRingOne = document.getElementById('numbersRingOne');
      var numbersRingTwo = document.getElementById('numbersRingTwo');
      var logoImage = document.getElementById('logoImage');
      var cx = 500;
      var cy = 500;
      var innerRadius = 180;
      var middleRadius = 290;
      var outerRadius = 400;
      var ringOneTextRadius = (innerRadius + middleRadius) / 2;
      var ringTwoTextRadius = (middleRadius + outerRadius) / 2;

      function appendRayLine(rayGroup, className, x1, y1, x2, y2) {
        var line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', String(x1));
        line.setAttribute('y1', String(y1));
        line.setAttribute('x2', String(x2));
        line.setAttribute('y2', String(y2));
        line.setAttribute('class', className);
        rayGroup.appendChild(line);
      }

      function numberColorClass(value) {
        var remainder = value % 3;
        if (remainder === 1) return 'number-red';
        if (remainder === 2) return 'number-blue';
        return 'number-black';
      }

      function appendNumber(group, value, angle, radius, ringClass) {
        var text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', String(cx + Math.cos(angle) * radius));
        text.setAttribute('y', String(cy + Math.sin(angle) * radius));
        text.setAttribute('class', 'number-text ' + ringClass + ' ' + numberColorClass(value));
        text.textContent = String(value);
        group.appendChild(text);
      }

      for (var i = 0; i < 36; i += 1) {
        var boundaryAngle = ((i * 10) - 90) * Math.PI / 180;
        var centerAngle = ((i * 10) - 85) * Math.PI / 180;
        var x1 = cx + Math.cos(boundaryAngle) * innerRadius;
        var y1 = cy + Math.sin(boundaryAngle) * innerRadius;
        var x2 = cx + Math.cos(boundaryAngle) * outerRadius;
        var y2 = cy + Math.sin(boundaryAngle) * outerRadius;
        var rayGroup = document.createElementNS(SVG_NS, 'g');
        rayGroup.setAttribute('class', 'ray');
        rayGroup.setAttribute('data-ray-index', String(i));
        appendRayLine(rayGroup, 'ray-shadow', x1, y1, x2, y2);
        appendRayLine(rayGroup, 'ray-metal', x1, y1, x2, y2);
        appendRayLine(rayGroup, 'ray-highlight', x1, y1, x2, y2);
        divisions.appendChild(rayGroup);

        var fullValue = i + 1;
        var digitalRootValue = (i % 9) + 1;
        appendNumber(numbersRingOne, fullValue, centerAngle, ringOneTextRadius, 'ring-one-number');
        appendNumber(numbersRingTwo, digitalRootValue, centerAngle, ringTwoTextRadius, 'ring-two-number');
      }

      var chunkBase = 'https://raw.githubusercontent.com/saloqbi/TasiGanzilla/main/public/kawkabat-logo-v1/chunk-';
      var chunkUrls = [0, 1, 2, 3, 4].map(function (index) {
        return chunkBase + index + '.txt';
      });

      Promise.all(chunkUrls.map(function (url) {
        return fetch(url, { cache: 'no-store' }).then(function (response) {
          if (!response.ok) {
            throw new Error('LOGO_CHUNK_HTTP_' + response.status);
          }
          return response.text();
        });
      })).then(function (chunks) {
        var source = 'data:image/webp;base64,' + chunks.join('').trim();
        logoImage.setAttribute('href', source);
        logoImage.setAttributeNS(XLINK_NS, 'href', source);
        document.documentElement.dataset.logoReady = 'true';
      }).catch(function () {
        document.documentElement.dataset.logoReady = 'false';
      });

      window.__auditKawkabatLogoWheelV4 = function () {
        return {
          ok: divisions.children.length === 36 && numbersRingOne.children.length === 36 && numbersRingTwo.children.length === 36,
          build: 4,
          name: 'كود أول عجلة اللوجو بتنظيم',
          metallicColor: 'glossy-blue-steel',
          approvedNumberColors: ['royal-red', 'royal-blue', 'charcoal-black', 'light-gold-accent'],
          rayCount: divisions.children.length,
          rayLayers: 3,
          ringTwoSequence: '1-36-clockwise',
          ringThreeSequence: '1-9-digital-root-repeated-clockwise',
          ringTwoNumberCount: numbersRingOne.children.length,
          ringThreeNumberCount: numbersRingTwo.children.length,
          logoFrameRadius: 180,
          logoImageDiameter: 358,
          logoClippedToFrame: true,
          background: '#F7F1E3',
          logoReady: document.documentElement.dataset.logoReady === 'true'
        };
      };
    }());
  </script>
</body>
</html>
