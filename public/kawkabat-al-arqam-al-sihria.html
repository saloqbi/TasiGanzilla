<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Angle Frames Clean V11</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;color:#554b42;font-weight:800}
#error{position:fixed;right:16px;bottom:14px;z-index:30;display:none;max-width:640px;padding:10px 14px;border:1px solid #a32935;border-radius:6px;background:#fff3f3;color:#8c101c;font-weight:800}
</style>
</head>
<body>
<iframe id="app" title="Square of 9 clean angle frames"></iframe>
<div id="loading">جارٍ إلغاء رموز الأبراج وتنظيم الإطارين الأحمر والأخضر…</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var SOURCE='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/b5aee23491eb516604631753b4e8ee79bafb7115/public/kawkabat-al-arqam-al-sihria.html';
var NS='http://www.w3.org/2000/svg';
var ROOT_ID='cleanAngleFramesV11';
var ZODIAC=new Set(['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓']);
var frame=document.getElementById('app');
var loading=document.getElementById('loading');
var errorBox=document.getElementById('error');

function findSquareDocument(win,seen){
  seen=seen||new Set();
  try{
    if(!win||seen.has(win))return null;
    seen.add(win);
    var doc=win.document;
    if(doc&&doc.getElementById('squareSvg'))return doc;
    var frames=doc?Array.from(doc.querySelectorAll('iframe')):[];
    for(var i=0;i<frames.length;i++){
      try{var found=findSquareDocument(frames[i].contentWindow,seen);if(found)return found;}catch(_){}
    }
  }catch(_){}
  return null;
}
function S(doc,tag,attrs){
  var node=doc.createElementNS(NS,tag);
  Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,String(attrs[key]));});
  return node;
}
function removeZodiacGlyphs(doc,square){
  ['approvedZodiacInsideGridV7','approvedZodiacInsideGridV8','approvedZodiacInsideGridV9','approvedZodiacInsideGridV10'].forEach(function(id){
    var node=doc.getElementById(id);if(node)node.remove();
  });
  Array.from(square.querySelectorAll('text')).forEach(function(node){
    if(ZODIAC.has(String(node.textContent||'').trim()))node.remove();
  });
}
function colorLooksRed(value){
  value=String(value||'').toLowerCase();
  return value==='red'||value.includes('#ff0000')||value.includes('#e75b5b')||value.includes('#df3f3f')||value.includes('#d34')||value.includes('#e36');
}
function colorLooksGreen(value){
  value=String(value||'').toLowerCase();
  return value==='green'||value.includes('#008000')||value.includes('#21a43b')||value.includes('#58a95f')||value.includes('#2a9')||value.includes('#4c9');
}
function removeDuplicateFrames(doc,square){
  ['protractor','chronometer','engineProtractor','engineChronometer','chronometerGuaranteedLayer','protractorGuaranteedLayer','protractorIntegratedLayer','chronometerIntegratedLayer'].forEach(function(id){
    var node=doc.getElementById(id);if(node)node.style.setProperty('display','none','important');
  });
  Array.from(square.querySelectorAll('circle')).forEach(function(circle){
    if(circle.closest('#'+ROOT_ID))return;
    var r=Number(circle.getAttribute('r'));
    if(!Number.isFinite(r)||r<325||r>390)return;
    var stroke=circle.getAttribute('stroke')||circle.style.stroke||'';
    if(colorLooksRed(stroke)||colorLooksGreen(stroke))circle.style.setProperty('display','none','important');
  });
}
function drawCleanFrames(doc,square){
  var old=doc.getElementById(ROOT_ID);if(old)old.remove();
  var root=S(doc,'g',{id:ROOT_ID,'data-frame-layout':'red-inner-green-outer','pointer-events':'none'});
  var anchor=doc.getElementById('mainShapes');
  if(anchor&&anchor.parentNode===square)square.insertBefore(root,anchor);else square.appendChild(root);

  root.appendChild(S(doc,'circle',{
    cx:500,cy:500,r:346,
    fill:'none',stroke:'#df3f3f','stroke-width':2.7,
    'stroke-opacity':0.96,'vector-effect':'non-scaling-stroke'
  }));
  root.appendChild(S(doc,'circle',{
    cx:500,cy:500,r:363,
    fill:'none',stroke:'#1f9f3a','stroke-width':2.7,
    'stroke-opacity':0.96,'vector-effect':'non-scaling-stroke'
  }));
}
function applyFix(){
  try{
    var doc=findSquareDocument(frame.contentWindow);
    if(!doc)return false;
    var square=doc.getElementById('squareSvg');
    if(!square||doc.defaultView.getComputedStyle(square).display==='none')return false;
    removeZodiacGlyphs(doc,square);
    removeDuplicateFrames(doc,square);
    drawCleanFrames(doc,square);
    doc.documentElement.dataset.zodiacGlyphsRemovedV11='true';
    doc.documentElement.dataset.cleanAngleFramesV11='2';
    errorBox.style.display='none';
    return true;
  }catch(error){
    errorBox.style.display='block';
    errorBox.textContent='ANGLE FRAMES V11 ERROR: '+String(error&&error.message||error);
    return false;
  }
}
frame.addEventListener('load',function(){
  if(loading)loading.remove();
  setTimeout(applyFix,260);
  setTimeout(applyFix,850);
  setTimeout(applyFix,1700);
});
frame.src=SOURCE;
window.setInterval(function(){
  var doc=findSquareDocument(frame.contentWindow);
  if(!doc||!doc.getElementById(ROOT_ID))applyFix();
  else{
    var square=doc.getElementById('squareSvg');
    if(square){removeZodiacGlyphs(doc,square);removeDuplicateFrames(doc,square);}
  }
},450);
window.__auditSquare9AngleFramesCleanV11=function(){
  var doc=findSquareDocument(frame.contentWindow);
  var root=doc?doc.getElementById(ROOT_ID):null;
  var zodiacCount=0;
  if(doc){
    var square=doc.getElementById('squareSvg');
    if(square)zodiacCount=Array.from(square.querySelectorAll('text')).filter(function(node){return ZODIAC.has(String(node.textContent||'').trim());}).length;
  }
  return{
    ok:!!root,
    frameCount:root?root.querySelectorAll('circle').length:0,
    zodiacGlyphCount:zodiacCount,
    layout:root?root.dataset.frameLayout:null,
    redRadius:346,
    greenRadius:363
  };
};
}());
</script>
</body>
</html>
