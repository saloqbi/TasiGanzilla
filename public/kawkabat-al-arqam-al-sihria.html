<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Clockwise Direct</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading approved structure…</div>
  <script>
  (async function(){
    'use strict';
    var approvedApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var wheelUrl='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/52bb110d2d5be06acf1b570722dfaae7f116a8a5/public/kawkabat-wheel-cycles1to10.html';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:auto!important;outline:none!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '.panel-bottom{display:flex!important;align-items:center!important;padding:0 10px!important;font-size:12px!important;font-weight:800!important;color:#33444c!important}'+
        '.panel-bottom::before{content:"";width:9px;height:9px;border-radius:50%;background:#3fa35b;margin-right:7px}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');

      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<iframe id="workFrame" class="work-frame" title="Magic Numbers Constellation" tabindex="0" scrolling="yes" src="'+wheelUrl+'"></iframe>'
      );

      var clockwiseScript='<script id="clockwise-direct-binding-v2">(function(){'+
        "'use strict';"+
        'var frame=document.getElementById("workFrame"),input=document.querySelector("[aria-label=\\"Layout clockwise\\"]"),bottom=document.querySelector(".panel-bottom"),timer=null,attempts=0,bound=false;'+
        'var CX=2200,CY=1800;'+
        'function status(message){if(bottom)bottom.textContent=message;}'+
        'function polar(radius,degree){var angle=degree*Math.PI/180;return{x:CX+Math.cos(angle)*radius,y:CY+Math.sin(angle)*radius};}'+
        'function findWheelDocument(root){if(!root)return null;try{if(root.getElementById("wheel")&&root.getElementById("numbersCycle10"))return root;var frames=root.querySelectorAll("iframe");for(var i=0;i<frames.length;i+=1){var child=null;try{child=frames[i].contentDocument;}catch(error){child=null;}var found=findWheelDocument(child);if(found)return found;}}catch(error){}return null;}'+
        'function apply(clockwise,doc){for(var cycle=1;cycle<=10;cycle+=1){var group=doc.getElementById("numbersCycle"+cycle);if(!group)continue;var radius=455+((cycle-1)*110);Array.prototype.forEach.call(group.children,function(node,index){var degree=(clockwise?index*10:-index*10)-90,p=polar(radius,degree);node.setAttribute("x",p.x);node.setAttribute("y",p.y);});}[["calendarDaysRing",1580],["zodiacElementsRing",1538]].forEach(function(pair){var group=doc.getElementById(pair[0]);if(!group)return;Array.prototype.forEach.call(group.children,function(node,index){var degree=clockwise?index*10:-index*10,normalized=((degree%360)+360)%360,p=polar(pair[1],degree-90),rotation=normalized;if(normalized>90&&normalized<270)rotation+=180;node.setAttribute("x",p.x);node.setAttribute("y",p.y);node.setAttribute("transform","rotate("+rotation+" "+p.x+" "+p.y+")");});});doc.documentElement.dataset.clockwise=clockwise?"true":"false";status(clockwise?"Clockwise مفعل — مع عقارب الساعة":"Clockwise ملغي — عكس عقارب الساعة");}'+
        'function connect(){attempts+=1;var root=null;try{root=frame&&frame.contentDocument;}catch(error){root=null;}var doc=findWheelDocument(root);if(!doc){if(attempts<180)timer=setTimeout(connect,200);else status("العجلة ظاهرة لكن تعذر الوصول إلى Runtime لتفعيل Clockwise");return;}if(!bound&&input){bound=true;input.checked=true;input.addEventListener("change",function(){apply(!!input.checked,doc);});}apply(input?!!input.checked:true,doc);}'+
        'if(frame)frame.addEventListener("load",function(){attempts=0;if(timer)clearTimeout(timer);timer=setTimeout(connect,150);});'+
        'status("جارٍ ربط Clockwise مباشرة بالعجلة…");setTimeout(connect,300);'+
      '}());'+closeTag;
      html=html.replace('</body>',clockwiseScript+'</body>');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
