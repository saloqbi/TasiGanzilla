<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية — Square of 9 Default</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e3}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f7f1e3;color:#50463f;font-weight:800;z-index:2}
</style>
</head>
<body>
<div id="loading">جارٍ تشغيل Square of 9…</div>
<script>
(function(){
'use strict';
var STORAGE='kawkabat-complete-panel-v1';
var MIGRATION='kawkabat-square9-default-migration-v1';
var state={};
try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(_){state={}}

if(localStorage.getItem(MIGRATION)!=='done'){
  state['core.visible']=true;
  state['core.clockwise']=true;
  state['core.size']='10';
  state['core.view']='square9';
  state['core.dataType']='price';
  state['core.value']='1';
  state['core.find']='1';
  state['core.increment']='1';
  state['core.highlightVisible']=true;
  state['core.highlightFill']='cross';
  state['core.showMarks']=true;
  state['core.showNumbers']=false;

  state['protractor.visible']=true;
  state['protractor.clockwise']=true;
  state['protractor.angle']='0';
  state['chronometer.visible']=true;
  state['chronometer.clockwise']=true;
  state['chronometer.angle']='0';
  state['chronometer.range']='Annual';
  state['cosmogram.visible']=true;
  state['cosmogram.clockwise']=true;
  state['cosmogram.angle']='0';
  state['cosmogram.system']='Geocentric';
  state['moon.visible']=true;
  state['cycles.visible']=true;

  localStorage.setItem(STORAGE,JSON.stringify(state));
  localStorage.setItem(MIGRATION,'done');
}

var frame=document.createElement('iframe');
frame.id='app';
frame.title='Magic Numbers Constellation — Square of 9';
frame.src='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/ef7b3237ee1a48bc9761b9b0ee8657cbc45a43bd/public/kawkabat-al-arqam-al-sihria.html';
frame.addEventListener('load',function(){var loading=document.getElementById('loading');if(loading)loading.remove();});
document.body.appendChild(frame);

window.__auditSquareOf9DefaultV1=function(){
  var saved={};
  try{saved=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(_){}
  return{
    ok:true,
    defaultView:saved['core.view'],
    circle36OnlyWhenSelected:saved['core.view']!=='circle36',
    migration:localStorage.getItem(MIGRATION)
  };
};
}());
</script>
</body>
</html>
