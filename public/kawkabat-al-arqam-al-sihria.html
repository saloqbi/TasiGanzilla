<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية</title>
  <meta name="description" content="كوكبة الأرقام السحرية — القاعدة الجديدة النظيفة" />
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Tahoma, sans-serif;
      background: #f7f3e8;
      color: #1b1b1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.96), rgba(247,243,232,.96) 55%, #efe8d7 100%);
      overflow: hidden;
    }
    main {
      width: min(94vw, 1100px);
      min-height: min(88vh, 760px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 24px;
      padding: 38px;
      border: 1px solid rgba(91,55,12,.20);
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 26px 70px rgba(58,35,9,.14);
      backdrop-filter: blur(7px);
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 800;
      letter-spacing: .01em;
      color: #2b1a06;
      text-align: center;
    }
    .stage {
      width: min(72vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, transparent 0 39%, rgba(183,132,54,.12) 39.2% 39.7%, transparent 39.9%),
        repeating-conic-gradient(from -5deg, rgba(88,61,24,.18) 0 .35deg, transparent .35deg 10deg),
        radial-gradient(circle, #fffdf7 0 72%, #e9dcc1 72.5% 74%, #2c1a05 74.5% 76%, #c98b33 76.5% 79%, #1c1104 79.5% 82%, #e7b867 82.5% 85%, #3b2107 85.5% 88%, #d6a34d 88.5% 91%, #211204 91.5% 94%, transparent 94.5%);
      box-shadow: 0 18px 42px rgba(65,39,7,.18);
    }
    .stage::before,
    .stage::after {
      content: '';
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(122,82,27,.22);
    }
    .stage::after { inset: 26%; }
    .center {
      width: 23%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fffdf7;
      border: 2px solid #c6923f;
      box-shadow: inset 0 0 0 6px rgba(231,203,149,.34);
      font-weight: 800;
      color: #6a4312;
      text-align: center;
      line-height: 1.4;
      font-size: clamp(13px, 2vw, 19px);
      z-index: 1;
    }
    footer {
      font-size: 14px;
      color: #6f624f;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>كوكبة الأرقام السحرية</h1>
    <section class="stage" aria-label="قاعدة العجلة الجديدة">
      <div class="center">القاعدة الجديدة<br />V1</div>
    </section>
    <footer>قاعدة مستقلة ونظيفة — بدون أي استدعاء من العمل السابق</footer>
  </main>
</body>
</html>
