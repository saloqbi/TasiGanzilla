 var code="(function(){\n'use strict';\nvar NS='http://www.w3.org/2000/svg',CX=2200,CY=1800,INNER=180,STEP=110;\nvar frame=document.getElementById('workFrame');\nvar state={visible:true,clockwise:true,size:10,wheel:3,start:1,count:36,increment:1,fontSize:24,highlightVisible:false,highlightFill:'Levels',highlightMarks:false,highlightNumbers:false,find:1,protractorVisible:false,protractorClockwise:true,protractorAngle:0};\nvar retry=0,timer=null,statusNode=null;\nfunction n(v,f){var x=Number(String(v==null?'':v).replace(/[^0-9.+-]/g,''));return Number.isFinite(x)?x:f;}\nfunction clamp(v,a,b){return Math.max(a,Math.min(b,v));}\nfunction qLabel(label){return document.querySelector('[aria-label=\\\"'+label+'\\\"]');}\nfunction section(name){return Array.prototype.find.call(document.querySelectorAll('.control-section'),function(s){var x=s.querySelector('.section-name');return x&&x.textContent.trim()===name;});}\nfunction bodyFor(s){return s&&s.querySelector('.section-body');}\nfunction row(label,control){return '<div class=\\\"control-row\\\"><div class=\\\"control-label\\\">'+label+'</div><div class=\\\"control-value\\\">'+control+'</div></div>';}\nfunction setExpanded(s,on){if(!s)return;s.classList.toggle('collapsed',!on);var b=s.querySelector('.section-toggle'),sg=s.querySelector('.section-sign');if(b)b.setAttribute('aria-expanded',on?'true':'false');if(sg)sg.textContent=on?'−':'+';}\nfunction status(text,kind){if(!statusNode){statusNode=document.createElement('div');statusNode.id='gannLinkStatusV5';statusNode.style.cssText='position:fixed;left:8px;top:55px;z-index:5000;padding:7px 10px;border-radius:6px;font:800 12px Arial;background:#f4d77c;color:#222;box-shadow:0 1px 5px rgba(0,0,0,.3);max-width:365px';document.body.appendChild(statusNode);}statusNode.textContent=text;statusNode.dataset.kind=kind||'waiting';statusNode.style.background=kind==='ready'?'#67c77a':kind==='error'?'#e47777':'#f4d77c';}\nfunction getDoc(){try{var d=frame&&frame.contentDocument;return d&&d.g
