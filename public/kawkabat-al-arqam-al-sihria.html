<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Highlight Active V1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العمل مع Highlight…</div>
  <script>
  (async function(){
    'use strict';
    var panelUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/d5892894ad1f6c0c1c1018d938dcedf25ebc9ac8/public/kawkabat-panel-base.html';
    var runtimeBase='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/9e26516c5ae03114c9325ffcab86a6c42161a968/public/kawkabat-wheel-runtime-highlight-v1.html';

    try{
      var response=await fetch(panelUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('PANEL_BASE_HTTP_'+response.status);
      var html=await response.text();

      html=html.replace('Magic Numbers Constellation — Main Control Panel','Magic Numbers Constellation — Highlight Active V1');
      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important;background:#F7F1E3!important}'+
        '.wheel-stack{position:fixed!important}'+
        '.wheel-layer{position:absolute!important;top:0!important;left:0!important;border:0!important;background:#F7F1E3!important;visibility:hidden!important;pointer-events:none!important;transform-origin:0 0!important}'+
        '.wheel-layer.is-active{visibility:visible!important;pointer-events:auto!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '.panel-bottom{display:flex!important;align-items:center!important;padding:0 10px!important;font-size:12px!important;font-weight:800!important;color:#33444c!important}'+
        '.panel-bottom::before{content:"";width:9px;height:9px;border-radius:50%;margin-right:7px;background:#d3a80b}'+
        '.panel-bottom[data-status="success"]::before{background:#31a354}'+
        '.panel-bottom[data-status="error"]::before{background:#c93d3d}'+
        '.panel-bottom[data-status="loading"]::before{background:#d3a80b}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');

      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<div id="workFrame" class="work-frame wheel-stack" role="region" aria-label="Magic Numbers Constellation">'+
          '<iframe id="clockwiseWheel" class="wheel-layer is-active" title="Clockwise wheel" scrolling="yes"></iframe>'+
          '<iframe id="counterclockwiseWheel" class="wheel-layer" title="Counterclockwise wheel" scrolling="yes"></iframe>'+
        '</div>'
      );

      var marker='requestAnimationFrame(updateThumb);';
      if(html.indexOf(marker)<0)throw new Error('PANEL_RUNTIME_MARKER_NOT_FOUND');

      var binding=`
        var wheelStack=document.getElementById('workFrame');
        var clockwiseWheel=document.getElementById('clockwiseWheel');
        var counterclockwiseWheel=document.getElementById('counterclockwiseWheel');
        var visibleControl=document.querySelector('[aria-label="Layout visible"]');
        var clockwiseControl=document.querySelector('[aria-label="Layout clockwise"]');
        var sizeControl=document.querySelector('[aria-label="Size"]');
        var viewControl=document.querySelector('[aria-label="View"]');
        var dataTypeControl=document.querySelector('[aria-label="Data type"]');
        var valueControl=document.querySelector('[aria-label="Value"]');
        var findControl=document.querySelector('[aria-label="Find"]');
        var incrementControl=document.querySelector('[aria-label="Increment"]');
        var highlightVisibleControl=document.querySelector('[aria-label="Highlight visible"]');
        var highlightFillControl=document.querySelector('[aria-label="Highlight fill"]');
        var highlightMarksControl=document.querySelector('[aria-label="Show marks"]');
        var highlightNumbersControl=document.querySelector('[aria-label="Show numbers"]');
        var panelStatus=document.querySelector('.panel-bottom');
        var runtimeBase=${JSON.stringify(runtimeBase)};
        var reloadTimer=0,reloadNonce=0,loadedCount=0;

        var viewOptions=[
          {value:'permanentSquare',label:'Permanent square'},
          {value:'circle12',label:'Circle of 12'},
          {value:'circle24',label:'Circle of 24'},
          {value:'circle36',label:'Circle of 36'},
          {value:'square4',label:'Square of 4'},
          {value:'square9',label:'Square of 9'},
          {value:'tetragon',label:'Tetragon'}
        ];
        var dataTypeOptions=[
          {value:'price',label:'Price'},
          {value:'date',label:'Date'},
          {value:'time',label:'Time'},
          {value:'priceDate',label:'Price and date'},
          {value:'priceTime',label:'Price and time'}
        ];

        function setStatus(mode,message){
          if(!panelStatus)return;
          panelStatus.setAttribute('data-status',mode);
          panelStatus.textContent=message;
        }
        function fillSelect(select,items,selected){
          select.innerHTML='';
          items.forEach(function(item){var option=document.createElement('option');option.value=item.value;option.textContent=item.label;select.appendChild(option);});
          select.value=selected;
        }
        function normalizeNumericText(value){
          var arabic='٠١٢٣٤٥٦٧٨٩',persian='۰۱۲۳۴۵۶۷۸۹';
          return String(value==null?'':value).trim()
            .replace(/[٠-٩]/g,function(d){return String(arabic.indexOf(d));})
            .replace(/[۰-۹]/g,function(d){return String(persian.indexOf(d));})
            .replace(/[،,٫]/g,'.');
        }
        function numeric(control,fallback){
          var parsed=Number(normalizeNumericText(control&&control.value||fallback));
          return Number.isFinite(parsed)?parsed:fallback;
        }
        function clampSize(value){
          var parsed=Math.round(Number(value));
          if(!Number.isFinite(parsed))parsed=10;
          return Math.max(1,Math.min(20,parsed));
        }
        function selectedViewLabel(){return viewControl.options[viewControl.selectedIndex]?viewControl.options[viewControl.selectedIndex].textContent:'Circle of 36';}
        function selectedDataLabel(){return dataTypeControl.options[dataTypeControl.selectedIndex]?dataTypeControl.options[dataTypeControl.selectedIndex].textContent:'Price';}
        function buildRuntimeUrl(direction,nonce){
          var value=numeric(valueControl,0.01);
          var increment=numeric(incrementControl,1);
          var findText=normalizeNumericText(findControl&&findControl.value||'');
          if(increment===0)increment=1;
          return runtimeBase+'#view='+encodeURIComponent(viewControl.value||'circle36')+
            '&direction='+direction+
            '&dataType='+encodeURIComponent(dataTypeControl.value||'price')+
            '&value='+encodeURIComponent(value)+
            '&increment='+encodeURIComponent(increment)+
            '&find='+encodeURIComponent(findText)+
            '&highlight='+(highlightVisibleControl.checked?'1':'0')+
            '&highlightFill='+encodeURIComponent(String(highlightFillControl.value||'levels').toLowerCase())+
            '&highlightMarks='+(highlightMarksControl.checked?'1':'0')+
            '&highlightNumbers='+(highlightNumbersControl.checked?'1':'0')+
            '&nonce='+encodeURIComponent(nonce);
        }
        function applyDirection(){
          clockwiseWheel.classList.toggle('is-active',!!clockwiseControl.checked);
          counterclockwiseWheel.classList.toggle('is-active',!clockwiseControl.checked);
          setStatus('success',(clockwiseControl.checked?'مع عقارب الساعة':'عكس عقارب الساعة')+' • '+selectedViewLabel()+' • '+selectedDataLabel());
        }
        function applySize(){
          var size=clampSize(sizeControl.value),scale=size/10,inverse=100/scale;
          sizeControl.value=String(size);
          [clockwiseWheel,counterclockwiseWheel].forEach(function(frame){frame.style.width=inverse+'%';frame.style.height=inverse+'%';frame.style.transform='scale('+scale+')';});
          setStatus('success','Size = '+size+' • '+Math.round(scale*100)+'%');
        }
        function reloadWheels(){
          window.clearTimeout(reloadTimer);
          reloadNonce+=1;
          loadedCount=0;
          var value=numeric(valueControl,0.01),increment=numeric(incrementControl,1);
          if(increment===0){increment=1;incrementControl.value='1';}
          valueControl.value=String(value);
          incrementControl.value=String(increment);
          setStatus('loading','جارٍ تطبيق الأدوات…');
          var cwUrl=buildRuntimeUrl('cw',reloadNonce),ccwUrl=buildRuntimeUrl('ccw',reloadNonce);
          clockwiseWheel.src='about:blank';
          counterclockwiseWheel.src='about:blank';
          window.setTimeout(function(){clockwiseWheel.src=cwUrl;counterclockwiseWheel.src=ccwUrl;applyDirection();},20);
        }
        function scheduleReload(){window.clearTimeout(reloadTimer);reloadTimer=window.setTimeout(reloadWheels,280);}
        function onWheelLoad(frame){
          if(frame.getAttribute('src')==='about:blank')return;
          loadedCount+=1;
          if(loadedCount>=1){
            var highlightText=highlightVisibleControl.checked?'Highlight ON':'Highlight OFF';
            setStatus('success',highlightText+' • '+selectedViewLabel()+' • '+selectedDataLabel());
          }
        }

        if(wheelStack&&clockwiseWheel&&counterclockwiseWheel&&visibleControl&&clockwiseControl&&sizeControl&&viewControl&&dataTypeControl&&valueControl&&findControl&&incrementControl&&highlightVisibleControl&&highlightFillControl&&highlightMarksControl&&highlightNumbersControl){
          visibleControl.checked=true;
          clockwiseControl.checked=true;
          sizeControl.value='10';sizeControl.min='1';sizeControl.max='20';sizeControl.step='1';
          valueControl.value='0.01';valueControl.inputMode='decimal';
          findControl.value='0.01';findControl.inputMode='decimal';
          incrementControl.value='1';incrementControl.inputMode='decimal';incrementControl.step='any';incrementControl.setAttribute('step','any');
          highlightVisibleControl.checked=false;
          highlightMarksControl.checked=false;
          highlightNumbersControl.checked=false;
          fillSelect(viewControl,viewOptions,'circle36');
          fillSelect(dataTypeControl,dataTypeOptions,'price');
          highlightFillControl.innerHTML='<option value="levels">Levels</option>';
          highlightFillControl.value='levels';

          visibleControl.addEventListener('change',function(){wheelStack.style.visibility=visibleControl.checked?'visible':'hidden';setStatus('success',visibleControl.checked?'العجلة ظاهرة':'العجلة مخفية');});
          clockwiseControl.addEventListener('change',applyDirection);
          sizeControl.addEventListener('input',applySize);sizeControl.addEventListener('change',applySize);
          viewControl.addEventListener('change',reloadWheels);
          dataTypeControl.addEventListener('change',reloadWheels);
          valueControl.addEventListener('input',scheduleReload);
          valueControl.addEventListener('change',reloadWheels);
          findControl.addEventListener('input',scheduleReload);
          findControl.addEventListener('change',reloadWheels);
          incrementControl.addEventListener('input',scheduleReload);
          incrementControl.addEventListener('change',reloadWheels);
          [valueControl,findControl,incrementControl].forEach(function(control){control.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();reloadWheels();}});});
          highlightVisibleControl.addEventListener('change',reloadWheels);
          highlightFillControl.addEventListener('change',reloadWheels);
          highlightMarksControl.addEventListener('change',reloadWheels);
          highlightNumbersControl.addEventListener('change',reloadWheels);
          clockwiseWheel.addEventListener('load',function(){onWheelLoad(clockwiseWheel);});
          counterclockwiseWheel.addEventListener('load',function(){onWheelLoad(counterclockwiseWheel);});

          window.__auditKawkabatHighlightBindingV1=function(){return{ok:true,visible:highlightVisibleControl.checked,fill:highlightFillControl.value,marks:highlightMarksControl.checked,numbers:highlightNumbersControl.checked};};
          applySize();
          reloadWheels();
        }else{
          setStatus('error','تعذر تهيئة أدوات Highlight');
        }
      `;

      html=html.replace(marker,binding+marker);
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Highlight: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
