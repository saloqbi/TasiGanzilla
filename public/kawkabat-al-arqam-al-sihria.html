<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Gannzilla Tools V4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading Gannzilla tools V4…</div>
  <script>
  (async function(){
    'use strict';
    var approvedApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var fixedRef='c1828bc693cff5fd3ec48c000dd2df6ab51c4c1f';
    var wheelStaticUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/'+fixedRef+'/public/kawkabat-wheel-static-v1.html';
    var partsBase='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/'+fixedRef+'/public/gannzilla-tools-v2/';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '.panel-bottom{display:flex!important;align-items:center!important;padding:0 10px!important;font-size:12px!important;font-weight:800!important;color:#33444c!important;overflow:hidden!important;white-space:nowrap!important}'+
        '.panel-bottom::before{content:"";width:9px;height:9px;flex:0 0 9px;border-radius:50%;margin-right:7px;background:#d59a2f;box-shadow:0 0 0 2px rgba(213,154,47,.18)}'+
        '.panel-bottom[data-status="ready"]::before{background:#3fa35b;box-shadow:0 0 0 2px rgba(63,163,91,.18)}'+
        '.panel-bottom[data-status="error"]::before{background:#c84242;box-shadow:0 0 0 2px rgba(200,66,66,.18)}'+
        '.panel-action,.panel-info{cursor:pointer;user-select:none}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');

      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<iframe id="workFrame" class="work-frame" title="Magic Numbers Constellation" tabindex="0" src="about:blank"></iframe>'
      );

      var loader='<script id="gannzilla-tools-v4-loader">(async function(){'+
        'var bottom=document.querySelector(".panel-bottom");'+
        'var frame=document.getElementById("workFrame");'+
        'function status(text,kind){if(bottom){bottom.textContent=text;bottom.dataset.status=kind||"waiting";}}'+
        'status("Loading static wheel and tools V4…","waiting");'+
        'try{'+
          'var names=["part-01.js","part-02.js","part-03.js","part-04.js"];'+
          'var all=await Promise.all(['+
            'fetch("'+wheelStaticUrl+'",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("STATIC_WHEEL_HTTP_"+r.status);return r.text();}),' +
            'Promise.all(names.map(function(name){return fetch("'+partsBase+'"+name,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("ENGINE_PART_HTTP_"+r.status+"_"+name);return r.text();});}))'+
          ']);'+
          'var wheelHtml=all[0],code=all[1].join("");'+
          'try{new Function(code);}catch(parseError){throw new Error("ENGINE_PARSE_"+parseError.message);}'+
          'frame.addEventListener("load",function(){'+
            'try{var d=frame.contentDocument;if(!d||!d.getElementById("wheel")){status("Static wheel loaded without #wheel","error");return;}status("Wheel SVG loaded • connecting tools…","waiting");}catch(e){status("Wheel access error: "+String(e.message||e),"error");}'+
          '},{once:true});'+
          'frame.srcdoc=wheelHtml;'+
          'var script=document.createElement("script");'+
          'script.id="gannzilla-tools-engine-v4";'+
          'script.textContent=code;'+
          'document.body.appendChild(script);'+
          'setTimeout(function(){'+
            'try{var audit=window.__auditKawkabatGannzillaToolsV2&&window.__auditKawkabatGannzillaToolsV2();'+
            'if(!audit)status("Engine did not start","error");'+
            'else if(!audit.wheelConnected)status("Engine started • wheel not connected","error");'+
            'else if(audit.counterNumbers!==36)status("Connected • counter numbers "+audit.counterNumbers,"error");'+
            'else status("Connected • Wheel 3 • 36 numbers","ready");'+
            '}catch(e){status("Audit error: "+String(e.message||e),"error");}'+
          '},4000);'+
        '}catch(error){status("Tools failed: "+String(error.message||error),"error");}'+
      '}());'+closeTag;

      html=html.replace('</body>',loader+'</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
