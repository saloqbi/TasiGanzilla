<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Highlight Cross V2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل Highlight Cross…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/b9a49673eda7a46429797cc1c8ccd9810d7c3909/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/9e26516c5ae03114c9325ffcab86a6c42161a968/public/kawkabat-wheel-runtime-highlight-v1.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/2333b246c24e560c960661a001c3f9380c3dcaf6/public/kawkabat-wheel-runtime-highlight-v2.html';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('HIGHLIGHT_SOURCE_HTTP_'+response.status);
      var source=await response.text();

      source=source.replace('Magic Numbers Constellation — Highlight Active V1','Magic Numbers Constellation — Highlight Cross V2');
      source=source.replace(oldRuntime,newRuntime);
      source=source.replace(
        "highlightFillControl.innerHTML='<option value=\"levels\">Levels</option>';",
        "highlightFillControl.innerHTML='<option value=\"levels\">Levels</option><option value=\"cross\">Cross</option>';"
      );

      if(source.indexOf(newRuntime)<0)throw new Error('CROSS_RUNTIME_LINK_FAILED');
      if(source.indexOf('<option value="cross">Cross</option>')<0)throw new Error('CROSS_OPTION_PATCH_FAILED');

      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Highlight Cross: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
