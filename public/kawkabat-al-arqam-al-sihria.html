<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — New View Work V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading new View work…</div>
  <script>
  (async function(){
    'use strict';

    var newWorkApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/8aae0ce45c2e18b510841acef41154b6c150d9d0';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/112477f023dfe9b8e66f0b49f5a27a507cd46a7e/public/kawkabat-wheel-view-runtime.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/b514e2bb17b5792eb62bf982b118dbae76afc4bb/public/kawkabat-wheel-view-runtime-v3.html';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(newWorkApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('NEW_WORK_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);

      html=html.replace('Clockwise, Size and View','Clockwise, Size and View V3');
      html=html.replace(oldRuntime,newRuntime);

      var reloadPattern=/clockwiseWheel\.src=buildViewUrl\('cw'\);\s*counterclockwiseWheel\.src=buildViewUrl\('ccw'\);\s*applyWheelDirection\(\);/;
      var reloadCode=
        "var nextClockwiseUrl=buildViewUrl('cw');\n"+
        "          var nextCounterclockwiseUrl=buildViewUrl('ccw');\n"+
        "          clockwiseWheel.src='about:blank';\n"+
        "          counterclockwiseWheel.src='about:blank';\n"+
        "          window.setTimeout(function(){\n"+
        "            clockwiseWheel.src=nextClockwiseUrl;\n"+
        "            counterclockwiseWheel.src=nextCounterclockwiseUrl;\n"+
        "            applyWheelDirection();\n"+
        "          },0);";
      html=html.replace(reloadPattern,reloadCode);

      if(html.indexOf(newRuntime)<0)throw new Error('VIEW_V3_RUNTIME_LINK_FAILED');
      if(html.indexOf(oldRuntime)>=0)throw new Error('OLD_VIEW_RUNTIME_STILL_PRESENT');
      if(html.indexOf("clockwiseWheel.src='about:blank'")<0)throw new Error('VIEW_FORCE_RELOAD_PATCH_FAILED');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load new View work: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
