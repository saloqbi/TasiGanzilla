<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Clockwise, Size and View</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading approved structure…</div>
  <script>
  (async function(){
    'use strict';

    var approvedApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var runtimeUrl='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/112477f023dfe9b8e66f0b49f5a27a507cd46a7e/public/kawkabat-wheel-view-runtime.html';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);

      var payload=await response.json();
      var html=decodeBase64(payload.content);

      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important;background:#F7F1E3!important}'+
        '.wheel-stack{position:fixed!important}'+
        '.wheel-layer{position:absolute!important;top:0!important;left:0!important;border:0!important;background:#F7F1E3!important;visibility:hidden!important;pointer-events:none!important;transform-origin:0 0!important}'+
        '.wheel-layer.is-active{visibility:visible!important;pointer-events:auto!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '.panel-bottom{display:flex!important;align-items:center!important;padding:0 10px!important;font-size:12px!important;font-weight:800!important;color:#33444c!important}'+
        '.panel-bottom::before{content:"";width:9px;height:9px;border-radius:50%;margin-right:7px;background:#d3a80b}'+
        '.panel-bottom[data-status="success"]::before{background:#31a354}'+
        '.panel-bottom[data-status="error"]::before{background:#c93d3d}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');

      html=html.replace(
        /<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<div id="workFrame" class="work-frame wheel-stack" role="region" aria-label="Magic Numbers Constellation">'+
          '<iframe id="clockwiseWheel" class="wheel-layer is-active" title="Clockwise wheel" scrolling="yes" loading="eager"></iframe>'+
          '<iframe id="counterclockwiseWheel" class="wheel-layer" title="Counterclockwise wheel" scrolling="yes" loading="eager"></iframe>'+
        '</div>'
      );

      var marker='requestAnimationFrame(updateThumb);';
      if(html.indexOf(marker)<0)throw new Error('PANEL_RUNTIME_MARKER_NOT_FOUND');

      var binding=`
        var wheelStack=document.getElementById('workFrame');
        var clockwiseWheel=document.getElementById('clockwiseWheel');
        var counterclockwiseWheel=document.getElementById('counterclockwiseWheel');
        var clockwiseControl=document.querySelector('[aria-label="Layout clockwise"]');
        var visibleControl=document.querySelector('[aria-label="Layout visible"]');
        var sizeControl=document.querySelector('[aria-label="Size"]');
        var viewControl=document.querySelector('[aria-label="View"]');
        var panelStatus=document.querySelector('.panel-bottom');
        var runtimeBase=${JSON.stringify(runtimeUrl)};
        var viewOptions=[
          {value:'permanentSquare',label:'Permanent square'},
          {value:'circle12',label:'Circle of 12'},
          {value:'circle24',label:'Circle of 24'},
          {value:'circle36',label:'Circle of 36'},
          {value:'square4',label:'Square of 4'},
          {value:'square9',label:'Square of 9'},
          {value:'tetragon',label:'Tetragon'}
        ];

        function setWheelStatus(mode,message){
          if(!panelStatus)return;
          panelStatus.setAttribute('data-status',mode);
          panelStatus.textContent=message;
        }

        function clampWheelSize(value){
          var parsed=Math.round(Number(value));
          if(!Number.isFinite(parsed))parsed=10;
          return Math.max(1,Math.min(20,parsed));
        }

        function selectedViewLabel(){
          return viewControl&&viewControl.options[viewControl.selectedIndex]?viewControl.options[viewControl.selectedIndex].textContent:'Circle of 36';
        }

        function buildViewUrl(direction){
          var view=viewControl&&viewControl.value?viewControl.value:'circle36';
          return runtimeBase+'#view='+encodeURIComponent(view)+'&direction='+direction;
        }

        function populateViewOptions(){
          if(!viewControl)return;
          viewControl.innerHTML='';
          viewOptions.forEach(function(item){
            var option=document.createElement('option');
            option.value=item.value;
            option.textContent=item.label;
            viewControl.appendChild(option);
          });
          viewControl.value='circle36';
        }

        function applyWheelDirection(){
          if(!clockwiseWheel||!counterclockwiseWheel||!clockwiseControl)return;
          clockwiseWheel.classList.toggle('is-active',!!clockwiseControl.checked);
          counterclockwiseWheel.classList.toggle('is-active',!clockwiseControl.checked);
          setWheelStatus('success',(clockwiseControl.checked?'مع عقارب الساعة':'عكس عقارب الساعة')+' • '+selectedViewLabel());
        }

        function loadSelectedView(){
          if(!clockwiseWheel||!counterclockwiseWheel||!viewControl)return;
          setWheelStatus('success','View = '+selectedViewLabel());
          clockwiseWheel.src=buildViewUrl('cw');
          counterclockwiseWheel.src=buildViewUrl('ccw');
          applyWheelDirection();
        }

        function applyWheelSize(){
          if(!clockwiseWheel||!counterclockwiseWheel||!sizeControl)return;
          var size=clampWheelSize(sizeControl.value);
          var scale=size/10;
          var inverse=100/scale;
          sizeControl.value=String(size);
          [clockwiseWheel,counterclockwiseWheel].forEach(function(frame){
            frame.style.width=inverse+'%';
            frame.style.height=inverse+'%';
            frame.style.transform='scale('+scale+')';
          });
          setWheelStatus('success','Size = '+size+' • '+Math.round(scale*100)+'% • '+selectedViewLabel());
        }

        if(wheelStack&&clockwiseWheel&&counterclockwiseWheel&&clockwiseControl&&visibleControl&&sizeControl&&viewControl){
          clockwiseControl.checked=true;
          visibleControl.checked=true;
          sizeControl.value='10';
          sizeControl.min='1';
          sizeControl.max='20';
          sizeControl.step='1';
          populateViewOptions();

          clockwiseControl.addEventListener('change',applyWheelDirection);
          visibleControl.addEventListener('change',function(){
            wheelStack.style.visibility=visibleControl.checked?'visible':'hidden';
            setWheelStatus('success',visibleControl.checked?'العجلة ظاهرة':'العجلة مخفية');
          });
          sizeControl.addEventListener('input',applyWheelSize);
          sizeControl.addEventListener('change',applyWheelSize);
          sizeControl.addEventListener('keydown',function(event){
            if(event.key==='Enter'){
              event.preventDefault();
              applyWheelSize();
            }
          });
          viewControl.addEventListener('change',loadSelectedView);

          applyWheelSize();
          loadSelectedView();
        }else{
          setWheelStatus('error','تعذر تهيئة Clockwise أو Size أو View');
        }
      `;

      html=html.replace(marker,binding+marker);
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
