<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — Decimal Cycles V2</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}body{display:grid;place-items:center;color:#43515a}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">جارٍ تحميل كوكبة الأرقام بالدورات الصحيحة…</div>
  <script>
  (async function(){
    'use strict';
    var baselineUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/a99cfc66117a93c6f1af5e3c143d8286fa0cd397/public/kawkabat-al-arqam-al-sihria.html';
    var oldRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';
    var newRuntime='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/e954600776e96d05dff3516c5fd4c9f01e382a2a/public/kawkabat-wheel-runtime-decimal-cycles-v1.html';
    try{
      var response=await fetch(baselineUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('BASELINE_HTTP_'+response.status);
      var html=await response.text();
      if(html.indexOf(oldRuntime)<0)throw new Error('BASELINE_RUNTIME_REFERENCE_NOT_FOUND');
      html=html.split(oldRuntime).join(newRuntime);
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل العمل: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
