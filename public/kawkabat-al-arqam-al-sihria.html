<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كود أول عجلة اللوجو بتنظيم</title>
  <style>
    :root { background: #F7F1E3; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F1E3;
    }
    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }
    svg {
      display: block;
      width: min(94vw, 900px);
      height: min(94vh, 900px);
      filter: drop-shadow(0 7px 14px rgba(35, 57, 68, .24));
    }
    .ray-shadow {
      stroke: #263943;
      stroke-width: 4.4;
      stroke-linecap: round;
      opacity: .88;
      vector-effect: non-scaling-stroke;
    }
    .ray-metal {
      stroke: url(#blueSteelStroke);
      stroke-width: 2.7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .ray-highlight {
      stroke: url(#blueSteelHighlight);
      stroke-width: .85;
      stroke-linecap: round;
      opacity: .98;
      vector-effect: non-scaling-stroke;
    }
    .copper-ray-shadow {
      stroke: #5C4032;
      stroke-width: 5.2;
      stroke-linecap: round;
      opacity: .92;
      vector-effect: non-scaling-stroke;
    }
    .copper-ray-metal {
      stroke: url(#roseCopperStroke);
      stroke-width: 3.35;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .copper-ray-highlight {
      stroke: url(#roseCopperHighlight);
      stroke-width: 1.05;
      stroke-linecap: round;
      opacity: .98;
      vector-effect: non-scaling-stroke;
    }
    .frame-shadow {
      fill: none;
      stroke: #263943;
      stroke-width: 7.4;
      opacity: .82;
      vector-effect: non-scaling-stroke;
    }
    .frame-metal {
      fill: none;
      stroke: url(#blueSteelStroke);
      stroke-width: 5.2;
      vector-effect: non-scaling-stroke;
    }
    .frame-highlight {
      fill: none;
      stroke: url(#blueSteelHighlight);
      stroke-width: 1.5;
      opacity: .96;
      vector-effect: non-scaling-stroke;
    }
    .special-cell-fill {
      fill: url(#roseCopperCell);
      stroke: none;
      opacity: .38;
    }
    .copper-arc-shadow {
      fill: none;
      stroke: #5C4032;
      stroke-width: 6.2;
      opacity: .90;
      vector-effect: non-scaling-stroke;
    }
    .copper-arc-metal {
      fill: none;
      stroke: url(#roseCopperStroke);
      stroke-width: 4.1;
      vector-effect: non-scaling-stroke;
    }
    .copper-arc-highlight {
      fill: none;
      stroke: url(#roseCopperHighlight);
      stroke-width: 1.15;
      opacity: .98;
      vector-effect: non-scaling-stroke;
    }
    .number-text {
      font-family: Arial, Tahoma, sans-serif;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
      dominant-baseline: central;
      direction: ltr;
      unicode-bidi: bidi-override;
      paint-order: stroke fill;
      stroke: #E7CB84;
      stroke-width: 1.05;
      stroke-opacity: .72;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.82));
    }
    .ring-one-number { font-size: 24px; }
    .ring-two-number { font-size: 29px; }
    .cardinal-number { font-weight: 900; }
    .number-red { fill: #B21F2D; }
    .number-blue { fill: #174B98; }
    .number-black { fill: #17191B; }
    #logoImage {
      opacity: 0;
      transition: opacity .18s linear;
    }
    html[data-logo-ready="true"] #logoImage { opacity: 1; }
  </style>
</head>
<body>
  <svg id="wheel" viewBox="0 0 1000 1000" role="img" aria-label="كود أول عجلة اللوجو بتنظيم">
    <defs>
      <clipPath id="logoClip">
        <circle cx="500" cy="500" r="179" />
      </clipPath>

      <linearGradient id="blueSteelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#20333D" />
        <stop offset="18%" stop-color="#6F8793" />
        <stop offset="36%" stop-color="#DDE8EC" />
        <stop offset="50%" stop-color="#8AA0AA" />
        <stop offset="68%" stop-color="#4D6875" />
        <stop offset="84%" stop-color="#B9D4DE" />
        <stop offset="100%" stop-color="#263B46" />
      </linearGradient>

      <linearGradient id="blueSteelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F1FBFF" />
        <stop offset="42%" stop-color="#9AD7ED" />
        <stop offset="100%" stop-color="#557685" />
      </linearGradient>

      <linearGradient id="roseCopperCell" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8C6247" />
        <stop offset="18%" stop-color="#B98B68" />
        <stop offset="42%" stop-color="#E6D1C2" />
        <stop offset="58%" stop-color="#D7C3B3" />
        <stop offset="82%" stop-color="#B98B68" />
        <stop offset="100%" stop-color="#5C4032" />
      </linearGradient>

      <linearGradient id="roseCopperStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5C4032" />
        <stop offset="18%" stop-color="#8C6247" />
        <stop offset="38%" stop-color="#B98B68" />
        <stop offset="50%" stop-color="#E6D1C2" />
        <stop offset="66%" stop-color="#D7C3B3" />
        <stop offset="84%" stop-color="#B98B68" />
        <stop offset="100%" stop-color="#5C4032" />
      </linearGradient>

      <linearGradient id="roseCopperHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E6D1C2" />
        <stop offset="45%" stop-color="#D7C3B3" />
        <stop offset="100%" stop-color="#8C6247" />
      </linearGradient>
    </defs>

    <g id="specialCellFills"></g>
    <g id="divisions"></g>

    <image
      id="logoImage"
      x="321"
      y="321"
      width="358"
      height="358"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#logoClip)"
    />

    <circle class="frame-shadow" cx="500" cy="500" r="180" />
    <circle class="frame-metal" cx="500" cy="500" r="180" />
    <circle class="frame-highlight" cx="500" cy="500" r="174" />

    <circle class="frame-shadow" cx="500" cy="500" r="290" />
    <circle class="frame-metal" cx="500" cy="500" r="290" />
    <circle class="frame-highlight" cx="500" cy="500" r="284" />

    <circle class="frame-shadow" cx="500" cy="500" r="400" />
    <circle class="frame-metal" cx="500" cy="500" r="400" />
    <circle class="frame-highlight" cx="500" cy="500" r="394" />

    <g id="specialCellArcs"></g>
    <g id="numbersRingOne" aria-label="تسلسل الأرقام من 1 إلى 36"></g>
    <g id="numbersRingTwo" aria-label="تسلسل الاختزال الرقمي من 1 إلى 9"></g>
  </svg>

  <script>
    (function () {
      'use strict';

      var SVG_NS = 'http://www.w3.org/2000/svg';
      var XLINK_NS = 'http://www.w3.org/1999/xlink';
      var divisions = document.getElementById('divisions');
      var specialCellFills = document.getElementById('specialCellFills');
      var specialCellArcs = document.getElementById('specialCellArcs');
      var numbersRingOne = document.getElementById('numbersRingOne');
      var numbersRingTwo = document.getElementById('numbersRingTwo');
      var logoImage = document.getElementById('logoImage');
      var cx = 500;
      var cy = 500;
      var innerRadius = 180;
      var middleRadius = 290;
      var outerRadius = 400;
      var ringOneTextRadius = (innerRadius + middleRadius) / 2;
      var ringTwoTextRadius = (middleRadius + outerRadius) / 2;
      var cardinalCellIndices = [0, 9, 18, 27];
      var copperBoundaryIndices = {
        0: true, 1: true,
        9: true, 10: true,
        18: true, 19: true,
        27: true, 28: true
      };

      function polar(radius, degrees) {
        var radians = degrees * Math.PI / 180;
        return {
          x: cx + Math.cos(radians) * radius,
          y: cy + Math.sin(radians) * radius
        };
      }

      function appendLine(group, className, x1, y1, x2, y2) {
        var line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', String(x1));
        line.setAttribute('y1', String(y1));
        line.setAttribute('x2', String(x2));
        line.setAttribute('y2', String(y2));
        line.setAttribute('class', className);
        group.appendChild(line);
      }

      function annularSectorPath(inner, outer, startDeg, endDeg) {
        var outerStart = polar(outer, startDeg);
        var outerEnd = polar(outer, endDeg);
        var innerEnd = polar(inner, endDeg);
        var innerStart = polar(inner, startDeg);
        return [
          'M', outerStart.x, outerStart.y,
          'A', outer, outer, 0, 0, 1, outerEnd.x, outerEnd.y,
          'L', innerEnd.x, innerEnd.y,
          'A', inner, inner, 0, 0, 0, innerStart.x, innerStart.y,
          'Z'
        ].join(' ');
      }

      function arcPath(radius, startDeg, endDeg) {
        var start = polar(radius, startDeg);
        var end = polar(radius, endDeg);
        return ['M', start.x, start.y, 'A', radius, radius, 0, 0, 1, end.x, end.y].join(' ');
      }

      function appendPath(group, className, d) {
        var path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', className);
        group.appendChild(path);
      }

      function appendCopperArc(radius, startDeg, endDeg) {
        var d = arcPath(radius, startDeg, endDeg);
        appendPath(specialCellArcs, 'copper-arc-shadow', d);
        appendPath(specialCellArcs, 'copper-arc-metal', d);
        appendPath(specialCellArcs, 'copper-arc-highlight', d);
      }

      function numberColorClass(value) {
        var remainder = value % 3;
        if (remainder === 1) return 'number-red';
        if (remainder === 2) return 'number-blue';
        return 'number-black';
      }

      function appendNumber(group, value, angle, radius, ringClass, isCardinal) {
        var text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', String(cx + Math.cos(angle) * radius));
        text.setAttribute('y', String(cy + Math.sin(angle) * radius));
        text.setAttribute(
          'class',
          'number-text ' + ringClass + ' ' + numberColorClass(value) + (isCardinal ? ' cardinal-number' : '')
        );
        text.textContent = String(value);
        group.appendChild(text);
      }

      cardinalCellIndices.forEach(function (index) {
        var startDeg = (index * 10) - 95;
        var endDeg = (index * 10) - 85;

        appendPath(
          specialCellFills,
          'special-cell-fill',
          annularSectorPath(innerRadius, middleRadius, startDeg, endDeg)
        );
        appendPath(
          specialCellFills,
          'special-cell-fill',
          annularSectorPath(middleRadius, outerRadius, startDeg, endDeg)
        );

        appendCopperArc(innerRadius, startDeg, endDeg);
        appendCopperArc(middleRadius, startDeg, endDeg);
        appendCopperArc(outerRadius, startDeg, endDeg);
      });

      for (var i = 0; i < 36; i += 1) {
        var boundaryAngle = ((i * 10) - 95) * Math.PI / 180;
        var centerAngle = ((i * 10) - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(boundaryAngle) * innerRadius;
        var y1 = cy + Math.sin(boundaryAngle) * innerRadius;
        var x2 = cx + Math.cos(boundaryAngle) * outerRadius;
        var y2 = cy + Math.sin(boundaryAngle) * outerRadius;
        var rayGroup = document.createElementNS(SVG_NS, 'g');
        var isCopperBoundary = Boolean(copperBoundaryIndices[i]);
        rayGroup.setAttribute('class', isCopperBoundary ? 'ray copper-ray' : 'ray');
        rayGroup.setAttribute('data-ray-index', String(i));
        rayGroup.setAttribute('data-copper-boundary', String(isCopperBoundary));

        if (isCopperBoundary) {
          appendLine(rayGroup, 'copper-ray-shadow', x1, y1, x2, y2);
          appendLine(rayGroup, 'copper-ray-metal', x1, y1, x2, y2);
          appendLine(rayGroup, 'copper-ray-highlight', x1, y1, x2, y2);
        } else {
          appendLine(rayGroup, 'ray-shadow', x1, y1, x2, y2);
          appendLine(rayGroup, 'ray-metal', x1, y1, x2, y2);
          appendLine(rayGroup, 'ray-highlight', x1, y1, x2, y2);
        }
        divisions.appendChild(rayGroup);

        var fullValue = i === 0 ? 36 : i;
        var digitalRootValue = i % 9 === 0 ? 9 : i % 9;
        var isCardinalCell = i % 9 === 0;
        appendNumber(numbersRingOne, fullValue, centerAngle, ringOneTextRadius, 'ring-one-number', isCardinalCell);
        appendNumber(numbersRingTwo, digitalRootValue, centerAngle, ringTwoTextRadius, 'ring-two-number', isCardinalCell);
      }

      var chunkBase = 'https://raw.githubusercontent.com/saloqbi/TasiGanzilla/main/public/kawkabat-logo-v1/chunk-';
      var chunkUrls = [0, 1, 2, 3, 4].map(function (index) {
        return chunkBase + index + '.txt';
      });

      Promise.all(chunkUrls.map(function (url) {
        return fetch(url, { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('LOGO_CHUNK_HTTP_' + response.status);
          return response.text();
        });
      })).then(function (chunks) {
        var source = 'data:image/webp;base64,' + chunks.join('').trim();
        logoImage.setAttribute('href', source);
        logoImage.setAttributeNS(XLINK_NS, 'href', source);
        document.documentElement.dataset.logoReady = 'true';
      }).catch(function () {
        document.documentElement.dataset.logoReady = 'false';
      });

      window.__auditKawkabatLogoWheelV10 = function () {
        return {
          ok: divisions.children.length === 36 && numbersRingOne.children.length === 36 && numbersRingTwo.children.length === 36,
          build: 10,
          name: 'كود أول عجلة اللوجو بتنظيم',
          baseFrameColor: 'glossy-blue-steel',
          specialColor: 'exact-satin-rose-bronze',
          specialPalette: ['#E6D1C2', '#D7C3B3', '#B98B68', '#8C6247', '#5C4032'],
          highlightedPairs: ['36/9', '9/9', '18/9', '27/9'],
          highlightedCellCount: 8,
          copperBoundaryRayCount: 8,
          copperArcCount: 36,
          cell28Highlighted: false,
          ringOneFontSize: 24,
          ringTwoFontSize: 29,
          background: '#F7F1E3',
          logoReady: document.documentElement.dataset.logoReady === 'true'
        };
      };
    }());
  </script>
</body>
</html>
