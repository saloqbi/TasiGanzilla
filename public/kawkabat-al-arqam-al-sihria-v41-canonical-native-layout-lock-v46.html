<style>

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#f7f1e3;
}
#nativeStage{
  position:absolute;
  left:0;
  top:0;
  width:3200px;
  height:1550px;
  overflow:hidden;
  transform-origin:0 0;
  background:#f7f1e3;
  will-change:transform;
}
#canonicalFrame{
  display:block;
  width:3200px;
  height:1550px;
  margin:0;
  padding:0;
  border:0;
  background:#f7f1e3;
}

</head>
<body>
<div id="viewport">
  <div id="nativeStage">
    <iframe
      id="canonicalFrame"
      title="Magic Numbers Constellation V41 Canonical Native Layout"
      src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/05f68f1bb9eda171517c7180ba659ba89b6200e1/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornate-frame-angle-ticks-inner-copper-boundary-v41.html">
    </iframe>
  </div>
</div>
<script>
(function(){
'use strict';
var REFERENCE_WIDTH=3200;
var REFERENCE_HEIGHT=1550;
var viewport=document.getElementById('viewport');
var stage=document.getElementById('nativeStage');
var frame=document.getElementById('canonicalFrame');
var lastSignature='';

function lockNativeLayout(){
  var width=Math.max(1,viewport.clientWidth||window.innerWidth||REFERENCE_WIDTH);
  var height=Math.max(1,viewport.clientHeight||window.innerHeight||REFERENCE_HEIGHT);
  var scale=Math.min(width/REFERENCE_WIDTH,height/REFERENCE_HEIGHT);
  var renderedWidth=REFERENCE_WIDTH*scale;
  var renderedHeight=REFERENCE_HEIGHT*scale;
  var left=(width-renderedWidth)/2;
  var top=(height-renderedHeight)/2;
  var signature=[width,height,scale,left,top].join('|');
  if(signature===lastSignature)return;
  lastSignature=signature;
  stage.style.transform='translate('+left.toFixed(3)+'px,'+top.toFixed(3)+'px) scale('+scale.toFixed(10)+')';
  document.documentElement.dataset.v46NativeLayoutLocked='true';
  document.documentElement.dataset.v46ReferenceViewport=REFERENCE_WIDTH+'x'+REFERENCE_HEIGHT;
  document.documentElement.dataset.v46Scale=scale.toFixed(10);
  document.documentElement.dataset.v46InternalDomTouched='false';
}

window.__auditKawkabatCanonicalNativeLayoutLockV46=function(){
  return{
    ok:!!viewport&&!!stage&&!!frame&&frame.getAttribute('src').indexOf('/05f68f1bb9eda171517c7180ba659ba89b6200e1/')!==-1,
    baseVersion:'V41',
    immutableBaseCommit:'05f68f1bb9eda171517c7180ba659ba89b6200e1',
    referenceViewport:{width:REFERENCE_WIDTH,height:REFERENCE_HEIGHT},
    scalingMode:'uniform-native-layout-stage-only',
    internalDomTouched:false,
    internalViewportFixed:true,
    wheelGeometryChanged:false,
    numberTextChanged:false,
    controlPanelChanged:false,
    responsiveReflowPrevented:true,
    laterModificationRule:'outer-overlay-only'
  };
};

window.addEventListener('resize',lockNativeLayout,{passive:true});
window.addEventListener('orientationchange',lockNativeLayout,{passive:true});
lockNativeLayout();
}());
</script>
</body>
</html>
