<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Protractor & Chronometer Runtime V4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العجلة…</div>
  <script>
  (async function(){
    'use strict';

    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';
    var overlaySourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/4ecd305b8597918c624068276dd46aa6b6ccc58a/public/kawkabat-protractor-chronometer-overlay-v2.js';

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('DIRECT_RUNTIME_HTTP_'+response.status);

      var source=await response.text();
      source=source.replace('Runtime مباشر','Protractor & Chronometer Runtime V4');

      var loaderCode="(function(){'use strict';var url="+JSON.stringify(overlaySourceUrl)+";var controller=window.AbortController?new AbortController():null;var timer=window.setTimeout(function(){if(controller)controller.abort();},8000);fetch(url,{cache:'no-store',signal:controller?controller.signal:undefined}).then(function(response){if(!response.ok)throw new Error('OVERLAY_SOURCE_HTTP_'+response.status);return response.text();}).then(function(code){window.clearTimeout(timer);var script=document.createElement('script');script.id='kawkabat-protractor-chronometer-v4';script.textContent=code;document.body.appendChild(script);document.documentElement.dataset.overlayReady='true';}).catch(function(error){window.clearTimeout(timer);document.documentElement.dataset.overlayReady='false';document.documentElement.dataset.overlayError=String(error&&error.message||error);});}());";

      var writeMarker="      document.open();document.write(html);document.close();";
      var patch=
        "      var overlayCloseTag='</scr'+'ipt>';\n"+
        "      var overlayLoader='<script id=\"kawkabat-overlay-loader-v4\">'+"+JSON.stringify(loaderCode)+"+overlayCloseTag;\n"+
        "      var bodyClose=html.lastIndexOf('</body>');\n"+
        "      if(bodyClose<0)throw new Error('OVERLAY_BODY_CLOSE_NOT_FOUND');\n"+
        "      html=html.slice(0,bodyClose)+overlayLoader+html.slice(bodyClose);\n";

      if(source.indexOf(writeMarker)<0)throw new Error('DIRECT_RUNTIME_WRITE_MARKER_NOT_FOUND');
      source=source.replace(writeMarker,patch+writeMarker);

      document.open();
      document.write(source);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل العجلة: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
