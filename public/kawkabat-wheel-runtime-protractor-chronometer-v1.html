<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Protractor & Chronometer Runtime V1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل المنقلة والكرونومتر…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';

    function integratedOverlayRuntime(){
      'use strict';
      var NS='http://www.w3.org/2000/svg';
      var cx=2200,cy=1800;
      var params=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
      var wheel=document.getElementById('wheel');
      var angleFrame=document.getElementById('angleFrame');
      if(!wheel||!angleFrame)return;

      function bool(name,defaultValue){
        var value=params.get(name);
        if(value===null)return !!defaultValue;
        return value==='1'||value==='true'||value==='on';
      }
      function num(name,defaultValue){
        var value=Number(String(params.get(name)==null?defaultValue:params.get(name)).replace(',','.'));
        return Number.isFinite(value)?value:defaultValue;
      }
      function text(name,defaultValue){var value=params.get(name);return value===null?defaultValue:String(value);}
      function make(name,attrs){
        var node=document.createElementNS(NS,name);
        Object.keys(attrs||{}).forEach(function(key){node.setAttribute(key,String(attrs[key]));});
        return node;
      }
      function polar(radius,degree){var a=degree*Math.PI/180;return{x:cx+Math.cos(a)*radius,y:cy+Math.sin(a)*radius};}
      function normalize(degree){var d=degree%360;return d<0?d+360:d;}
      function remove(id){var old=document.getElementById(id);if(old)old.remove();}
      function layer(id,label,before){
        remove(id);
        var group=make('g',{id:id,'aria-label':label,'pointer-events':'none'});
        wheel.insertBefore(group,before||angleFrame);
        return group;
      }
      function addCircle(group,radius,stroke,width,opacity,dash){
        var node=make('circle',{cx:cx,cy:cy,r:radius,fill:'none',stroke:stroke,'stroke-width':width,'stroke-opacity':opacity,'vector-effect':'non-scaling-stroke'});
        if(dash)node.setAttribute('stroke-dasharray',dash);
        group.appendChild(node);return node;
      }
      function addLine(group,x1,y1,x2,y2,stroke,width,opacity,dash){
        var node=make('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke,'stroke-width':width,'stroke-opacity':opacity,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'});
        if(dash)node.setAttribute('stroke-dasharray',dash);
        group.appendChild(node);return node;
      }
      function addText(group,value,radius,degree,size,fill,weight){
        var p=polar(radius,degree),rotation=normalize(degree+90);
        if(rotation>90&&rotation<270)rotation+=180;
        var node=make('text',{x:p.x,y:p.y,'text-anchor':'middle','dominant-baseline':'central','font-family':'Arial,Tahoma,sans-serif','font-size':size,'font-weight':weight||800,fill:fill||'#17191B',transform:'rotate('+rotation+' '+p.x+' '+p.y+')','paint-order':'stroke fill',stroke:'#F7F1E3','stroke-width':'1.2','stroke-opacity':'0.9','vector-effect':'non-scaling-stroke'});
        node.textContent=value;group.appendChild(node);return node;
      }
      function addTriangle(group,radius,degree,color,size,label){
        var p=polar(radius,degree),a=degree*Math.PI/180,tx=-Math.sin(a),ty=Math.cos(a),nx=Math.cos(a),ny=Math.sin(a);
        var tip={x:p.x+nx*size,y:p.y+ny*size};
        var b1={x:p.x-tx*size*.62,y:p.y-ty*size*.62};
        var b2={x:p.x+tx*size*.62,y:p.y+ty*size*.62};
        var node=make('path',{d:'M '+tip.x+' '+tip.y+' L '+b1.x+' '+b1.y+' L '+b2.x+' '+b2.y+' Z',fill:color,stroke:'#2B1608','stroke-width':'2.5','vector-effect':'non-scaling-stroke'});
        node.style.filter='drop-shadow(0 0 6px rgba(0,0,0,.38))';group.appendChild(node);
        if(label)addText(group,label,radius+size+18,degree,18,color,900);
      }
      function polygonPath(radius){
        var points=[];for(var i=0;i<4;i+=1){var p=polar(radius,-45+i*90);points.push((i?'L ':'M ')+p.x+' '+p.y);}return points.join(' ')+' Z';
      }
      function formatDecimal(value){
        var fixed=Number(value).toFixed(8).replace(/\.?0+$/,'');return fixed==='-0'?'0':fixed;
      }

      /* Find */
      var rawFind=String(params.get('find')||'').trim().replace(',','.');
      var findValue=Number(rawFind),hasFind=rawFind!==''&&Number.isFinite(findValue),found=null;
      if(hasFind){
        var candidates=wheel.querySelectorAll('[data-price-value]');
        Array.prototype.some.call(candidates,function(node){
          var value=Number(node.getAttribute('data-price-value'));
          if(Number.isFinite(value)&&Math.abs(value-findValue)<=Math.max(1e-9,Math.abs(findValue)*1e-10)){found=node;return true;}
          return false;
        });
      }
      document.documentElement.dataset.findRequested=hasFind?'true':'false';
      document.documentElement.dataset.findFound=found?'true':'false';
      if(found){
        var findLayer=layer('findHighlightLayer','Find highlight '+rawFind);
        var box=found.getBBox();
        var rect=make('rect',{x:box.x-14,y:box.y-10,width:box.width+28,height:box.height+20,rx:Math.max(10,(box.height+20)/2),fill:'#FFD86A','fill-opacity':'0.24',stroke:'#B87900','stroke-width':'4','vector-effect':'non-scaling-stroke'});
        rect.style.filter='drop-shadow(0 0 8px rgba(255,190,0,.9))';findLayer.appendChild(rect);
        window.setTimeout(function(){var r=found.getBoundingClientRect(),root=document.scrollingElement||document.documentElement;root.scrollLeft+=r.left+r.width/2-window.innerWidth/2;root.scrollTop+=r.top+r.height/2-window.innerHeight/2;},180);
      }

      /* Highlight */
      var highlightVisible=bool('highlight',false),highlightFill=text('highlightFill','levels').toLowerCase(),highlightMarks=bool('highlightMarks',false),highlightNumbers=bool('highlightNumbers',false);
      var view=text('view','circle36'),squareMode=view==='square4'||view==='square9'||view==='permanentSquare'||view==='tetragon';
      var divisionCount=view==='circle12'?12:view==='circle24'?24:(view==='square4'||view==='tetragon'?4:(view==='square9'||view==='permanentSquare'?9:36));
      var startValue=num('value',0.01),increment=num('increment',1);if(increment===0)increment=1;
      if(highlightVisible){
        var highlightLayer=layer('highlightLayer','Highlight '+highlightFill,document.getElementById('numbersCycle1')||angleFrame);
        if(highlightFill==='cross'){
          addLine(highlightLayer,590,cy,3810,cy,'#D49A32',104,.13);
          addLine(highlightLayer,cx,190,cx,3410,'#4E8EAE',104,.11);
          addLine(highlightLayer,590,cy,3810,cy,'#FFF1C0',3,.52);
          addLine(highlightLayer,cx,190,cx,3410,'#E9F7FF',3,.52);
          [{d:-90,l:'0°'},{d:0,l:'90°'},{d:90,l:'180°'},{d:180,l:'270°'}].forEach(function(item){
            var p=polar(1580,item.d);
            if(highlightMarks){var m=make('circle',{cx:p.x,cy:p.y,r:10,fill:'#FFD86A',stroke:'#8A5A00','stroke-width':3,'vector-effect':'non-scaling-stroke'});highlightLayer.appendChild(m);}
            if(highlightNumbers)addText(highlightLayer,item.l,1542,item.d,18,'#17191B',900);
          });
        }else{
          for(var level=1;level<=10;level+=1){
            var radius=455+(level-1)*110,color=level%2?'#E0B044':'#4E8EAE';
            if(squareMode){var path=make('path',{d:polygonPath(radius),fill:'none',stroke:color,'stroke-width':94,'stroke-opacity':level%2?.11:.075,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'});highlightLayer.appendChild(path);}else addCircle(highlightLayer,radius,color,94,level%2?.11:.075);
            var point=polar(radius,-90);
            if(highlightMarks){var mark=make('circle',{cx:point.x,cy:point.y,r:10,fill:'#FFD86A',stroke:'#8A5A00','stroke-width':3,'vector-effect':'non-scaling-stroke'});highlightLayer.appendChild(mark);}
            if(highlightNumbers){var endOrdinal=level*divisionCount,endPrice=formatDecimal(startValue+(endOrdinal-1)*increment);addText(highlightLayer,endPrice,radius,-90,18,'#17191B',900);}
          }
        }
      }

      /* Protractor */
      var proVisible=bool('protractorVisible',false),proClockwise=bool('protractorClockwise',true),proAngle=num('protractorAngle',0),proSign=proClockwise?1:-1;
      var counterVisible=bool('counterVisible',false),counterClockwise=bool('counterClockwise',true),counterStart=num('counterStart',1),counterStep=num('counterStep',1),counterOffset=Math.max(20,num('counterRadius',34)),counterFont=Math.max(8,num('counterFontSize',11));
      var proSecondaryVisible=bool('proSecondaryVisible',false),proSecondaryClockwise=bool('proSecondaryClockwise',true),proSecondaryStart=num('proSecondaryStart',0),proSecondaryIncrement=num('proSecondaryIncrement',10),proSecondaryDivisions=Math.max(4,Math.round(num('proSecondaryDivisions',36))),proSecondaryOffset=Math.max(25,num('proSecondaryRadius',60)),proSecondaryFont=Math.max(8,num('proSecondaryFontSize',10));
      var proMarkerVisible=bool('proMarkerVisible',false),proMarkerAngle=num('proMarkerAngle',0),proMarkerRadius=num('proMarkerRadius',0),proMarkerColor=text('proMarkerColor','#e93020'),proMarkerWidth=Math.max(12,num('proMarkerWidth',24)),proMarkerLabel=text('proMarkerLabel','');
      if(proVisible){
        var proLayer=layer('protractorRuntimeLayer','Protractor');
        var proRadius=1480;
        addCircle(proLayer,proRadius,'#D43C32',5,.95);
        addCircle(proLayer,proRadius-15,'#F7B2A8',1.6,.75);
        for(var pi=0;pi<360;pi+=5){
          var degree=proSign*pi+proAngle-90,len=pi%30===0?28:pi%10===0?18:9,p1=polar(proRadius,degree),p2=polar(proRadius-len,degree);
          addLine(proLayer,p1.x,p1.y,p2.x,p2.y,'#8E1914',pi%30===0?3:pi%10===0?2:1,.95);
          if(pi%30===0)addText(proLayer,String(pi)+'°',proRadius-46,degree,15,'#8E1914',900);
        }
        if(counterVisible){
          var counterRadius=proRadius-counterOffset,counterSign=counterClockwise?1:-1;
          addCircle(proLayer,counterRadius,'#7D3D32',1.5,.55,'8 7');
          for(var ci=0;ci<36;ci+=1){var cd=counterSign*ci*10+proAngle-90;addText(proLayer,formatDecimal(counterStart+ci*counterStep),counterRadius,cd,counterFont,'#4D281F',800);}
        }
        if(proSecondaryVisible){
          var secRadius=proRadius+proSecondaryOffset,secSign=proSecondaryClockwise?1:-1;
          addCircle(proLayer,secRadius,'#235D8A',2.5,.78);
          for(var si=0;si<proSecondaryDivisions;si+=1){var sd=secSign*si*(360/proSecondaryDivisions)+proAngle-90,p1s=polar(secRadius,sd),p2s=polar(secRadius-14,sd);addLine(proLayer,p1s.x,p1s.y,p2s.x,p2s.y,'#235D8A',1.5,.8);if(si%Math.max(1,Math.round(proSecondaryDivisions/12))===0)addText(proLayer,formatDecimal(proSecondaryStart+si*proSecondaryIncrement),secRadius+22,sd,proSecondaryFont,'#174B72',800);}
        }
        if(proMarkerVisible){var markerRadius=proMarkerRadius>0?proMarkerRadius:proRadius;addTriangle(proLayer,markerRadius,proSign*proMarkerAngle+proAngle-90,proMarkerColor,proMarkerWidth,proMarkerLabel);}
      }

      /* Chronometer */
      var chronoVisible=bool('chronoVisible',true),chronoClockwise=bool('chronoClockwise',true),chronoAngle=num('chronoAngle',0),chronoRange=text('chronoRange','Annual'),chronoSign=chronoClockwise?1:-1;
      var chronoSecondaryVisible=bool('chronoSecondaryVisible',false),chronoSecondaryReverse=bool('chronoSecondaryReverse',true),chronoSecondaryAngle=num('chronoSecondaryAngle',180);
      var chronoMarkerVisible=bool('chronoMarkerVisible',false),chronoMarkerAngle=num('chronoMarkerAngle',0),chronoMarkerColor=text('chronoMarkerColor','#168A52'),chronoMarkerLabel=text('chronoMarkerLabel','');
      if(chronoVisible){
        var chronoLayer=layer('chronometerRuntimeLayer','Chronometer');
        var chronoRadius=1260;
        var rangeMap={Annual:{count:12,labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']},Semiannual:{count:6,labels:['1','2','3','4','5','6']},Quarterly:{count:4,labels:['Q1','Q2','Q3','Q4']},Monthly:{count:31,labels:null},Weekly:{count:7,labels:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']},Daily:{count:24,labels:null},Intraday:{count:24,labels:null}};
        var range=rangeMap[chronoRange]||rangeMap.Annual;
        addCircle(chronoLayer,chronoRadius,'#168A52',5,.9);
        addCircle(chronoLayer,chronoRadius+15,'#8BD3AC',1.5,.7);
        for(var ti=0;ti<range.count;ti+=1){
          var td=chronoSign*ti*(360/range.count)+chronoAngle-90,p1t=polar(chronoRadius,td),p2t=polar(chronoRadius-22,td);
          addLine(chronoLayer,p1t.x,p1t.y,p2t.x,p2t.y,'#0B6A3B',ti%Math.max(1,Math.round(range.count/12))===0?2.6:1.3,.9);
          var label=range.labels?range.labels[ti]:String(ti+1);if(range.count<=12||ti%Math.max(1,Math.round(range.count/12))===0)addText(chronoLayer,label,chronoRadius-46,td,15,'#0B6A3B',900);
        }
        if(chronoSecondaryVisible){var cr2=chronoRadius-82,cs=chronoSecondaryReverse?-chronoSign:chronoSign;addCircle(chronoLayer,cr2,'#5AB783',2,.68,'10 7');for(var csi=0;csi<12;csi+=1){var csd=cs*csi*30+chronoAngle+chronoSecondaryAngle-90;addText(chronoLayer,String(csi+1),cr2,csd,13,'#397759',800);}}
        if(chronoMarkerVisible)addTriangle(chronoLayer,chronoRadius,chronoSign*chronoMarkerAngle+chronoAngle-90,chronoMarkerColor,24,chronoMarkerLabel);
      }

      document.documentElement.dataset.protractorVisible=proVisible?'true':'false';
      document.documentElement.dataset.chronometerVisible=chronoVisible?'true':'false';
      window.__auditKawkabatProtractorChronometerV1=function(){return{ok:true,protractor:{visible:proVisible,clockwise:proClockwise,angle:proAngle,counter:counterVisible,secondary:proSecondaryVisible,marker:proMarkerVisible},chronometer:{visible:chronoVisible,clockwise:chronoClockwise,angle:chronoAngle,range:chronoRange,secondary:chronoSecondaryVisible,marker:chronoMarkerVisible}};};
    }

    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('DIRECT_RUNTIME_HTTP_'+response.status);
      var source=await response.text();
      source=source.replace('Runtime مباشر','Protractor & Chronometer Runtime V1');
      var writeMarker="      document.open();document.write(html);document.close();";
      var runtimeText='('+integratedOverlayRuntime.toString()+')();';
      var patch="      var overlayCloseTag='</scr'+'ipt>';\n"+
        "      var overlayScript='<script id=\"kawkabat-protractor-chronometer-v1\">'+"+JSON.stringify(runtimeText)+"+overlayCloseTag;\n"+
        "      var bodyClose=html.lastIndexOf('</body>');\n"+
        "      if(bodyClose<0)throw new Error('OVERLAY_BODY_CLOSE_NOT_FOUND');\n"+
        "      html=html.slice(0,bodyClose)+overlayScript+html.slice(bodyClose);\n";
      if(source.indexOf(writeMarker)<0)throw new Error('DIRECT_RUNTIME_WRITE_MARKER_NOT_FOUND');
      source=source.replace(writeMarker,patch+writeMarker);
      document.open();document.write(source);document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل المنقلة والكرونومتر: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
