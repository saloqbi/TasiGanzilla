<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Unified Luminous Gold V36</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/16b5130fcc6cce80aceb641a9bf21c1296752625/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornamental-black-band-v33.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var GOLD_PALETTE=[
  ['0%','#B88920'],
  ['18%','#D4A246'],
  ['38%','#F2D36F'],
  ['50%','#FFF1AC'],
  ['62%','#F2D36F'],
  ['82%','#D4A246'],
  ['100%','#B88920']
];
var GOLD_PAINT='url(#v33GoldGradient)';

function locateWheelDocument(doc,depth){
  if(!doc||depth>60)return null;
  if(doc.getElementById('wheel'))return doc;
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=locateWheelDocument(frames[i].contentDocument,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function makeStop(doc,offset,color){
  var node=doc.createElementNS('http://www.w3.org/2000/svg','stop');
  node.setAttribute('offset',offset);
  node.setAttribute('stop-color',color);
  return node;
}

function applyUnifiedLuminousGold(){
  try{
    var doc=locateWheelDocument(frame.contentDocument,0);
    if(!doc)return false;

    var svg=doc.getElementById('wheel');
    var outerFrame=doc.getElementById('outerBlackFrame');
    var ornamentalBand=doc.getElementById('v33OrnamentalBand');
    var gradient=doc.getElementById('v33GoldGradient');
    if(!svg||!outerFrame||!ornamentalBand||!gradient)return false;

    while(gradient.firstChild)gradient.removeChild(gradient.firstChild);
    GOLD_PALETTE.forEach(function(stop){
      gradient.appendChild(makeStop(doc,stop[0],stop[1]));
    });
    gradient.setAttribute('x1','0%');
    gradient.setAttribute('y1','0%');
    gradient.setAttribute('x2','100%');
    gradient.setAttribute('y2','100%');

    var style=doc.getElementById('v36UnifiedLuminousGoldStyle');
    if(!style){
      style=doc.createElement('style');
      style.id='v36UnifiedLuminousGoldStyle';
      (doc.head||doc.documentElement).appendChild(style);
    }
    style.textContent='\n'
      +'#outerBlackFrame .outer-gold-line{stroke:'+GOLD_PAINT+'!important;opacity:1!important;}\n'
      +'#v33OrnamentalBand>circle{stroke:'+GOLD_PAINT+'!important;opacity:1!important;}\n'
      +'#v33OrnamentalBand #v33GoldMotif path{color:#D4A246;}\n';

    var goldLines=outerFrame.querySelectorAll('.outer-gold-line');
    var ornamentBorders=ornamentalBand.querySelectorAll(':scope > circle');
    if(!goldLines.length||!ornamentBorders.length)return false;

    goldLines.forEach(function(node){
      node.setAttribute('stroke',GOLD_PAINT);
      node.style.setProperty('stroke',GOLD_PAINT,'important');
      node.style.setProperty('opacity','1','important');
    });
    ornamentBorders.forEach(function(node){
      node.setAttribute('stroke',GOLD_PAINT);
      node.style.setProperty('stroke',GOLD_PAINT,'important');
      node.style.setProperty('opacity','1','important');
    });

    doc.documentElement.dataset.unifiedLuminousGoldV36='true';
    doc.documentElement.dataset.unifiedGoldBase='#D4A246';
    doc.documentElement.dataset.unifiedGoldPaint=GOLD_PAINT;
    doc.documentElement.dataset.goldGeometryChanged='false';

    if(doc.defaultView){
      doc.defaultView.__auditKawkabatUnifiedLuminousGoldV36=function(){
        var linePaintOk=Array.prototype.every.call(goldLines,function(node){
          return node.style.getPropertyValue('stroke')===GOLD_PAINT;
        });
        var borderPaintOk=Array.prototype.every.call(ornamentBorders,function(node){
          return node.style.getPropertyValue('stroke')===GOLD_PAINT;
        });
        var stops=Array.prototype.map.call(gradient.querySelectorAll('stop'),function(node){
          return[node.getAttribute('offset'),node.getAttribute('stop-color')];
        });
        return{
          ok:linePaintOk&&borderPaintOk&&JSON.stringify(stops)===JSON.stringify(GOLD_PALETTE),
          changedArea:'gold-color-and-luminous-highlight-only',
          unifiedGoldBase:'#D4A246',
          sharedGradientId:'v33GoldGradient',
          goldLineCount:goldLines.length,
          ornamentBorderCount:ornamentBorders.length,
          ornamentGradientUnified:true,
          strokeWidthsChanged:false,
          radiiChanged:false,
          positionsChanged:false,
          blackBandChanged:false,
          ornamentGeometryChanged:false,
          angleNumbersChanged:false,
          angleTicksChanged:false,
          zodiacChanged:false,
          wheelNumbersChanged:false,
          innerWheelGeometryChanged:false
        };
      };
    }
    return true;
  }catch(error){
    return false;
  }
}

function start(){
  if(poll)clearInterval(poll);
  var attempts=0;
  poll=setInterval(function(){
    attempts+=1;
    if(applyUnifiedLuminousGold()||attempts>=1800){
      clearInterval(poll);
      poll=null;
    }
  },100);
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
