<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V131 — تصحيح تسلسل 1–36 هندسيًا حسب زاوية الخلية</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v131-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe
    id="v131-frame"
    title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/88ea4d9e5bcb60f5b55ecaf10f06efd191556648/public/kawkabat-al-arqam-al-sihria-v87-gold-motifs-inside-black-band.html">
  </iframe>

  <script>
  (function () {
    'use strict';

    var DIVISIONS = 36;
    var MAJOR_CYCLE_TICKS = 360;
    var DEFAULT_OUTER_CYCLES = 10;
    var RING_0_ARABIC_FONT_SIZE = '36px';
    var OUTER_RINGS_1_2_ARABIC_FONT_SIZE = '46px';
    var OUTER_RINGS_3_4_ARABIC_FONT_SIZE = '50px';
    var OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE = '54px';

    var frame = document.getElementById('v131-frame');
    var controlDocument = null;
    var wheelDocument = null;
    var wheelObserver = null;
    var pendingApply = false;

    var findInput = null;
    var valueInput = null;
    var incrementInput = null;
    var actualSizeInput = null;
    var visibleSizeInput = null;
    var findAction = null;
    var highlightVisibleInput = null;
    var highlightFillSelect = null;
    var highlightShowNumbersInput = null;
    var highlightShowMarksInput = null;

    var defaultsApplied = false;
    var lastTarget = null;
    var lastAnchor = null;
    var lastFound = false;
    var findInputTimer = null;
    var arabicDigits = '٠١٢٣٤٥٦٧٨٩';

    function visitDocuments(doc, callback, depth) {
      if (!doc || depth > 240) return null;
      var result = callback(doc);
      if (result) return result;

      var frames = doc.querySelectorAll('iframe');
      for (var index = 0; index < frames.length; index += 1) {
        try {
          var found = visitDocuments(
            frames[index].contentDocument,
            callback,
            depth + 1
          );
          if (found) return found;
        } catch (error) {}
      }
      return null;
    }

    function discoverDocuments() {
      try {
        var root = frame.contentDocument;

        controlDocument = visitDocuments(root, function (doc) {
          return doc.querySelector('input[aria-label="Find"]') &&
            doc.querySelector('input[aria-label="Value"]') &&
            doc.querySelector('input[aria-label="Increment"]') &&
            doc.querySelector('input[aria-label="Size"]')
            ? doc
            : null;
        }, 0);

        wheelDocument = visitDocuments(root, function (doc) {
          return doc.getElementById('wheel') &&
            doc.querySelector('.approved-cycle-number') &&
            doc.documentElement.dataset.v50LiveLanguage
            ? doc
            : null;
        }, 0);

        return !!(controlDocument && wheelDocument);
      } catch (error) {
        return false;
      }
    }

    function normalizeDigits(value) {
      var map = {
        '٠':'0','١':'1','٢':'2','٣':'3','٤':'4',
        '٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
        '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4',
        '۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'
      };
      return String(value).replace(/[٠-٩۰-۹]/g, function (digit) {
        return map[digit] || digit;
      }).replace(/,/g, '').trim();
    }

    function parseFiniteNumber(value) {
      var number = Number(normalizeDigits(value));
      return Number.isFinite(number) ? number : null;
    }

    function clampOuterCycles(value) {
      var number = Math.round(Number(value));
      if (!Number.isFinite(number)) number = DEFAULT_OUTER_CYCLES;
      return Math.max(1, Math.min(29, number));
    }

    function dispatchControl(control) {
      control.dispatchEvent(new Event('input', { bubbles: true }));
      control.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function setupOuterCycleProxy() {
      actualSizeInput =
        controlDocument.querySelector('input[aria-label="Size"]');
      if (!actualSizeInput) return false;

      visibleSizeInput =
        controlDocument.querySelector('input[data-v131-outer-cycle-proxy="true"]');

      if (!visibleSizeInput) {
        visibleSizeInput = actualSizeInput.cloneNode(true);
        visibleSizeInput.removeAttribute('aria-label');
        visibleSizeInput.setAttribute(
          'aria-label',
          'Outer cycles after anchor'
        );
        visibleSizeInput.setAttribute(
          'data-v131-outer-cycle-proxy',
          'true'
        );
        visibleSizeInput.min = '1';
        visibleSizeInput.max = '29';
        visibleSizeInput.step = '1';
        visibleSizeInput.value = String(DEFAULT_OUTER_CYCLES);
        actualSizeInput.parentNode.insertBefore(
          visibleSizeInput,
          actualSizeInput
        );
        actualSizeInput.hidden = true;

        function syncOuterCycles() {
          var outerCycles = clampOuterCycles(visibleSizeInput.value);
          visibleSizeInput.value = String(outerCycles);
          actualSizeInput.value = String(outerCycles);
          dispatchControl(actualSizeInput);
        }

        visibleSizeInput.addEventListener('input', syncOuterCycles);
        visibleSizeInput.addEventListener('change', syncOuterCycles);
        visibleSizeInput.addEventListener('keyup', syncOuterCycles);
      }

      var initialOuterCycles =
        clampOuterCycles(visibleSizeInput.value || DEFAULT_OUTER_CYCLES);
      visibleSizeInput.value = String(initialOuterCycles);
      actualSizeInput.value = String(initialOuterCycles);
      controlDocument.documentElement.dataset.v131SizeSemantics =
        'center-zero-excluded-plus-ten-visible-cycles';
      return true;
    }

    function decimalPlaces(value) {
      var text = String(Math.abs(value));
      if (text.indexOf('e-') !== -1) {
        return Math.min(8, Number(text.split('e-')[1]) || 0);
      }
      var point = text.indexOf('.');
      return point === -1 ? 0 : Math.min(8, text.length - point - 1);
    }

    function formatValue(value, step) {
      if (!Number.isFinite(value)) return '';
      return value.toFixed(decimalPlaces(step));
    }

    function localizeDigits(value, language) {
      if (language !== 'ar') return value;
      return value.replace(/[0-9]/g, function (digit) {
        return arabicDigits.charAt(Number(digit));
      });
    }

    function positiveModulo(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function captureOriginalFont(node) {
      if (node.hasAttribute('data-v131-original-font-size')) return;
      node.setAttribute(
        'data-v131-original-font-size',
        node.style.getPropertyValue('font-size') || ''
      );
      node.setAttribute(
        'data-v131-original-font-priority',
        node.style.getPropertyPriority('font-size') || ''
      );
    }

    function restoreOriginalFont(node) {
      var size = node.getAttribute('data-v131-original-font-size') || '';
      var priority =
        node.getAttribute('data-v131-original-font-priority') || '';
      if (size) {
        node.style.setProperty('font-size', size, priority);
      } else {
        node.style.removeProperty('font-size');
      }
      node.setAttribute('data-v131-font-size', 'en-original');
    }

    function applyArabicFont(node, cycleOffset) {
      var size;
      var marker;
      if (cycleOffset === 0) {
        size = RING_0_ARABIC_FONT_SIZE;
        marker = 'ar-anchor-ring-0-36';
      } else if (cycleOffset <= 2) {
        size = OUTER_RINGS_1_2_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-1-2-46';
      } else if (cycleOffset <= 4) {
        size = OUTER_RINGS_3_4_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-3-4-50';
      } else {
        size = OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-5-plus-54';
      }
      node.style.setProperty('font-size', size, 'important');
      node.setAttribute('data-v131-font-size', marker);
    }

    function captureSourceTick(node) {
      if (!node.hasAttribute('data-v131-source-tick')) {
        node.setAttribute(
          'data-v131-source-tick',
          node.getAttribute('data-tick') || ''
        );
      }
      return Number(node.getAttribute('data-v131-source-tick'));
    }

    function renderCycleNumberPair(
      node,
      primaryValue,
      cycleValue,
      language,
      enabled,
      ringCount
    ) {
      var localizedCycle = localizeDigits(String(cycleValue), language);
      var state = enabled
        ? 'pair|' + primaryValue + '|' + localizedCycle
        : 'primary|' + primaryValue;

      if (node.getAttribute('data-v131-number-render-state') === state) {
        return;
      }

      if (!enabled) {
        node.textContent = primaryValue;
        node.setAttribute('data-v131-number-render-state', state);
        node.removeAttribute('data-v131-cycle-angle-number');
        return;
      }

      var x = Number(node.getAttribute('x')) || 0;
      var y = Number(node.getAttribute('y')) || 0;
      var dx = x - 2200;
      var dy = y - 1800;
      var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
      var radialX = dx / radius;
      var radialY = dy / radius;
      var clockwise =
        wheelDocument.documentElement.dataset.layoutDirection !==
        'counterclockwise';
      var tangentX = clockwise ? -radialY : radialY;
      var tangentY = clockwise ? radialX : -radialX;
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var radialOffset = Math.max(10, (ringWidth / 2) - 16);
      var cornerRadius = radius + radialOffset;
      var tangentBoundary = cornerRadius * Math.tan(
        Math.PI / DIVISIONS
      );
      var tangentOffset = Math.max(8, tangentBoundary - 18);
      var secondaryX =
        x + (radialX * radialOffset) + (tangentX * tangentOffset);
      var secondaryY =
        y + (radialY * radialOffset) + (tangentY * tangentOffset);

      node.textContent = '';

      var primary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      primary.setAttribute('x', String(x));
      primary.setAttribute('y', String(y));
      primary.setAttribute('data-v131-number-role', 'primary');
      primary.textContent = primaryValue;

      var secondary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      secondary.setAttribute('x', secondaryX.toFixed(3));
      secondary.setAttribute('y', secondaryY.toFixed(3));
      secondary.setAttribute('data-v131-number-role', 'cycle-angle');
      secondary.style.setProperty('font-size', '15px', 'important');
      secondary.style.setProperty('font-weight', '800', 'important');
      secondary.style.setProperty('font-style', 'italic', 'important');
      secondary.style.setProperty('fill', '#784229', 'important');
      secondary.style.setProperty('stroke', '#4A291B', 'important');
      secondary.style.setProperty('stroke-width', '0.2px', 'important');
      secondary.style.setProperty(
        'paint-order',
        'stroke fill',
        'important'
      );
      secondary.style.setProperty(
        'stroke-linejoin',
        'round',
        'important'
      );
      secondary.style.setProperty('opacity', '1', 'important');
      secondary.textContent = localizedCycle;

      node.appendChild(primary);
      node.appendChild(secondary);
      node.setAttribute('data-v131-number-render-state', state);
      node.setAttribute(
        'data-v131-cycle-angle-number',
        String(cycleValue)
      );
    }

    function calculateAnchorModel(root) {
      /*
       * The panel fields are the authoritative live values. The nested
       * renderer datasets can lag behind a decimal edit and previously
       * kept canonicalUnit=0.001 after Value was changed to 0.01.
       */
      var panelValue = parseFiniteNumber(
        valueInput && valueInput.value
      );
      var panelIncrement = parseFiniteNumber(
        incrementInput && incrementInput.value
      );
      var inputValue = panelValue !== null
        ? panelValue
        : Number(root.dataset.inputValue || '1');
      var unit = Number(root.dataset.canonicalUnit || '1');
      var increment = panelIncrement !== null
        ? panelIncrement
        : Number(root.dataset.incrementValue || '1');
      if (!Number.isFinite(inputValue) || inputValue <= 0) inputValue = 1;
      if (!Number.isFinite(unit) || unit <= 0) unit = 1;
      if (!Number.isFinite(increment) || increment === 0) increment = 1;

      /*
       * Saudi halala mode: Value 0.01 means one halala per cell.
       * It is intentionally explicit so the native decimal-unit inference
       * cannot turn 0.01 into 0.001.
       */
      var halalaMode = Math.abs(inputValue - 0.01) < 1e-12;
      var step = halalaMode ? 0.01 : unit * Math.abs(increment);
      var anchorEndTick = halalaMode
        ? DIVISIONS
        : Math.max(
            DIVISIONS,
            Math.ceil(inputValue / step / DIVISIONS) * DIVISIONS
          );
      var anchorEndValue = anchorEndTick * step;
      var anchorBaseValue = anchorEndValue - (DIVISIONS * step);

      return {
        inputValue: inputValue,
        step: step,
        anchorEndTick: anchorEndTick,
        anchorEndValue: anchorEndValue,
        anchorBaseValue: anchorBaseValue,
        halalaMode: halalaMode
      };
    }

    function layerNumberForOffset(cycleOffset) {
      if (cycleOffset === 0) return 0;
      return positiveModulo(cycleOffset - 1, 10) + 1;
    }

    function renderLayerMarks(
      root,
      language,
      dataType,
      ringCount,
      model
    ) {
      var existing = wheelDocument.getElementById('v131LayerMarks');
      var enabled = !!(
        highlightShowMarksInput &&
        highlightShowMarksInput.checked &&
        dataType === 'price' &&
        root.dataset.viewMode === 'circle36'
      );

      if (!enabled) {
        if (existing) existing.remove();
        root.dataset.v131LayerMarks = 'hidden';
        return;
      }

      var state = [
        language,
        ringCount,
        root.dataset.layoutDirection || 'clockwise',
        model.anchorEndTick,
        model.step
      ].join('|');

      if (
        existing &&
        existing.getAttribute('data-v131-render-state') === state
      ) {
        return;
      }
      if (existing) existing.remove();

      var cycles = wheelDocument.getElementById('dynamicApprovedCycles');
      if (!cycles) return;

      var group = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'g'
      );
      group.id = 'v131LayerMarks';
      group.setAttribute('pointer-events', 'none');
      group.setAttribute('aria-label', 'Wheel layer marks');
      group.setAttribute('data-v131-render-state', state);

      var clockwise =
        root.dataset.layoutDirection !== 'counterclockwise';
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var eligibleCount = 0;

      wheelDocument
        .querySelectorAll('.approved-cycle-number[data-tick]')
        .forEach(function (node) {
          var correctedTick = Number(node.getAttribute('data-tick'));
          if (
            !Number.isFinite(correctedTick) ||
            Math.abs(correctedTick - Math.round(correctedTick)) > 1e-9 ||
            positiveModulo(Math.round(correctedTick), 3) !== 0
          ) {
            return;
          }

          var cycleOffset = Number.parseInt(
            node.getAttribute('data-cycle-offset') || '0',
            10
          );
          var x = Number(node.getAttribute('x')) || 0;
          var y = Number(node.getAttribute('y')) || 0;
          var dx = x - 2200;
          var dy = y - 1800;
          var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
          var radialX = dx / radius;
          var radialY = dy / radius;
          var tangentX = clockwise ? -radialY : radialY;
          var tangentY = clockwise ? radialX : -radialX;
          var radialOffset = Math.max(8, (ringWidth / 2) - 28);
          var cornerRadius = radius + radialOffset;
          var tangentBoundary = cornerRadius * Math.tan(
            Math.PI / DIVISIONS
          );
          var tangentOffset = Math.max(6, tangentBoundary - 18);
          var markX =
            x + (radialX * radialOffset) - (tangentX * tangentOffset);
          var markY =
            y + (radialY * radialOffset) - (tangentY * tangentOffset);
          var layerNumber = layerNumberForOffset(cycleOffset);

          var mark = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          mark.setAttribute('x', markX.toFixed(3));
          mark.setAttribute('y', markY.toFixed(3));
          mark.setAttribute('text-anchor', 'middle');
          mark.setAttribute('dominant-baseline', 'central');
          mark.setAttribute('data-v131-layer-mark', String(layerNumber));
          mark.setAttribute(
            'data-v131-source-tick',
            String(correctedTick)
          );
          mark.style.setProperty('font-family', 'Arial, sans-serif', 'important');
          mark.style.setProperty('font-size', '14px', 'important');
          mark.style.setProperty('font-weight', '800', 'important');
          mark.style.setProperty('font-style', 'normal', 'important');
          mark.style.setProperty('fill', '#6F3F68', 'important');
          mark.style.setProperty('stroke', '#3F233C', 'important');
          mark.style.setProperty('stroke-width', '0.18px', 'important');
          mark.style.setProperty('paint-order', 'stroke fill', 'important');
          mark.style.setProperty('opacity', '1', 'important');
          mark.textContent = localizeDigits(String(layerNumber), language);

          var badge = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'rect'
          );
          badge.setAttribute('x', (markX - 12).toFixed(3));
          badge.setAttribute('y', (markY - 10).toFixed(3));
          badge.setAttribute('width', '24');
          badge.setAttribute('height', '20');
          badge.setAttribute('rx', '2.5');
          badge.setAttribute('ry', '2.5');
          badge.setAttribute(
            'data-v131-layer-badge',
            String(layerNumber)
          );
          badge.style.setProperty('fill', '#EAF7F4', 'important');
          badge.style.setProperty('fill-opacity', '0.92', 'important');
          badge.style.setProperty('stroke', '#69BEB8', 'important');
          badge.style.setProperty('stroke-width', '0.9px', 'important');
          badge.style.setProperty('opacity', '1', 'important');

          var shadow = badge.cloneNode(true);
          shadow.removeAttribute('data-v131-layer-badge');
          shadow.setAttribute(
            'data-v131-layer-shadow',
            String(layerNumber)
          );
          shadow.setAttribute('x', (markX - 10.5).toFixed(3));
          shadow.setAttribute('y', (markY - 8.5).toFixed(3));
          shadow.style.setProperty('fill', '#2F625E', 'important');
          shadow.style.setProperty('fill-opacity', '0.22', 'important');
          shadow.style.setProperty('stroke', 'none', 'important');

          group.appendChild(shadow);
          group.appendChild(badge);
          group.appendChild(mark);
          eligibleCount += 1;
        });

      group.setAttribute(
        'data-v131-eligible-mark-count',
        String(eligibleCount)
      );
      cycles.appendChild(group);
      root.dataset.v131LayerMarks = 'visible';
      root.dataset.v131LayerMarkPattern =
        'black-multiples-of-3-offset-0-then-1-to-10-repeat';
    }

    function cellPositionFromGeometry(node, clockwise) {
      var x = Number(node.getAttribute('x'));
      var y = Number(node.getAttribute('y'));
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      var angle = Math.atan2(y - 1800, x - 2200) * 180 / Math.PI;
      var rawIndex = (angle + 90) / (360 / DIVISIONS);
      /*
       * Approved price nodes are positioned at cell centres one geometric
       * step after the north boundary. Converting their angle without this
       * correction shifts every displayed value forward: 2 appears where
       * 1 belongs and 37 replaces 36 at the end of the first ring.
       */
      var numberIndex = positiveModulo(
        Math.round(clockwise ? rawIndex : -rawIndex) - 1,
        DIVISIONS
      );
      return numberIndex === 0 ? DIVISIONS : numberIndex;
    }

    function ensureArabicCardinalDirectionsV142() {
      if (!wheelDocument) return false;
      var svg = wheelDocument.getElementById('wheel');
      if (!svg) return false;

      var existing =
        wheelDocument.getElementById('v144ArabicCardinalDirections');
      if (existing) {
        if (existing.parentNode === svg &&
            existing !== svg.lastElementChild) {
          svg.appendChild(existing);
        }
        return true;
      }

      var NS = 'http://www.w3.org/2000/svg';
      var group = wheelDocument.createElementNS(NS, 'g');
      group.id = 'v144ArabicCardinalDirections';
      group.setAttribute('aria-label', 'الاتجاهات الأربعة');
      group.setAttribute('pointer-events', 'none');

      var directions = [
        { label: 'الشمال', x: 2200, y: 140, rotation: 0 },
        { label: 'الشرق', x: 3860, y: 1800, rotation: 90 },
        { label: 'الجنوب', x: 2200, y: 3460, rotation: 0 },
        { label: 'الغرب', x: 540, y: 1800, rotation: -90 }
      ];

      directions.forEach(function (direction) {
        var text = wheelDocument.createElementNS(NS, 'text');
        text.setAttribute('x', String(direction.x));
        text.setAttribute('y', String(direction.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('direction', 'rtl');
        text.setAttribute('unicode-bidi', 'plaintext');
        text.setAttribute('lang', 'ar');
        text.setAttribute('aria-label', direction.label);
        text.setAttribute(
          'transform',
          'rotate(' + direction.rotation + ' ' +
            direction.x + ' ' + direction.y + ')'
        );
        text.style.fontFamily = 'Tahoma, Arial, sans-serif';
        text.style.fontSize = '32px';
        text.style.fontWeight = '500';
        text.style.fill = '#171513';
        text.style.paintOrder = 'stroke fill';
        text.style.stroke = 'rgba(255,255,255,0.32)';
        text.style.strokeWidth = '0.8px';
        text.textContent = direction.label;
        group.appendChild(text);
      });

      svg.appendChild(group);
      wheelDocument.documentElement.dataset.v144CardinalDirections =
        'same-wheel-document-safe-overlay';
      return true;
    }


    // V170: expand the SVG canvas vertically while preserving wheel scale and radius.
    function ensureVerticalCanvasMarginV170() {
      if (!wheelDocument || !wheelDocument.body) return false;
      var svg = wheelDocument.getElementById('wheel');
      if (!svg || svg.dataset.v170CanvasMargin === 'true') return !!svg;

      var vb = svg.viewBox && svg.viewBox.baseVal;
      if (!vb || !vb.width || !vb.height) return false;

      var original = {
        x: vb.x,
        y: vb.y,
        width: vb.width,
        height: vb.height
      };
      var PAD_UNITS = 160;
      var newY = original.y - PAD_UNITS;
      var newHeight = original.height + PAD_UNITS * 2;

      svg.dataset.v170CanvasMargin = 'true';
      svg.dataset.v170OriginalViewBox =
        [original.x, original.y, original.width, original.height].join(' ');
      svg.dataset.v170PaddingUnits = String(PAD_UNITS);
      svg.setAttribute(
        'viewBox',
        [original.x, newY, original.width, newHeight].join(' ')
      );

      var style = wheelDocument.createElement('style');
      style.id = 'v170CanvasMarginStyle';
      style.textContent =
        '#wheel[data-v170-canvas-margin="true"]{' +
        'height:auto!important;' +
        'aspect-ratio:' + original.width + '/' + newHeight + '!important;' +
        'background:#f7f1e3!important;' +
        '}';

      (wheelDocument.head || wheelDocument.documentElement).appendChild(style);

      var computedBody = wheelDocument.defaultView.getComputedStyle(
        wheelDocument.body
      );
      var oldMinHeight = Number.parseFloat(computedBody.minHeight) || 3600;
      var renderedWidth = svg.getBoundingClientRect().width || original.width;
      var scale = renderedWidth / original.width;
      var addedPixels = PAD_UNITS * 2 * scale;
      wheelDocument.body.style.minHeight =
        Math.ceil(oldMinHeight + addedPixels) + 'px';

      wheelDocument.documentElement.dataset.v170VerticalCanvasMargin = 'true';
      return true;
    }

    function ensureAngleRotationControlV145() {
      if (!wheelDocument) return false;
      var svg = wheelDocument.getElementById('wheel');
      var ticks = wheelDocument.getElementById('angleTicks');
      var labels = wheelDocument.getElementById('angleLabels');
      if (!svg || !ticks || !labels) return false;

      if (!Array.prototype.some.call(
        highlightFillSelect.options,

          if (event.key === 'Enter' || event.key === ' ') {

            runFind();
          }
        });
