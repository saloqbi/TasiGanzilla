<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — لوحة فضية فارغة</title>
  <style>
    :root{
      color-scheme:light;
      --silver-white:#f8fbfd;
      --silver-light:#dce5ea;
      --silver-mid:#9aaab4;
      --silver-dark:#35444e;
      --silver-black:#11171b;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    .work-frame{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#f7f1e3;
    }
    .empty-silver-panel{
      position:fixed;
      top:50%;
      right:24px;
      width:340px;
      height:620px;
      transform:translateY(-50%);
      z-index:1000;
      pointer-events:none;
      border-radius:30px;
      padding:14px;
      background:
        linear-gradient(90deg,
          var(--silver-black) 0%,
          var(--silver-dark) 3%,
          var(--silver-white) 8%,
          var(--silver-mid) 13%,
          var(--silver-white) 18%,
          var(--silver-light) 50%,
          var(--silver-white) 82%,
          var(--silver-mid) 88%,
          var(--silver-dark) 96%,
          var(--silver-black) 100%);
      border:2px solid #28353d;
      box-shadow:
        0 18px 42px rgba(18,25,29,.34),
        inset 0 0 0 2px rgba(255,255,255,.82),
        inset 0 0 0 6px rgba(78,94,104,.52),
        inset 0 0 16px rgba(255,255,255,.9);
    }
    .panel-shell{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      border-radius:21px;
      border:2px solid #384852;
      background:linear-gradient(90deg,#9daab2 0%,#f9fcfd 8%,#d1dbe0 23%,#f8fafb 50%,#c4d0d6 77%,#ffffff 91%,#74838d 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.92),
        inset 0 0 0 5px rgba(61,76,86,.36),
        inset 0 0 22px rgba(38,51,60,.28);
    }
    .panel-cap,
    .panel-foot{
      position:absolute;
      left:10px;
      right:10px;
      height:58px;
      border-radius:14px;
      border:1.5px solid #657680;
      background:linear-gradient(180deg,#ffffff 0%,#dbe4e9 23%,#aebcc5 48%,#f5f8fa 72%,#c2ced5 100%);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.95),
        inset 0 -3px 5px rgba(52,67,76,.34),
        0 2px 4px rgba(28,38,44,.25);
    }
    .panel-cap{top:10px}
    .panel-foot{bottom:10px}
    .panel-empty-body{
      position:absolute;
      top:78px;
      right:12px;
      bottom:78px;
      left:12px;
      border-radius:18px;
      border:2px solid #4a5b66;
      background:
        radial-gradient(circle at 42% 28%,rgba(255,255,255,.95) 0%,rgba(225,233,237,.88) 38%,rgba(177,190,198,.78) 72%,rgba(128,143,152,.82) 100%),
        linear-gradient(90deg,#aab7bf,#f9fbfc 16%,#c9d4da 50%,#ffffff 84%,#8d9da7);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.9),
        inset 0 0 0 6px rgba(48,63,73,.24),
        inset 0 0 26px rgba(47,61,70,.28),
        0 2px 5px rgba(26,36,42,.22);
    }
    .panel-empty-body::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:13px;
      border:1px solid rgba(45,59,68,.7);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.78);
    }
    @media (max-width:900px){
      .empty-silver-panel{
        right:12px;
        width:250px;
        height:470px;
        border-radius:24px;
        padding:10px;
      }
      .panel-cap,.panel-foot{height:44px}
      .panel-empty-body{top:60px;bottom:60px}
    }
  </style>
</head>
<body>
  <iframe
    class="work-frame"
    title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/f875bee17b588b02617bcad4ae55270c60033f3d/public/kawkabat-al-arqam-al-sihria.html">
  </iframe>

  <aside class="empty-silver-panel" aria-label="لوحة فضية فارغة">
    <div class="panel-shell">
      <div class="panel-cap"></div>
      <div class="panel-empty-body"></div>
      <div class="panel-foot"></div>
    </div>
  </aside>
</body>
</html>
