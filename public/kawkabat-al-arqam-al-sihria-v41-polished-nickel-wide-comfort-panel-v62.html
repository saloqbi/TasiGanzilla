<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kawkabat V62 — Wide Comfortable Panel</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Kawkabat Wide Panel" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/1791f375a6b9efea2be0b10b14504e4f7b8fb037/public/kawkabat-al-arqam-al-sihria-v41-chrome-chart-settings-full-v50.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var observer=null;
var MAP={
  'Chart Settings':'إعدادات المخطط','Layout':'التخطيط','Visible':'مرئي',
  'Clockwise':'مع عقارب الساعة','Counterclockwise':'عكس عقارب الساعة',
  'Size':'الحجم','View':'نوع العرض','Data':'نوع البيانات','Data type':'نوع البيانات',
  'Price':'السعر','Start Value':'قيمة البداية','Direction':'الاتجاه','Increment':'الزيادة',
  'Value':'القيمة','Find':'بحث','Highlight':'التمييز','Fill':'تعبئة',
  'Show marks':'إظهار العلامات','Show numbers':'إظهار الأرقام','Figures':'الأشكال',
  'Triangle':'مثلث','Square':'مربع','Pentagon':'خماسي','Hexagon':'سداسي',
  'Septagon':'سباعي','Octagon':'ثماني','Nonagon':'تساعي','Decagon':'عشاري',
  'Hendecagon':'أحد عشري','Dodecagon':'اثنا عشري','Vectors':'متجهات',
  'Locator':'محدد','Vortex':'دوامة','Circle of 36':'دائرة 36','Levels':'المستويات'
};
function docs(d,n,a){
  if(!d||n>90)return a;
  a.push(d);
  var fs=[];
  try{fs=d.querySelectorAll('iframe');}catch(e){return a;}
  for(var i=0;i<fs.length;i++){try{docs(fs[i].contentDocument,n+1,a);}catch(e){}}
  return a;
}
function panelDoc(){
  var root=frame.contentDocument;
  if(!root)return null;
  var all=docs(root,0,[]);
  for(var i=0;i<all.length;i++){
    try{if(all[i].querySelector('.control-panel')&&all[i].querySelector('.work-frame'))return all[i];}catch(e){}
  }
  return null;
}
function tr(v){var k=String(v||'').trim();return MAP[k]||k;}
function translate(d){
  var title=d.querySelector('.panel-title'); if(title)title.textContent='إعدادات المخطط';
  var dot=d.querySelector('.panel-dot'); if(dot)dot.textContent='☰';
  d.querySelectorAll('.section-name,.control-label,.v50-figure-head span:last-child').forEach(function(n){var x=tr(n.textContent);if(x)n.textContent=x;});
  d.querySelectorAll('select option').forEach(function(n){var x=tr(n.textContent);if(x)n.textContent=x;});
}
function toolbar(d){
  var actions=d.querySelector('.panel-actions');
  if(!actions)return;
  var icons=['+','−','✎','▣'];
  while(actions.children.length<4){var s=d.createElement('span');s.className='panel-action';actions.appendChild(s);}
  Array.prototype.forEach.call(actions.children,function(n,i){if(i<4){n.textContent=icons[i];n.style.display='grid';}});
}
function style(d){
  if(d.getElementById('v62WidePanelStyle'))return;
  var s=d.createElement('style');
  s.id='v62WidePanelStyle';
  s.textContent=`
    .control-panel{
      width:560px!important;min-width:560px!important;max-width:560px!important;flex:0 0 560px!important;
      padding:12px!important;border-right:2px solid #18384b!important;
      background:linear-gradient(90deg,#102a3a 0%,#dff7ff 3%,#627b8b 6%,#fff 10%,#9bacb7 28%,#f8fdff 50%,#879ba8 72%,#fff 90%,#365266 96%,#e9fbff 100%)!important;
      box-shadow:12px 0 30px rgba(7,21,30,.4),inset 0 0 0 1px #fff,inset 0 0 0 4px #6d8797!important;
    }
    .work-frame{left:580px!important;width:calc(100% - 600px)!important;min-width:360px!important;}
    .panel-shell{width:100%!important;min-width:0!important;border:2px solid #294958!important;border-radius:20px!important;background:linear-gradient(90deg,#c5d0d7,#fff 16%,#9eacb6 34%,#f8fcfe 50%,#98a8b3 68%,#fff 86%,#c5d0d7)!important;box-shadow:inset 0 0 0 1px #fff,inset 0 0 0 4px #8196a3,inset 0 0 18px rgba(255,255,255,.9)!important;}
    .panel-topbar{
      flex:0 0 86px!important;min-height:86px!important;margin:9px 9px 7px!important;padding:0 14px!important;
      display:grid!important;grid-template-columns:48px minmax(0,1fr) auto!important;align-items:center!important;gap:12px!important;
      border:2px solid #294452!important;border-radius:15px!important;
      background:linear-gradient(180deg,#fff 0%,#fafdff 11%,#93a4af 20%,#f8fbfd 37%,#8799a5 52%,#fff 68%,#a9b6bf 83%,#eef7fb 100%)!important;
      box-shadow:inset 0 2px 2px #fff,inset 0 -2px 3px rgba(27,47,60,.48),0 3px 6px rgba(8,22,31,.5)!important;
    }
    .panel-dot{width:44px!important;height:44px!important;transform:none!important;border:0!important;background:transparent!important;display:grid!important;place-items:center!important;font-size:35px!important;line-height:1!important;color:#101820!important;}
    .panel-title{min-width:0!important;white-space:nowrap!important;overflow:visible!important;font-size:32px!important;font-weight:900!important;line-height:1.1!important;text-align:right!important;}
    .panel-actions{display:flex!important;flex:0 0 auto!important;align-items:center!important;gap:8px!important;min-width:256px!important;overflow:visible!important;}
    .panel-action{display:grid!important;place-items:center!important;flex:0 0 58px!important;width:58px!important;height:58px!important;border:2px solid #203e50!important;border-radius:13px!important;background:linear-gradient(135deg,#fff,#b8c8d2 18%,#fff 35%,#718897 52%,#fff 70%,#9fb2bf 84%,#fff)!important;box-shadow:inset 0 0 0 1px #fff,inset 2px 2px 3px #fff,inset -2px -2px 3px rgba(31,53,67,.55),0 3px 5px rgba(7,20,29,.55)!important;color:#101820!important;font-size:34px!important;font-weight:900!important;line-height:1!important;}
    .panel-info{display:none!important;}
    .panel-scroll{margin:0 9px 9px!important;border:1px solid #294452!important;border-radius:12px!important;scrollbar-width:auto!important;scrollbar-color:#6e7c84 #dfe5e8!important;}
    .panel-scroll::-webkit-scrollbar{width:16px!important;height:16px!important;}
    .panel-scroll::-webkit-scrollbar-track{background:#dfe5e8!important;border-left:1px solid #8e9ba2!important;}
    .panel-scroll::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#62717a,#b8c2c7,#6b7981)!important;border:1px solid #4b5961!important;border-radius:10px!important;min-height:52px!important;}
    .control-section{margin:9px!important;border:1px solid #445660!important;border-radius:14px!important;overflow:hidden!important;background:linear-gradient(90deg,#aeb9c0,#eef2f4 8%,#c7ced2 50%,#f4f6f7 92%,#98a6ae)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 2px 5px rgba(21,32,39,.28)!important;}
    .section-toggle{min-height:62px!important;padding:0 16px!important;border:0!important;border-bottom:2px solid #4c5e68!important;border-radius:12px 12px 7px 7px!important;background:linear-gradient(180deg,#fff 0%,#fafdff 11%,#93a4af 20%,#f8fbfd 37%,#8799a5 52%,#fff 68%,#a9b6bf 83%,#eef7fb 100%)!important;color:#10171b!important;font-size:23px!important;font-weight:900!important;text-shadow:0 1px 0 #fff!important;}
    .section-sign{width:32px!important;font-size:27px!important;color:#15232b!important;}.section-icon{font-size:25px!important;color:#17242c!important;opacity:1!important;}.section-name{font-size:22px!important;}
    .control-row{min-height:62px!important;grid-template-columns:43% 57%!important;border-bottom:1px solid rgba(76,91,101,.28)!important;background:transparent!important;}
    .control-label{padding:10px 16px!important;background:transparent!important;color:#10171b!important;font-size:21px!important;font-weight:800!important;line-height:1.25!important;text-align:right!important;white-space:normal!important;}
    .control-value{padding:7px 10px!important;border-left:0!important;background:transparent!important;font-size:20px!important;}
    .control-value input[type=text],.control-value input[type=number],.control-value select{height:46px!important;border:2px solid #294452!important;border-radius:10px!important;padding:4px 12px!important;background:linear-gradient(180deg,#fff 0%,#f8fcfe 16%,#a8b5be 29%,#fff 48%,#cbd4da 66%,#fff 82%,#8fa1ad 100%)!important;box-shadow:inset 0 2px 3px #fff,inset 0 -2px 3px rgba(34,55,68,.35),0 2px 3px rgba(8,21,29,.45)!important;color:#111!important;font-size:21px!important;font-weight:800!important;text-align:center!important;}
    .control-value input[type=checkbox],.v50-checkbox{width:28px!important;height:28px!important;accent-color:#176da5!important;}
    .v50-figure-head{min-height:42px!important;font-size:17px!important;padding:6px 12px!important;}.v50-tree-sign{width:21px!important;height:21px!important;font-size:16px!important;}.v50-compact-row{min-height:39px!important;grid-template-columns:48% 52%!important;}.v50-compact-row .control-label{font-size:16px!important;padding-left:30px!important;}.v50-compact-row .control-value{font-size:16px!important;}
    @media(max-width:980px){.control-panel{width:520px!important;min-width:520px!important;max-width:520px!important;flex-basis:520px!important}.work-frame{left:540px!important;width:calc(100% - 560px)!important}.panel-actions{min-width:236px!important}.panel-action{flex-basis:53px!important;width:53px!important;height:53px!important}.panel-title{font-size:28px!important}}
  `;
  (d.head||d.documentElement).appendChild(s);
}
function apply(){
  try{
    var d=panelDoc(); if(!d)return false;
    style(d); toolbar(d); translate(d);
    d.documentElement.dataset.wideComfortPanelV62='true';
    if(!observer&&d.body){observer=new MutationObserver(function(){toolbar(d);translate(d);});observer.observe(d.body,{subtree:true,childList:true});}
    if(d.defaultView)d.defaultView.__auditWideComfortPanelV62=function(){return{ok:true,panelWidth:560,icons:4,titleVisible:true,workFrameShifted:true};};
    return true;
  }catch(e){return false;}
}
function start(){
  if(poll)clearInterval(poll);
  var n=0;poll=setInterval(function(){n++;if(apply()||n>1200){if(n>1200||apply()){clearInterval(poll);poll=null;}}},100);
}
frame.addEventListener('load',start);start();
}());
</script>
</body>
</html>
