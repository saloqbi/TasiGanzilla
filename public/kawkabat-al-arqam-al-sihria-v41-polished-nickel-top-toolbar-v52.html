<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Polished Nickel Chart Settings + Top Toolbar V52</title>
  <style>
    :root{--toolbar-h:58px;--nickel-dark:#50606d;--nickel-mid:#c7cdd2;--nickel-light:#fff;--blue:#245bba}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    body{font-family:Arial,Helvetica,sans-serif}
    #pageShell{position:fixed;inset:0;display:flex;flex-direction:column;margin:0;padding:0;overflow:hidden}
    #viewerToolbar{position:relative;z-index:2147483000;flex:0 0 var(--toolbar-h);width:100%;height:var(--toolbar-h);margin:0;padding:0 7px;display:flex;align-items:stretch;justify-content:flex-end;background:linear-gradient(180deg,#fff 0%,#f6f7f8 17%,#d4d8dc 51%,#f8f9fa 84%,#bcc3c9 100%);border:0;border-bottom:1px solid #7e878e;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.7),0 2px 5px rgba(24,34,41,.32);user-select:none}
    .toolGroup{display:flex;align-items:stretch;height:100%;border-left:1px solid rgba(255,255,255,.85);border-right:1px solid rgba(92,104,113,.2)}
    .toolButton,.languageButton{appearance:none;-webkit-appearance:none;height:100%;min-width:58px;margin:0;padding:0 13px;border:0;border-left:1px solid rgba(255,255,255,.9);border-right:1px solid rgba(86,97,106,.16);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(231,234,237,.88) 50%,rgba(250,250,250,.95));color:#111;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;outline:none}

    .toolButton:active,.languageButton:active{box-shadow:inset 0 2px 6px rgba(30,44,56,.3)}
    .toolButton:focus-visible,.languageButton:focus-visible{box-shadow:inset 0 0 0 3px rgba(36,91,186,.35)}

    .zoomButton svg{width:39px;height:39px}
    #zoomReadout{height:100%;min-width:92px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-size:29px;line-height:1;font-weight:700;color:#050505;text-shadow:0 1px #fff;border-left:1px solid rgba(255,255,255,.9);border-right:1px solid rgba(86,97,106,.16);font-variant-numeric:tabular-nums;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(231,234,237,.72) 52%,rgba(250,250,250,.86))}

    .languageButton .flag{width:42px;height:28px;flex:0 0 auto;border:1px solid #9ca4aa;box-shadow:0 1px 2px rgba(0,0,0,.25)}
    .languageButton .chevron{position:absolute;right:15px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #222}
    #languageMenu{position:absolute;top:calc(var(--toolbar-h) - 1px);right:65px;z-index:2147483001;display:none;min-width:245px;padding:5px;background:#f4f5f6;border:1px solid #7d858c;box-shadow:0 5px 16px rgba(0,0,0,.3)}
    #languageMenu.open{display:block}
    .languageOption{width:100%;padding:10px 12px;border:0;background:#fff;text-align:left;font-size:18px;cursor:pointer}
    .languageOption:hover{background:#dfeaf8}
    #infoPopover{position:absolute;top:calc(var(--toolbar-h) + 7px);right:8px;z-index:2147483001;display:none;width:min(340px,calc(100vw - 16px));padding:13px 15px;border:1px solid #6f7982;border-radius:5px;background:rgba(255,255,255,.98);box-shadow:0 7px 22px rgba(0,0,0,.32);font-size:14px;line-height:1.55;color:#17202a}
    #infoPopover.open{display:block}
    #viewerViewport{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:auto;background:#f7f1e3}
    #appFrame{display:block;width:105.2631579%;height:105.2631579%;margin:0;border:0;transform:scale(.95);transform-origin:0 0;background:#f7f1e3}
    @media(max-width:760px){:root{--toolbar-h:50px}.toolButton{min-width:45px;padding:0 7px}.toolButton svg{width:29px;height:29px}.zoomButton svg{width:32px;height:32px}#zoomReadout{min-width:68px;font-size:22px}.languageButton{min-width:132px;font-size:18px;padding:0 34px 0 8px}.languageButton .flag{width:31px;height:21px}.languageButton .chevron{right:10px;border-left-width:7px;border-right-width:7px;border-top-width:8px}}
    @media(max-width:520px){.secondaryTool{display:none}.languageButton{min-width:108px}.languageButton .languageText{display:none}}

<body>

        <button class="languageButton" id="languageButton" type="button" aria-haspopup="menu" aria-expanded="false">

        </button>
      </div>
      <div id="languageMenu" role="menu">
        <button class="languageOption" type="button" data-lang="en" role="menuitem">🇬🇧 English</button>
        <button class="languageOption" type="button" data-lang="ar" role="menuitem">🇸🇦 العربية</button>
      </div>
      <div id="infoPopover" role="status">Viewer toolbar V52 — zoom, full screen, reset, language direction, and information controls. The toolbar is attached directly to the top edge with zero top margin.</div>
    </header>
    <main id="viewerViewport">

    </main>
  </div>
  <script>
