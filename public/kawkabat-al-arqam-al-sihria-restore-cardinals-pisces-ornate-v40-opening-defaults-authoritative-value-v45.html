<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Ornate V40 Opening Defaults Authoritative Value V45</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/25b21f272936c9f233a15eea084e50b3c1f0efbc/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-angle-border-gold-color-only-v38.html"></iframe>
<script>
(function(){
'use strict';
var V40_SOURCE='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/632ec537d7aa2bef27f565098cfa673904e348c5/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornate-classic-brown-turquoise-frame-v40.html';
var frame=document.getElementById('appFrame');
var groupIds=['approvedCycleOneNumbers','approvedCycleTwoNumbers','approvedCycleThreeNumbers','approvedCycleFourNumbers','approvedCycleFiveNumbers','approvedCycleSixNumbers','approvedCycleSevenNumbers','approvedCycleEightNumbers','approvedCycleNineNumbers','approvedCycleTenNumbers'];
var boundValue=null;
var boundIncrement=null;
var repairTimer=null;
var applyTimer=null;
var observer=null;
var openingDefaultsApplied=false;
var applying=false;

function findDocumentWithSelector(doc,selector,depth){
  if(!doc||depth>100)return null;
  try{if(doc.querySelector(selector))return doc;}catch(error){}
  var frames=[];
  try{frames=doc.querySelectorAll('iframe');}catch(error){return null;}
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=findDocumentWithSelector(frames[i].contentDocument,selector,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function locatePanel(){
  var doc=findDocumentWithSelector(document,'input[aria-label="Value"]',0);
  if(!doc)return null;
  return{
    doc:doc,
    value:doc.querySelector('input[aria-label="Value"]'),
    find:doc.querySelector('input[aria-label="Find"]'),
    increment:doc.querySelector('input[aria-label="Increment"]')
  };
}

function locateWheel(){
  var doc=findDocumentWithSelector(document,'#approvedCycleOneNumbers',0);
  if(!doc)return null;
  var svg=doc.getElementById('wheel');
  var groups=groupIds.map(function(id){return doc.getElementById(id);});
  if(!svg||groups.some(function(group){return !group||group.children.length!==36;}))return null;
  var viewBox=(svg.getAttribute('viewBox')||'0 0 4400 3600').trim().split(/\s+/).map(Number);
  return{
    doc:doc,
    svg:svg,
    groups:groups,
    cx:(viewBox[0]||0)+(viewBox[2]||4400)/2,
    cy:(viewBox[1]||0)+(viewBox[3]||3600)/2
  };
}

function parseNumber(input,fallback){
  var text=String(input&&input.value!=null?input.value:'').trim().replace(',','.');
  var value=Number(text);
  return Number.isFinite(value)?value:fallback;
}

function colorClass(tick){
  var mod=((Math.round(tick)%3)+3)%3;
  return mod===1?'number-red':mod===2?'number-blue':'number-black';
}

function decimalsForUnit(unit){
  if(unit>=1)return 0;
  var text=unit.toFixed(12).replace(/0+$/,'');
  return Math.min(8,(text.split('.')[1]||'').length);
}

function formatValue(value,unit){
  var decimals=decimalsForUnit(unit);
  var fixed=Number(value).toFixed(decimals);
  return decimals?fixed.replace(/\.?0+$/,''):fixed;
}

function geometricIndex(node,cx,cy){
  var x=Number(node.getAttribute('x'));
  var y=Number(node.getAttribute('y'));
  if(!Number.isFinite(x)||!Number.isFinite(y))return null;
  var degree=Math.atan2(y-cy,x-cx)*180/Math.PI;
  var clockwiseFromNorth=((degree+90)%360+360)%360;
  return((Math.round(clockwiseFromNorth/10)%36)+36)%36;
}

function setOpeningDefaults(){
  if(openingDefaultsApplied)return true;
  var panel=locatePanel();
  if(!panel||!panel.value||!panel.find||!panel.increment)return false;
  panel.value.value='1';
  panel.find.value='1';
  panel.increment.value='1';
  panel.value.setAttribute('value','1');
  panel.find.setAttribute('value','1');
  panel.increment.setAttribute('value','1');
  panel.value.dataset.v45OpeningDefault='1';
  panel.find.dataset.v45OpeningDefault='1';
  panel.increment.dataset.v45OpeningDefault='1';
  panel.doc.documentElement.dataset.openingDefaultsV45='true';
  openingDefaultsApplied=true;
  return true;
}

function expectedState(panel,wheel){
  var inputValue=parseNumber(panel.value,1);
  var absolute=Math.abs(inputValue);
  if(!Number.isFinite(absolute)||absolute===0)absolute=1;
  var unit=absolute<1?0.001:1;
  var selectedTick=Math.max(1,Math.ceil((absolute-(unit*1e-9))/unit));
  var cycleStart=(Math.floor((selectedTick-1)/36)*36)+1;
  var increment=parseNumber(panel.increment,1);
  if(!Number.isFinite(increment)||increment===0)increment=1;
  var clockwise=wheel.doc.documentElement.getAttribute('data-layout-clockwise')!=='false';
  return{inputValue:inputValue,unit:unit,selectedTick:selectedTick,cycleStart:cycleStart,increment:increment,clockwise:clockwise};
}

function expectedForNode(node,groupIndex,state,wheel){
  var index=geometricIndex(node,wheel.cx,wheel.cy);
  if(index==null)return null;
  var logicalIndex=state.clockwise?index:(36-index)%36;
  var ringStart=state.cycleStart+(groupIndex*36);
  var ringEnd=ringStart+35;
  var tick=logicalIndex===0?ringEnd:ringStart+logicalIndex-1;
  var shown=tick*state.unit*state.increment;
  return{
    index:index,
    tick:tick,
    shown:shown,
    text:formatValue(shown,state.unit*Math.abs(state.increment)),
    color:colorClass(tick),
    ringStart:ringStart,
    ringEnd:ringEnd
  };
}

function repairValues(){
  if(applying)return false;
  var panel=locatePanel();
  var wheel=locateWheel();
  if(!panel||!panel.value||!panel.increment||!wheel)return false;
  var state=expectedState(panel,wheel);
  var changed=0;
  applying=true;
  try{
    wheel.groups.forEach(function(group,groupIndex){
      var firstExpected=null;
      Array.prototype.forEach.call(group.children,function(node){
        var expected=expectedForNode(node,groupIndex,state,wheel);
        if(!expected)return;
        if(!firstExpected)firstExpected=expected;
        if(node.textContent!==expected.text){node.textContent=expected.text;changed+=1;}
        if(node.getAttribute('data-canonical-tick')!==String(expected.tick))node.setAttribute('data-canonical-tick',String(expected.tick));
        if(node.getAttribute('data-value')!==String(expected.shown))node.setAttribute('data-value',String(expected.shown));
        node.setAttribute('data-geometric-index',String(expected.index));
        if(!node.classList.contains(expected.color)){
          node.classList.remove('number-red','number-blue','number-black');
          node.classList.add(expected.color);
        }
      });
      if(firstExpected){
        var ringStart=state.cycleStart+(groupIndex*36);
        var ringEnd=ringStart+35;
        group.setAttribute('aria-label','cycle '+(Math.floor((ringStart-1)/36)+1)+' from '+formatValue(ringStart*state.unit*state.increment,state.unit*Math.abs(state.increment))+' to '+formatValue(ringEnd*state.unit*state.increment,state.unit*Math.abs(state.increment)));
      }
    });

    var topNode=null;
    var firstClockwiseNode=null;
    Array.prototype.forEach.call(wheel.groups[0].children,function(node){
      var index=geometricIndex(node,wheel.cx,wheel.cy);
      if(index===0)topNode=node;
      if(index===1)firstClockwiseNode=node;
    });

    wheel.doc.documentElement.dataset.authoritativeValueV45='true';
    wheel.doc.documentElement.dataset.inputValue=String(state.inputValue);
    wheel.doc.documentElement.dataset.selectedTick=String(state.selectedTick);
    wheel.doc.documentElement.dataset.cycleStartTick=String(state.cycleStart);
    wheel.doc.documentElement.dataset.cycleEndTick=String(state.cycleStart+35);
    wheel.doc.documentElement.dataset.v45LastRepairCount=String(changed);

    if(wheel.doc.defaultView){
      wheel.doc.defaultView.__auditKawkabatAuthoritativeValueV45=function(){
        var expectedTop=(state.cycleStart+35)*state.unit*state.increment;
        var expectedFirst=state.cycleStart*state.unit*state.increment;
        return{
          ok:!!topNode&&!!firstClockwiseNode&&topNode.textContent===formatValue(expectedTop,state.unit*Math.abs(state.increment))&&firstClockwiseNode.textContent===formatValue(expectedFirst,state.unit*Math.abs(state.increment)),
          sourceVersion:'V40',
          inputValue:state.inputValue,
          openingDefaults:{value:panel.value.value,find:panel.find?panel.find.value:null,increment:panel.increment.value},
          firstCycleRange:[state.cycleStart,state.cycleStart+35],
          northValue:topNode?topNode.textContent:null,
          firstClockwiseValue:firstClockwiseNode?firstClockwiseNode.textContent:null,
          expectedForValue1:state.inputValue===1?{north:36,firstClockwise:1,range:[1,36]}:null,
          overwriteProtection:'mutation-observer-plus-periodic-authority-check',
          repairedNodesLastPass:changed,
          displayGeometryChanged:false,
          viewBoxChanged:false,
          iframeStructureChanged:false,
          ornateFrameChanged:false,
          angleBandChanged:false,
          zodiacChanged:false
        };
      };
    }
  }finally{
    applying=false;
  }
  return true;
}

function scheduleRepair(){
  if(applyTimer)clearTimeout(applyTimer);
  applyTimer=setTimeout(function(){applyTimer=null;repairValues();},20);
}

function bindControls(){
  var panel=locatePanel();
  if(!panel||!panel.value||!panel.increment)return false;
  if(boundValue!==panel.value){
    boundValue=panel.value;
    ['input','change','keyup','blur'].forEach(function(type){panel.value.addEventListener(type,scheduleRepair);});
  }
  if(boundIncrement!==panel.increment){
    boundIncrement=panel.increment;
    ['input','change','keyup','blur'].forEach(function(type){panel.increment.addEventListener(type,scheduleRepair);});
  }
  return true;
}

function bindObserver(){
  var wheel=locateWheel();
  if(!wheel)return false;
  if(observer)observer.disconnect();
  observer=new MutationObserver(function(){if(!applying)scheduleRepair();});
  wheel.groups.forEach(function(group){observer.observe(group,{subtree:true,childList:true,characterData:true});});
  return true;
}

function startAuthority(){
  if(repairTimer)clearInterval(repairTimer);
  var observerBound=false;
  var attempts=0;
  repairTimer=setInterval(function(){
    attempts+=1;
    setOpeningDefaults();
    bindControls();
    if(!observerBound)observerBound=bindObserver();
    repairValues();
    if(attempts>=7200){clearInterval(repairTimer);repairTimer=null;}
  },100);
}

window.addEventListener('message',function(event){
  var data=event.data;
  if(data&&data.type==='KAWKABAT_CLOCKWISE_APPLIED')scheduleRepair();
});
frame.addEventListener('load',function(){openingDefaultsApplied=false;startAuthority();});

fetch(V40_SOURCE,{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('V40_SOURCE_HTTP_'+response.status);return response.text();})
  .then(function(html){
    var match=html.match(/<script>([\s\S]*?)<\/script>/i);
    if(!match)throw new Error('V40_SCRIPT_NOT_FOUND');
    var script=document.createElement('script');
    script.textContent=match[1];
    document.body.appendChild(script);
    document.documentElement.dataset.v40OrnateRuntimeLoaded='true';
    startAuthority();
  })
  .catch(function(error){
    document.documentElement.dataset.v40OrnateRuntimeLoaded='false';
    document.documentElement.dataset.v45LoadError=String(error&&error.message||error);
    startAuthority();
  });
}());
</script>
</body>
</html>
