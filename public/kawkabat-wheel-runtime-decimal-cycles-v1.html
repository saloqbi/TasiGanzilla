<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Fixed Ordinal Cycles V6</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#F7F1E3}body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">جارٍ تثبيت مواضع الدورات ووظيفة الساعة…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';
    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('RUNTIME_SOURCE_HTTP_'+response.status);
      var html=await response.text();

      var paramsAnchor="var params=new URLSearchParams(String(location.hash||'').replace(/^#/,''));";
      var paramsPatch="window.addEventListener('hashchange',function(){window.location.reload();},{once:true});\n  "+paramsAnchor;
      if(html.indexOf(paramsAnchor)<0)throw new Error('PARAMS_ANCHOR_NOT_FOUND');
      html=html.replace(paramsAnchor,paramsPatch);

      var decimalAnchor="var valueDecimals=Math.min(8,Math.max(decimalPlaces(startValue),decimalPlaces(incrementValue)));";
      var decimalPatch=
        "var referenceValue=startValue;\n  "+
        "var priceStep=incrementValue*0.01;\n  "+
        "var valueDecimals=2;\n  "+
        "function ordinalPrice(ordinal){return ordinal*priceStep;}";
      if(html.indexOf(decimalAnchor)<0)throw new Error('DECIMAL_ANCHOR_NOT_FOUND');
      html=html.replace(decimalAnchor,decimalPatch);
      html=html.split('startValue+(offset*incrementValue)').join('ordinalPrice(ordinal)');
      html=html.split('startValue+((ordinal-1)*incrementValue)').join('ordinalPrice(ordinal)');
      html=html.replace("document.documentElement.dataset.startValue=String(startValue);","document.documentElement.dataset.startValue=String(referenceValue);document.documentElement.dataset.sequenceAnchor='ordinal-1';");
      html=html.replace("document.documentElement.dataset.incrementValue=String(incrementValue);","document.documentElement.dataset.incrementValue=String(incrementValue);document.documentElement.dataset.priceStep=String(priceStep);");
      html=html.replace("startValue:startValue,increment:incrementValue,lastOrdinal:","startValue:referenceValue,increment:incrementValue,priceStep:priceStep,sequenceAnchored:true,firstCycleStart:ordinalPrice(1),firstCycleEnd:ordinalPrice(divisionCount),secondCycleStart:ordinalPrice(divisionCount+1),secondCycleEnd:ordinalPrice(divisionCount*2),lastOrdinal:");

      html=html.replace('</style>',
        '#centerClockToggle{cursor:pointer;pointer-events:none}'+
        '#centerClockFace{display:none;pointer-events:none}'+
        '#centerClockFace .clock-face{fill:#f6ead0;stroke:#7b3b10;stroke-width:8}'+
        '#centerClockFace .clock-rim{fill:none;stroke:#d99b3b;stroke-width:11}'+
        '#centerClockFace .clock-inner{fill:none;stroke:#54270d;stroke-width:3}'+
        '#centerClockFace text{font-family:Arial,Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#15100c;font-weight:800;direction:ltr;unicode-bidi:bidi-override;paint-order:stroke fill;stroke:#f6ead0;stroke-width:1}'+
        '#centerClockFace .clock-date{font-size:25px;letter-spacing:2px}'+
        '#centerClockFace .clock-line{font-size:30px}'+
        '#centerClockFace .clock-footer{font-size:17px;fill:#5b391e}'+
        '</style>');

      var centerToggleCode = String.raw`
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var wheel=document.getElementById('wheel');
  var logo=document.getElementById('logoImage');
  if(!wheel||!logo||document.getElementById('centerClockToggle'))return;
  function node(name,attrs,text){var el=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(function(key){el.setAttribute(key,attrs[key]);});if(text!==undefined)el.textContent=text;return el;}
  function root(value){var n=Math.abs(Math.trunc(Number(value)||0));while(n>9)n=String(n).split('').reduce(function(sum,digit){return sum+Number(digit);},0);return n;}
  function pad(value){return String(value).padStart(2,'0');}
  var layer=node('g',{id:'centerClockToggle','aria-label':'تبديل الشعار والساعة'});
  var face=node('g',{id:'centerClockFace'});
  face.appendChild(node('circle',{cx:2200,cy:1800,r:179,'class':'clock-face'}));
  face.appendChild(node('circle',{cx:2200,cy:1800,r:168,'class':'clock-rim'}));
  face.appendChild(node('circle',{cx:2200,cy:1800,r:157,'class':'clock-inner'}));
  var dateText=node('text',{x:2200,y:1695,'class':'clock-date'},'');
  var angleText=node('text',{x:2200,y:1758,'class':'clock-line'},'');
  var localText=node('text',{x:2200,y:1818,'class':'clock-line'},'');
  var utcText=node('text',{x:2200,y:1878,'class':'clock-line'},'');
  var footerText=node('text',{x:2200,y:1933,'class':'clock-footer'},'كوكبة الأرقام السحرية');
  face.appendChild(dateText);face.appendChild(angleText);face.appendChild(localText);face.appendChild(utcText);face.appendChild(footerText);
  layer.appendChild(face);wheel.appendChild(layer);
  var showingClock=false;
  function update(){var now=new Date();var hour=now.getHours()%12;var angle=Math.round((hour*30)+(now.getMinutes()*0.5)+(now.getSeconds()/120));dateText.textContent=pad(now.getDate())+' - '+pad(now.getMonth()+1)+' - '+now.getFullYear();angleText.textContent=angle+'° = '+root(angle);var local=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());localText.textContent=local+' = '+root(Number(local.replace(/:/g,'')));var utc=pad(now.getUTCHours())+':'+pad(now.getUTCMinutes())+':'+pad(now.getUTCSeconds());utcText.textContent=utc+' = '+root(Number(utc.replace(/:/g,'')));}
  function apply(){face.style.display=showingClock?'inline':'none';logo.style.display=showingClock?'none':'inline';if(showingClock)update();}
  function pointInCenter(event){var matrix=wheel.getScreenCTM();if(!matrix)return false;var point=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());var dx=point.x-2200,dy=point.y-1800;return(dx*dx+dy*dy)<=179*179;}
  function captureCenter(event){if(!pointInCenter(event))return;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();showingClock=!showingClock;apply();}
  wheel.addEventListener('click',captureCenter,true);
  wheel.addEventListener('pointerup',function(event){if(pointInCenter(event)){event.preventDefault();event.stopPropagation();}},true);
  wheel.addEventListener('mousedown',function(event){if(pointInCenter(event)){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();}},true);
  wheel.addEventListener('pointerdown',function(event){if(pointInCenter(event)){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();}},true);
  window.setInterval(function(){if(showingClock)update();},1000);
  apply();
  window.__auditCenterLogoClockToggleV2=function(){return{ok:true,showingClock:showingClock,captureHitTesting:true,logoVisible:logo.style.display!=='none',clockVisible:face.style.display!=='none'};};
}());
<\/script>`;
      html=html.replace('</body>',centerToggleCode+'</body>');
      document.open();document.write(html);document.close();
    }catch(error){document.body.innerHTML='<div class="loading">تعذر تثبيت مواضع الدورات ووظيفة الساعة: '+String(error.message||error)+'</div>';}
  }());
  </script>
</body>
</html>
