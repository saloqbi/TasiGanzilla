<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Fixed Cycles + Center Clock V7</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#F7F1E3}body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">جارٍ تشغيل العجلة ووظيفة الساعة…</div>
  <script>
  (async function(){
    'use strict';
    var sourceUrl='https://raw.githubusercontent.com/saloqbi/TasiGanzilla/0e1aa64595feccc46ddc92fb44a9b34633e35cec/public/kawkabat-wheel-runtime-final.html';
    try{
      var response=await fetch(sourceUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('RUNTIME_SOURCE_HTTP_'+response.status);
      var html=await response.text();

      var paramsAnchor="var params=new URLSearchParams(String(location.hash||'').replace(/^#/,''));";
      if(html.indexOf(paramsAnchor)<0)throw new Error('PARAMS_ANCHOR_NOT_FOUND');
      html=html.replace(paramsAnchor,"window.addEventListener('hashchange',function(){window.location.reload();},{once:true});\n  "+paramsAnchor);

      var decimalAnchor="var valueDecimals=Math.min(8,Math.max(decimalPlaces(startValue),decimalPlaces(incrementValue)));";
      var decimalPatch="var referenceValue=startValue;\n  var priceStep=incrementValue*0.01;\n  var valueDecimals=2;\n  function ordinalPrice(ordinal){return ordinal*priceStep;}";
      if(html.indexOf(decimalAnchor)<0)throw new Error('DECIMAL_ANCHOR_NOT_FOUND');
      html=html.replace(decimalAnchor,decimalPatch);
      html=html.split('startValue+(offset*incrementValue)').join('ordinalPrice(ordinal)');
      html=html.split('startValue+((ordinal-1)*incrementValue)').join('ordinalPrice(ordinal)');
      html=html.replace("document.documentElement.dataset.startValue=String(startValue);","document.documentElement.dataset.startValue=String(referenceValue);document.documentElement.dataset.sequenceAnchor='ordinal-1';");
      html=html.replace("document.documentElement.dataset.incrementValue=String(incrementValue);","document.documentElement.dataset.incrementValue=String(incrementValue);document.documentElement.dataset.priceStep=String(priceStep);");
      html=html.replace("startValue:startValue,increment:incrementValue,lastOrdinal:","startValue:referenceValue,increment:incrementValue,priceStep:priceStep,sequenceAnchored:true,firstCycleStart:ordinalPrice(1),firstCycleEnd:ordinalPrice(divisionCount),secondCycleStart:ordinalPrice(divisionCount+1),secondCycleEnd:ordinalPrice(divisionCount*2),lastOrdinal:");

      html=html.replace('</style>',
        '#centerClockFace{display:none;pointer-events:none}'+
        '#centerClockFace .clock-face{fill:#f6ead0;stroke:#7b3b10;stroke-width:8}'+
        '#centerClockFace .clock-rim{fill:none;stroke:#d99b3b;stroke-width:11}'+
        '#centerClockFace .clock-inner{fill:none;stroke:#54270d;stroke-width:3}'+
        '#centerClockFace text{font-family:Arial,Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#15100c;font-weight:800;direction:ltr;unicode-bidi:bidi-override;paint-order:stroke fill;stroke:#f6ead0;stroke-width:1}'+
        '#centerClockFace .clock-date{font-size:25px;letter-spacing:2px}'+
        '#centerClockFace .clock-line{font-size:30px}'+
        '#centerClockFace .clock-footer{font-size:17px;fill:#5b391e}'+
        '#centerInteractionCursor{fill:transparent;pointer-events:all;cursor:pointer}'+
        '</style>');

      var runtimeMarker='window.__auditKawkabatDirectRuntimeV1=function(){';
      if(html.indexOf(runtimeMarker)<0)throw new Error('CENTER_RUNTIME_MARKER_NOT_FOUND');
      var centerRuntime=`
  var centerLogo=document.getElementById('logoImage');
  var centerClockFace=null;
  var centerShowingClock=false;
  var centerInterval=0;
  function centerNode(name,attrs,text){var el=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(function(key){el.setAttribute(key,attrs[key]);});if(text!==undefined)el.textContent=text;return el;}
  function centerRoot(value){var n=Math.abs(Math.trunc(Number(value)||0));while(n>9)n=String(n).split('').reduce(function(sum,digit){return sum+Number(digit);},0);return n;}
  function centerPad(value){return String(value).padStart(2,'0');}
  function centerInstall(){
    if(!wheelNode||!centerLogo||document.getElementById('centerClockFace'))return false;
    centerClockFace=centerNode('g',{id:'centerClockFace','aria-hidden':'true'});
    centerClockFace.appendChild(centerNode('circle',{cx:2200,cy:1800,r:179,'class':'clock-face'}));
    centerClockFace.appendChild(centerNode('circle',{cx:2200,cy:1800,r:168,'class':'clock-rim'}));
    centerClockFace.appendChild(centerNode('circle',{cx:2200,cy:1800,r:157,'class':'clock-inner'}));
    centerClockFace.appendChild(centerNode('text',{id:'centerClockDate',x:2200,y:1695,'class':'clock-date'},''));
    centerClockFace.appendChild(centerNode('text',{id:'centerClockAngle',x:2200,y:1758,'class':'clock-line'},''));
    centerClockFace.appendChild(centerNode('text',{id:'centerClockLocal',x:2200,y:1818,'class':'clock-line'},''));
    centerClockFace.appendChild(centerNode('text',{id:'centerClockUtc',x:2200,y:1878,'class':'clock-line'},''));
    centerClockFace.appendChild(centerNode('text',{x:2200,y:1933,'class':'clock-footer'},'كوكبة الأرقام السحرية'));
    wheelNode.appendChild(centerClockFace);
    wheelNode.appendChild(centerNode('circle',{id:'centerInteractionCursor',cx:2200,cy:1800,r:179,'aria-label':'تبديل الشعار والساعة',role:'button',tabindex:'0'}));
    centerApply();
    centerInterval=window.setInterval(function(){if(centerShowingClock)centerUpdate();},1000);
    return true;
  }
  function centerUpdate(){
    if(!centerClockFace)return;
    var now=new Date(),hour=now.getHours()%12;
    var angle=Math.round((hour*30)+(now.getMinutes()*0.5)+(now.getSeconds()/120));
    var local=centerPad(now.getHours())+':'+centerPad(now.getMinutes())+':'+centerPad(now.getSeconds());
    var utc=centerPad(now.getUTCHours())+':'+centerPad(now.getUTCMinutes())+':'+centerPad(now.getUTCSeconds());
    document.getElementById('centerClockDate').textContent=centerPad(now.getDate())+' - '+centerPad(now.getMonth()+1)+' - '+now.getFullYear();
    document.getElementById('centerClockAngle').textContent=angle+'° = '+centerRoot(angle);
    document.getElementById('centerClockLocal').textContent=local+' = '+centerRoot(Number(local.replace(/:/g,'')));
    document.getElementById('centerClockUtc').textContent=utc+' = '+centerRoot(Number(utc.replace(/:/g,'')));
  }
  function centerApply(){
    if(!centerClockFace||!centerLogo)return;
    centerClockFace.style.display=centerShowingClock?'inline':'none';
    centerLogo.style.display=centerShowingClock?'none':'inline';
    centerClockFace.setAttribute('aria-hidden',centerShowingClock?'false':'true');
    if(centerShowingClock)centerUpdate();
  }
  function centerToggle(event){
    if(event){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();}
    centerShowingClock=!centerShowingClock;centerApply();
  }
  centerInstall();
  var centerHit=document.getElementById('centerInteractionCursor');
  if(centerHit){
    centerHit.addEventListener('pointerdown',function(event){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();},true);
    centerHit.addEventListener('mousedown',function(event){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();},true);
    centerHit.addEventListener('click',centerToggle,true);
    centerHit.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' ')centerToggle(event);},true);
  }
  window.__auditCenterLogoClockToggleV3=function(){return{ok:!!centerHit&&!!centerClockFace,showingClock:centerShowingClock,logoVisible:centerLogo&&centerLogo.style.display!=='none',clockVisible:centerClockFace&&centerClockFace.style.display!=='none',directRuntimeInjection:true};};

`;
      html=html.replace(runtimeMarker,centerRuntime+runtimeMarker);

      document.open();document.write(html);document.close();
    }catch(error){document.body.innerHTML='<div class="loading">تعذر تشغيل العجلة ووظيفة الساعة: '+String(error.message||error)+'</div>';}
  }());
  </script>
</body>
</html>
