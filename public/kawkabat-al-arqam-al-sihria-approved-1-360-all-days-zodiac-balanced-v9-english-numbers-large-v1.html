<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — English Numbers Large V1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="Magic Numbers Constellation — English numbers"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/ebe414bddb2031cdf06308ae5da879c4818fd624/public/kawkabat-al-arqam-al-sihria-approved-1-360-all-days-zodiac-balanced-v9.html">
  </iframe>
  <script>
  (function(){
    'use strict';

    var appFrame=document.getElementById('appFrame');
    var wheelObserver=null;
    var applyTimer=null;
    var childPoll=null;

    function toEnglishDigits(value){
      var map={
        '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
        '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'
      };
      return String(value==null?'':value).replace(/[٠-٩۰-۹]/g,function(digit){return map[digit]||digit;});
    }

    function setAttributeIfNeeded(node,name,value){
      if(node.getAttribute(name)!==value)node.setAttribute(name,value);
    }

    function setStyleIfNeeded(node,name,value){
      if(node.style.getPropertyValue(name)!==value)node.style.setProperty(name,value,'important');
    }

    function formatNumberNode(node,fontSize){
      var english=toEnglishDigits(node.textContent);
      if(node.textContent!==english)node.textContent=english;
      setAttributeIfNeeded(node,'direction','ltr');
      setAttributeIfNeeded(node,'unicode-bidi','bidi-override');
      setAttributeIfNeeded(node,'lang','en');
      setStyleIfNeeded(node,'font-family','Arial, Helvetica, sans-serif');
      setStyleIfNeeded(node,'font-size',fontSize);
      setStyleIfNeeded(node,'font-variant-numeric','lining-nums tabular-nums');
      setStyleIfNeeded(node,'letter-spacing','0px');
    }

    function applyEnglishPresentation(){
      try{
        var appDoc=appFrame.contentDocument;
        if(!appDoc)return false;

        var sizeInput=appDoc.querySelector('input[aria-label="Size"]');
        if(sizeInput){
          sizeInput.setAttribute('lang','en-US');
          sizeInput.setAttribute('dir','ltr');
          sizeInput.style.fontFamily='Arial, Helvetica, sans-serif';
          sizeInput.style.fontSize='17px';
          sizeInput.style.fontVariantNumeric='lining-nums tabular-nums';
        }

        var workFrame=appDoc.getElementById('workFrame');
        var wheelDoc=workFrame&&workFrame.contentDocument;
        if(!wheelDoc||!wheelDoc.getElementById('wheel'))return false;

        wheelDoc.querySelectorAll('#dynamicApprovedCycles .number-text').forEach(function(node){
          formatNumberNode(node,'26px');
        });
        wheelDoc.querySelectorAll('#numbersRingOne .number-text').forEach(function(node){
          formatNumberNode(node,'26px');
        });
        wheelDoc.querySelectorAll('#numbersRingTwo .number-text').forEach(function(node){
          formatNumberNode(node,'31px');
        });

        wheelDoc.documentElement.setAttribute('data-number-script','latin');
        wheelDoc.documentElement.setAttribute('data-number-presentation','english-large-v1');

        if(!wheelObserver||wheelObserver.__wheelDocument!==wheelDoc){
          if(wheelObserver)wheelObserver.disconnect();
          wheelObserver=new MutationObserver(scheduleApply);
          wheelObserver.__wheelDocument=wheelDoc;
          wheelObserver.observe(wheelDoc.getElementById('wheel'),{childList:true,subtree:true});
        }

        if(wheelDoc.defaultView){
          wheelDoc.defaultView.__auditKawkabatEnglishNumbersLargeV1=function(){
            var nodes=wheelDoc.querySelectorAll('#dynamicApprovedCycles .number-text,#numbersRingOne .number-text,#numbersRingTwo .number-text');
            var latin=true;
            nodes.forEach(function(node){if(/[٠-٩۰-۹]/.test(node.textContent))latin=false;});
            return{
              ok:latin&&nodes.length>0,
              latinDigitsOnly:latin,
              formattedNumberCount:nodes.length,
              dynamicFontSize:26,
              ringOneFontSize:26,
              ringTwoFontSize:31,
              geometryChanged:false
            };
          };
        }
        return true;
      }catch(error){
        return false;
      }
    }

    function scheduleApply(){
      if(applyTimer)clearTimeout(applyTimer);
      applyTimer=setTimeout(function(){applyTimer=null;applyEnglishPresentation();},30);
    }

    function startPolling(){
      if(childPoll)clearInterval(childPoll);
      var attempts=0;
      childPoll=setInterval(function(){
        attempts+=1;
        if(applyEnglishPresentation()||attempts>=300){
          clearInterval(childPoll);
          childPoll=null;
        }
      },100);
    }

    appFrame.addEventListener('load',startPolling);
    startPolling();
  }());
  </script>
</body>
</html>
