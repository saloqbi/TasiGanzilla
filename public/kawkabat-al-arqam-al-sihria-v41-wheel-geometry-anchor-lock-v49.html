<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — V41 Wheel Geometry Anchor Lock V49</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/05f68f1bb9eda171517c7180ba659ba89b6200e1/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornate-frame-angle-ticks-inner-copper-boundary-v41.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;
var boundDoc=null;
var correcting=false;
var stablePasses=0;

function locateWheelDocument(doc,depth){
  if(!doc||depth>120)return null;
  try{if(doc.getElementById('wheel'))return doc;}catch(error){}
  var frames=[];
  try{frames=doc.querySelectorAll('iframe');}catch(error){return null;}
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=locateWheelDocument(frames[i].contentDocument,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function viewportWidth(doc){
  var win=doc.defaultView;
  return Math.max(1,(win&&win.innerWidth)||doc.documentElement.clientWidth||(doc.body&&doc.body.clientWidth)||1);
}

function currentX(doc){
  var win=doc.defaultView;
  if(win&&Number.isFinite(win.scrollX))return win.scrollX;
  if(win&&Number.isFinite(win.pageXOffset))return win.pageXOffset;
  return Number(doc.documentElement.scrollLeft||(doc.body&&doc.body.scrollLeft)||0);
}

function currentY(doc){
  var win=doc.defaultView;
  if(win&&Number.isFinite(win.scrollY))return win.scrollY;
  if(win&&Number.isFinite(win.pageYOffset))return win.pageYOffset;
  return Number(doc.documentElement.scrollTop||(doc.body&&doc.body.scrollTop)||0);
}

function geometryTarget(doc,wheel){
  var rect=wheel.getBoundingClientRect();
  var target=currentX(doc)+rect.left+(rect.width/2)-(viewportWidth(doc)/2);
  var de=doc.documentElement;
  var body=doc.body;
  var maxScroll=Math.max(0,Math.max(de.scrollWidth||0,body?body.scrollWidth:0)-viewportWidth(doc));
  return{
    left:Math.max(0,Math.min(maxScroll,target)),
    top:0,
    wheelCenterViewportX:rect.left+(rect.width/2),
    viewportCenterX:viewportWidth(doc)/2,
    maxScroll:maxScroll
  };
}

function writeScroll(doc,left,top){
  var win=doc.defaultView;
  try{win.scrollTo({left:left,top:top,behavior:'auto'});}catch(error){try{win.scrollTo(left,top);}catch(ignored){}}
  try{doc.documentElement.scrollLeft=left;doc.documentElement.scrollTop=top;}catch(error){}
  try{if(doc.body){doc.body.scrollLeft=left;doc.body.scrollTop=top;}}catch(error){}
}

function enforceWheelAnchor(doc){
  if(!doc||correcting)return false;
  var wheel=doc.getElementById('wheel');
  if(!wheel)return false;
  correcting=true;
  try{
    try{wheel.scrollIntoView({block:'start',inline:'center',behavior:'auto'});}catch(error){}
    var target=geometryTarget(doc,wheel);
    writeScroll(doc,target.left,0);
    var verify=geometryTarget(doc,wheel);
    var xError=Math.abs(verify.wheelCenterViewportX-verify.viewportCenterX);
    var yError=Math.abs(currentY(doc));
    if(xError>1||yError>1){
      writeScroll(doc,currentX(doc)+(verify.wheelCenterViewportX-verify.viewportCenterX),0);
    }
    return Math.abs(geometryTarget(doc,wheel).wheelCenterViewportX-(viewportWidth(doc)/2))<=2&&Math.abs(currentY(doc))<=2;
  }catch(error){
    return false;
  }finally{
    correcting=false;
  }
}

function bind(doc){
  if(boundDoc===doc)return;
  boundDoc=doc;
  try{if(doc.defaultView.history)doc.defaultView.history.scrollRestoration='manual';}catch(error){}
  try{doc.documentElement.style.setProperty('scroll-behavior','auto','important');}catch(error){}
  var win=doc.defaultView;
  if(win){
    win.addEventListener('scroll',function(){
      if(correcting)return;
      requestAnimationFrame(function(){enforceWheelAnchor(doc);});
    },{passive:true});
    win.addEventListener('resize',function(){
      requestAnimationFrame(function(){enforceWheelAnchor(doc);});
    },{passive:true});
  }
}

function apply(){
  try{
    var root=frame.contentDocument;
    if(!root)return false;
    var doc=locateWheelDocument(root,0);
    if(!doc)return false;
    bind(doc);
    var ok=enforceWheelAnchor(doc);
    stablePasses=ok?stablePasses+1:0;
    var wheel=doc.getElementById('wheel');
    var target=wheel?geometryTarget(doc,wheel):null;
    doc.documentElement.dataset.v49WheelGeometryAnchorLocked='true';
    doc.documentElement.dataset.v49Anchor='wheel-center-x-and-document-top';
    doc.documentElement.dataset.v49ScaleChanged='false';
    doc.documentElement.dataset.v49GeometryChanged='false';
    if(doc.defaultView){
      doc.defaultView.__auditKawkabatWheelGeometryAnchorLockV49=function(){
        var liveWheel=doc.getElementById('wheel');
        var live=liveWheel?geometryTarget(doc,liveWheel):null;
        return{
          ok:!!live&&Math.abs(live.wheelCenterViewportX-live.viewportCenterX)<=2&&Math.abs(currentY(doc))<=2,
          baseVersion:'V41',
          immutableBaseCommit:'05f68f1bb9eda171517c7180ba659ba89b6200e1',
          anchor:'actual-wheel-svg-center',
          horizontalRule:'wheel-center-aligned-to-viewport-center',
          verticalRule:'document-top-zero',
          currentScrollX:currentX(doc),
          currentScrollY:currentY(doc),
          wheelCenterViewportX:live?live.wheelCenterViewportX:null,
          viewportCenterX:live?live.viewportCenterX:null,
          scalingApplied:false,
          viewportOverrideApplied:false,
          wheelGeometryChanged:false,
          numberTextChanged:false,
          controlPanelChanged:false,
          ornateOuterFrameChanged:false,
          innerCopperBoundaryChanged:false
        };
      };
    }
    return stablePasses>=4;
  }catch(error){return false;}
}

function start(){
  if(poll)clearInterval(poll);
  stablePasses=0;
  var attempts=0;
  poll=setInterval(function(){
    attempts+=1;
    if(apply()||attempts>=3600){clearInterval(poll);poll=null;}
  },100);
}

frame.addEventListener('load',start);
window.addEventListener('resize',function(){stablePasses=0;apply();},{passive:true});
start();
}());
</script>
</body>
</html>
