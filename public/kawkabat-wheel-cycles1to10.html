<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Clockwise Active</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العجلة الأساسية…</div>
  <script>
  (async function(){
    'use strict';
    var staticWheelApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/b8cec022685d53af5a5d1c7ed3b5e99a2c25d47a';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(staticWheelApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('STATIC_WHEEL_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      html=html.replace('</style>',
        '.cycle-number{font-size:24px!important;pointer-events:none!important}'+
        '.outer-text-label{font-family:Arial,Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central;direction:rtl;unicode-bidi:plaintext;pointer-events:none;paint-order:stroke fill;stroke:#F7F1E3;stroke-width:1.15;stroke-opacity:.92;vector-effect:non-scaling-stroke}'+
        '.calendar-day-label{font-size:22px;font-weight:900}'+
        '.zodiac-element-label{font-size:20px;font-weight:800}'+
        'html,body{overflow:auto!important;scrollbar-width:auto!important;-ms-overflow-style:auto!important;overscroll-behavior:none!important;scroll-behavior:auto!important}'+
        'html::-webkit-scrollbar,body::-webkit-scrollbar{display:block!important;width:14px!important;height:14px!important}'+
        'html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:#e8e3d8!important}'+
        'html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:#7d898f!important;border:2px solid #e8e3d8!important;border-radius:999px!important}'+
        'html,body,svg{cursor:grab!important;touch-action:none!important}'+
        'html.wheel-pan-dragging,html.wheel-pan-dragging body,html.wheel-pan-dragging svg{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}'+
        '</style>');

      var runtime=
        "var wheelNode=document.getElementById('wheel'),angleFrameNode=document.getElementById('angleFrame'),cycleGroups=[];"+
        "function ensureCycleGroup(id,label){var group=document.getElementById(id);if(!group){group=document.createElementNS(NS,'g');group.id=id;group.setAttribute('aria-label',label);if(angleFrameNode&&angleFrameNode.parentNode===wheelNode)wheelNode.insertBefore(group,angleFrameNode);else wheelNode.appendChild(group);}while(group.firstChild)group.removeChild(group.firstChild);return group;}"+
        "function renderCycle(group,wheel,cycle,start,end,radius){for(var index=0;index<36;index+=1){var value=index===0?end:start+index-1;addNumber(group,value,index*10-90,radius,'cycle-number',index%9===0);var node=group.lastElementChild;node.setAttribute('data-wheel',wheel);node.setAttribute('data-cycle',cycle);node.setAttribute('data-value',value);}}"+
        "for(var cycle=1;cycle<=10;cycle+=1){var wheel=cycle+2,start=((cycle-1)*36)+1,end=cycle*36,radius=455+((cycle-1)*110),id='numbersCycle'+cycle,label='الدورة رقم '+cycle+' من '+start+' إلى '+end+' على العجلة رقم '+wheel,group=ensureCycleGroup(id,label);renderCycle(group,wheel,cycle,start,end,radius);cycleGroups.push(group);}"+
        "var dayNames=['الجمعة','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];"+
        "var zodiacElements=['ماء الحوت','نار الحمل','تراب الثور','هواء الجوزاء','ماء السرطان','نار الأسد','تراب السنبلة','هواء الميزان','ماء العقرب','نار القوس','تراب الجدي','هواء الدلو'];"+
        "function ensureOuterTextGroup(id,label){var group=document.getElementById(id);if(!group){group=document.createElementNS(NS,'g');group.id=id;group.setAttribute('aria-label',label);if(angleFrameNode&&angleFrameNode.parentNode===wheelNode)wheelNode.insertBefore(group,angleFrameNode);else wheelNode.appendChild(group);}while(group.firstChild)group.removeChild(group.firstChild);return group;}"+
        "function addOuterText(group,textValue,cellValue,degree,radius,className){var p=polar(radius,degree-90),node=document.createElementNS(NS,'text'),rotation=degree;if(degree>90&&degree<270)rotation+=180;node.setAttribute('x',p.x);node.setAttribute('y',p.y);node.setAttribute('class','outer-text-label '+className+' '+colorClass(cellValue));node.setAttribute('transform','rotate('+rotation+' '+p.x+' '+p.y+')');node.setAttribute('lang','ar');node.setAttribute('data-cell',cellValue);node.textContent=textValue;group.appendChild(node);}"+
        "var daysRing=ensureOuterTextGroup('calendarDaysRing','الأيام في أعلى خلايا الحلقة الخارجية');"+
        "var zodiacRing=ensureOuterTextGroup('zodiacElementsRing','الأبراج مع العناصر أسفل الأيام');"+
        "for(var outerIndex=0;outerIndex<36;outerIndex+=1){var cellValue=outerIndex===0?36:outerIndex,degree=outerIndex*10;addOuterText(daysRing,dayNames[cellValue%6],cellValue,degree,1580,'calendar-day-label');addOuterText(zodiacRing,zodiacElements[cellValue%12],cellValue,degree,1538,'zodiac-element-label');}"+
        "window.__kawkabatCycleGroupsV1=cycleGroups;window.__kawkabatDaysRingV1=daysRing;window.__kawkabatZodiacRingV1=zodiacRing;";

      var marker='window.__auditKawkabatFinalStructureV3=function(){';
      if(html.indexOf(marker)<0)throw new Error('STATIC_RUNTIME_MARKER_NOT_FOUND');
      html=html.replace(marker,runtime+marker);

      var controls='<script id="kawkabat-clockwise-bridge-v1">(function(){'+
        "'use strict';"+
        'var CX=2200,CY=1800,clockwise=true;'+
        'function polarPoint(radius,degree){var angle=degree*Math.PI/180;return{x:CX+Math.cos(angle)*radius,y:CY+Math.sin(angle)*radius};}'+
        'function positionNumbers(group,radius){if(!group)return;Array.prototype.forEach.call(group.children,function(node,index){var angle=(clockwise?index*10:-index*10)-90,point=polarPoint(radius,angle);node.setAttribute("x",point.x);node.setAttribute("y",point.y);});}'+
        'function positionLabels(group,radius){if(!group)return;Array.prototype.forEach.call(group.children,function(node,index){var degree=clockwise?index*10:-index*10,normalized=((degree%360)+360)%360,point=polarPoint(radius,degree-90),rotation=normalized;if(normalized>90&&normalized<270)rotation+=180;node.setAttribute("x",point.x);node.setAttribute("y",point.y);node.setAttribute("transform","rotate("+rotation+" "+point.x+" "+point.y+")");});}'+
        'function apply(value){clockwise=value!==false;var groups=window.__kawkabatCycleGroupsV1||[];for(var cycle=0;cycle<groups.length;cycle+=1)positionNumbers(groups[cycle],455+(cycle*110));positionLabels(window.__kawkabatDaysRingV1,1580);positionLabels(window.__kawkabatZodiacRingV1,1538);document.documentElement.dataset.clockwise=clockwise?"true":"false";try{parent.postMessage({type:"KAWKABAT_CLOCKWISE_STATE",clockwise:clockwise},"*");}catch(error){}}'+
        'window.addEventListener("message",function(event){var data=event.data||{};if(data.type==="KAWKABAT_SET_CLOCKWISE")apply(!!data.clockwise);});'+
        'window.__setKawkabatClockwiseV1=apply;apply(true);'+
        'try{parent.postMessage({type:"KAWKABAT_WHEEL_READY",capability:"clockwise"},"*");}catch(error){}'+
      '}());'+closeTag;

      var pan='<script id="wheel-pan-controls-v1">(function(){'+
        "'use strict';"+
        'var dragging=false,moved=false,startX=0,startY=0,startScrollX=0,startScrollY=0;'+
        'function scroller(){return document.scrollingElement||document.documentElement;}'+
        'document.addEventListener("mousedown",function(event){if(event.button!==0)return;var root=scroller();dragging=true;moved=false;startX=event.clientX;startY=event.clientY;startScrollX=root.scrollLeft;startScrollY=root.scrollTop;},true);'+
        'window.addEventListener("mousemove",function(event){if(!dragging)return;var dx=event.clientX-startX,dy=event.clientY-startY;if(!moved&&Math.hypot(dx,dy)>=3)moved=true;if(!moved)return;event.preventDefault();document.documentElement.classList.add("wheel-pan-dragging");var root=scroller();root.scrollLeft=startScrollX-dx;root.scrollTop=startScrollY-dy;},{capture:true,passive:false});'+
        'window.addEventListener("mouseup",function(){dragging=false;document.documentElement.classList.remove("wheel-pan-dragging");},true);'+
      '}());'+closeTag;

      html=html.replace('</body>',controls+pan+'</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل العجلة: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
