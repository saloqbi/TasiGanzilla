<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كوكبة الأرقام السحرية V131 — تصحيح تسلسل 1–36 هندسيًا حسب زاوية الخلية</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}
    #v131-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe
    id="v131-frame"
    title="كوكبة الأرقام السحرية"
    src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/88ea4d9e5bcb60f5b55ecaf10f06efd191556648/public/kawkabat-al-arqam-al-sihria-v87-gold-motifs-inside-black-band.html">
  </iframe>

  <script>
  (function () {
    'use strict';

    var DIVISIONS = 36;
    var MAJOR_CYCLE_TICKS = 360;
    var DEFAULT_OUTER_CYCLES = 10;
    var RING_0_ARABIC_FONT_SIZE = '36px';
    var OUTER_RINGS_1_2_ARABIC_FONT_SIZE = '46px';
    var OUTER_RINGS_3_4_ARABIC_FONT_SIZE = '50px';
    var OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE = '54px';

    var frame = document.getElementById('v131-frame');
    var controlDocument = null;
    var wheelDocument = null;
    var wheelObserver = null;
    var pendingApply = false;

    var findInput = null;
    var valueInput = null;
    var incrementInput = null;
    var actualSizeInput = null;
    var visibleSizeInput = null;
    var findAction = null;
    var highlightVisibleInput = null;
    var highlightFillSelect = null;
    var highlightShowNumbersInput = null;
    var highlightShowMarksInput = null;

    var defaultsApplied = false;
    var lastTarget = null;
    var lastAnchor = null;
    var lastFound = false;
    var findInputTimer = null;
    var arabicDigits = '٠١٢٣٤٥٦٧٨٩';

    function visitDocuments(doc, callback, depth) {
      if (!doc || depth > 240) return null;
      var result = callback(doc);
      if (result) return result;

      var frames = doc.querySelectorAll('iframe');
      for (var index = 0; index < frames.length; index += 1) {
        try {
          var found = visitDocuments(
            frames[index].contentDocument,
            callback,
            depth + 1
          );
          if (found) return found;
        } catch (error) {}
      }
      return null;
    }

    function discoverDocuments() {
      try {
        var root = frame.contentDocument;

        controlDocument = visitDocuments(root, function (doc) {
          return doc.querySelector('input[aria-label="Find"]') &&
            doc.querySelector('input[aria-label="Value"]') &&
            doc.querySelector('input[aria-label="Increment"]') &&
            doc.querySelector('input[aria-label="Size"]')
            ? doc
            : null;
        }, 0);

        wheelDocument = visitDocuments(root, function (doc) {
          return doc.getElementById('wheel') &&
            doc.querySelector('.approved-cycle-number') &&
            doc.documentElement.dataset.v50LiveLanguage
            ? doc
            : null;
        }, 0);

        return !!(controlDocument && wheelDocument);
      } catch (error) {
        return false;
      }
    }

    function normalizeDigits(value) {
      var map = {
        '٠':'0','١':'1','٢':'2','٣':'3','٤':'4',
        '٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
        '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4',
        '۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'
      };
      return String(value).replace(/[٠-٩۰-۹]/g, function (digit) {
        return map[digit] || digit;
      }).replace(/,/g, '').trim();
    }

    function parseFiniteNumber(value) {
      var number = Number(normalizeDigits(value));
      return Number.isFinite(number) ? number : null;
    }

    function clampOuterCycles(value) {
      var number = Math.round(Number(value));
      if (!Number.isFinite(number)) number = DEFAULT_OUTER_CYCLES;
      return Math.max(1, Math.min(29, number));
    }

    function dispatchControl(control) {
      control.dispatchEvent(new Event('input', { bubbles: true }));
      control.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function setupOuterCycleProxy() {
      actualSizeInput =
        controlDocument.querySelector('input[aria-label="Size"]');
      if (!actualSizeInput) return false;

      visibleSizeInput =
        controlDocument.querySelector('input[data-v131-outer-cycle-proxy="true"]');

      if (!visibleSizeInput) {
        visibleSizeInput = actualSizeInput.cloneNode(true);
        visibleSizeInput.removeAttribute('aria-label');
        visibleSizeInput.setAttribute(
          'aria-label',
          'Outer cycles after anchor'
        );
        visibleSizeInput.setAttribute(
          'data-v131-outer-cycle-proxy',
          'true'
        );
        visibleSizeInput.min = '1';
        visibleSizeInput.max = '29';
        visibleSizeInput.step = '1';
        visibleSizeInput.value = String(DEFAULT_OUTER_CYCLES);
        actualSizeInput.parentNode.insertBefore(
          visibleSizeInput,
          actualSizeInput
        );
        actualSizeInput.hidden = true;

        function syncOuterCycles() {
          var outerCycles = clampOuterCycles(visibleSizeInput.value);
          visibleSizeInput.value = String(outerCycles);
          actualSizeInput.value = String(outerCycles);
          dispatchControl(actualSizeInput);
        }

        visibleSizeInput.addEventListener('input', syncOuterCycles);
        visibleSizeInput.addEventListener('change', syncOuterCycles);
        visibleSizeInput.addEventListener('keyup', syncOuterCycles);
      }

      var initialOuterCycles =
        clampOuterCycles(visibleSizeInput.value || DEFAULT_OUTER_CYCLES);
      visibleSizeInput.value = String(initialOuterCycles);
      actualSizeInput.value = String(initialOuterCycles);
      controlDocument.documentElement.dataset.v131SizeSemantics =
        'center-zero-excluded-plus-ten-visible-cycles';
      return true;
    }

    function decimalPlaces(value) {
      var text = String(Math.abs(value));
      if (text.indexOf('e-') !== -1) {
        return Math.min(8, Number(text.split('e-')[1]) || 0);
      }
      var point = text.indexOf('.');
      return point === -1 ? 0 : Math.min(8, text.length - point - 1);
    }

    function formatValue(value, step) {
      if (!Number.isFinite(value)) return '';
      return value.toFixed(decimalPlaces(step));
    }

    function localizeDigits(value, language) {
      if (language !== 'ar') return value;
      return value.replace(/[0-9]/g, function (digit) {
        return arabicDigits.charAt(Number(digit));
      });
    }

    function positiveModulo(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function captureOriginalFont(node) {
      if (node.hasAttribute('data-v131-original-font-size')) return;
      node.setAttribute(
        'data-v131-original-font-size',
        node.style.getPropertyValue('font-size') || ''
      );
      node.setAttribute(
        'data-v131-original-font-priority',
        node.style.getPropertyPriority('font-size') || ''
      );
    }

    function restoreOriginalFont(node) {
      var size = node.getAttribute('data-v131-original-font-size') || '';
      var priority =
        node.getAttribute('data-v131-original-font-priority') || '';
      if (size) {
        node.style.setProperty('font-size', size, priority);
      } else {
        node.style.removeProperty('font-size');
      }
      node.setAttribute('data-v131-font-size', 'en-original');
    }

    function applyArabicFont(node, cycleOffset) {
      var size;
      var marker;
      if (cycleOffset === 0) {
        size = RING_0_ARABIC_FONT_SIZE;
        marker = 'ar-anchor-ring-0-36';
      } else if (cycleOffset <= 2) {
        size = OUTER_RINGS_1_2_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-1-2-46';
      } else if (cycleOffset <= 4) {
        size = OUTER_RINGS_3_4_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-3-4-50';
      } else {
        size = OUTER_RINGS_5_PLUS_ARABIC_FONT_SIZE;
        marker = 'ar-outer-rings-5-plus-54';
      }
      node.style.setProperty('font-size', size, 'important');
      node.setAttribute('data-v131-font-size', marker);
    }

    function captureSourceTick(node) {
      if (!node.hasAttribute('data-v131-source-tick')) {
        node.setAttribute(
          'data-v131-source-tick',
          node.getAttribute('data-tick') || ''
        );
      }
      return Number(node.getAttribute('data-v131-source-tick'));
    }

    function renderCycleNumberPair(
      node,
      primaryValue,
      cycleValue,
      language,
      enabled,
      ringCount
    ) {
      var localizedCycle = localizeDigits(String(cycleValue), language);
      var state = enabled
        ? 'pair|' + primaryValue + '|' + localizedCycle
        : 'primary|' + primaryValue;

      if (node.getAttribute('data-v131-number-render-state') === state) {
        return;
      }

      if (!enabled) {
        node.textContent = primaryValue;
        node.setAttribute('data-v131-number-render-state', state);
        node.removeAttribute('data-v131-cycle-angle-number');
        return;
      }

      var x = Number(node.getAttribute('x')) || 0;
      var y = Number(node.getAttribute('y')) || 0;
      var dx = x - 2200;
      var dy = y - 1800;
      var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
      var radialX = dx / radius;
      var radialY = dy / radius;
      var clockwise =
        wheelDocument.documentElement.dataset.layoutDirection !==
        'counterclockwise';
      var tangentX = clockwise ? -radialY : radialY;
      var tangentY = clockwise ? radialX : -radialX;
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var radialOffset = Math.max(10, (ringWidth / 2) - 16);
      var cornerRadius = radius + radialOffset;
      var tangentBoundary = cornerRadius * Math.tan(
        Math.PI / DIVISIONS
      );
      var tangentOffset = Math.max(8, tangentBoundary - 18);
      var secondaryX =
        x + (radialX * radialOffset) + (tangentX * tangentOffset);
      var secondaryY =
        y + (radialY * radialOffset) + (tangentY * tangentOffset);

      node.textContent = '';

      var primary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      primary.setAttribute('x', String(x));
      primary.setAttribute('y', String(y));
      primary.setAttribute('data-v131-number-role', 'primary');
      primary.textContent = primaryValue;

      var secondary = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'tspan'
      );
      secondary.setAttribute('x', secondaryX.toFixed(3));
      secondary.setAttribute('y', secondaryY.toFixed(3));
      secondary.setAttribute('data-v131-number-role', 'cycle-angle');
      secondary.style.setProperty('font-size', '15px', 'important');
      secondary.style.setProperty('font-weight', '800', 'important');
      secondary.style.setProperty('font-style', 'italic', 'important');
      secondary.style.setProperty('fill', '#784229', 'important');
      secondary.style.setProperty('stroke', '#4A291B', 'important');
      secondary.style.setProperty('stroke-width', '0.2px', 'important');
      secondary.style.setProperty(
        'paint-order',
        'stroke fill',
        'important'
      );
      secondary.style.setProperty(
        'stroke-linejoin',
        'round',
        'important'
      );
      secondary.style.setProperty('opacity', '1', 'important');
      secondary.textContent = localizedCycle;

      node.appendChild(primary);
      node.appendChild(secondary);
      node.setAttribute('data-v131-number-render-state', state);
      node.setAttribute(
        'data-v131-cycle-angle-number',
        String(cycleValue)
      );
    }

    function calculateAnchorModel(root) {
      var inputValue = Number(root.dataset.inputValue || '1');
      var unit = Number(root.dataset.canonicalUnit || '1');
      var increment = Number(root.dataset.incrementValue || '1');
      if (!Number.isFinite(inputValue) || inputValue <= 0) inputValue = 1;
      if (!Number.isFinite(unit) || unit <= 0) unit = 1;
      if (!Number.isFinite(increment) || increment === 0) increment = 1;

      var step = unit * Math.abs(increment);
      var anchorEndTick =
        Math.max(DIVISIONS, Math.ceil(inputValue / step / DIVISIONS) * DIVISIONS);
      var anchorEndValue = anchorEndTick * step;
      var anchorBaseValue = anchorEndValue - (DIVISIONS * step);

      return {
        inputValue: inputValue,
        step: step,
        anchorEndTick: anchorEndTick,
        anchorEndValue: anchorEndValue,
        anchorBaseValue: anchorBaseValue
      };
    }

    function layerNumberForOffset(cycleOffset) {
      if (cycleOffset === 0) return 0;
      return positiveModulo(cycleOffset - 1, 10) + 1;
    }

    function renderLayerMarks(
      root,
      language,
      dataType,
      ringCount,
      model
    ) {
      var existing = wheelDocument.getElementById('v131LayerMarks');
      var enabled = !!(
        highlightShowMarksInput &&
        highlightShowMarksInput.checked &&
        dataType === 'price' &&
        root.dataset.viewMode === 'circle36'
      );

      if (!enabled) {
        if (existing) existing.remove();
        root.dataset.v131LayerMarks = 'hidden';
        return;
      }

      var state = [
        language,
        ringCount,
        root.dataset.layoutDirection || 'clockwise',
        model.anchorEndTick,
        model.step
      ].join('|');

      if (
        existing &&
        existing.getAttribute('data-v131-render-state') === state
      ) {
        return;
      }
      if (existing) existing.remove();

      var cycles = wheelDocument.getElementById('dynamicApprovedCycles');
      if (!cycles) return;

      var group = wheelDocument.createElementNS(
        'http://www.w3.org/2000/svg',
        'g'
      );
      group.id = 'v131LayerMarks';
      group.setAttribute('pointer-events', 'none');
      group.setAttribute('aria-label', 'Wheel layer marks');
      group.setAttribute('data-v131-render-state', state);

      var clockwise =
        root.dataset.layoutDirection !== 'counterclockwise';
      var ringWidth = (1500 - 400) / Math.max(1, ringCount);
      var eligibleCount = 0;

      wheelDocument
        .querySelectorAll('.approved-cycle-number[data-tick]')
        .forEach(function (node) {
          var correctedTick = Number(node.getAttribute('data-tick'));
          if (
            !Number.isFinite(correctedTick) ||
            Math.abs(correctedTick - Math.round(correctedTick)) > 1e-9 ||
            positiveModulo(Math.round(correctedTick), 3) !== 0
          ) {
            return;
          }

          var cycleOffset = Number.parseInt(
            node.getAttribute('data-cycle-offset') || '0',
            10
          );
          var x = Number(node.getAttribute('x')) || 0;
          var y = Number(node.getAttribute('y')) || 0;
          var dx = x - 2200;
          var dy = y - 1800;
          var radius = Math.sqrt((dx * dx) + (dy * dy)) || 1;
          var radialX = dx / radius;
          var radialY = dy / radius;
          var tangentX = clockwise ? -radialY : radialY;
          var tangentY = clockwise ? radialX : -radialX;
          var radialOffset = Math.max(8, (ringWidth / 2) - 28);
          var cornerRadius = radius + radialOffset;
          var tangentBoundary = cornerRadius * Math.tan(
            Math.PI / DIVISIONS
          );
          var tangentOffset = Math.max(6, tangentBoundary - 18);
          var markX =
            x + (radialX * radialOffset) - (tangentX * tangentOffset);
          var markY =
            y + (radialY * radialOffset) - (tangentY * tangentOffset);
          var layerNumber = layerNumberForOffset(cycleOffset);

          var mark = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          mark.setAttribute('x', markX.toFixed(3));
          mark.setAttribute('y', markY.toFixed(3));
          mark.setAttribute('text-anchor', 'middle');
          mark.setAttribute('dominant-baseline', 'central');
          mark.setAttribute('data-v131-layer-mark', String(layerNumber));
          mark.setAttribute(
            'data-v131-source-tick',
            String(correctedTick)
          );
          mark.style.setProperty('font-family', 'Arial, sans-serif', 'important');
          mark.style.setProperty('font-size', '14px', 'important');
          mark.style.setProperty('font-weight', '800', 'important');
          mark.style.setProperty('font-style', 'normal', 'important');
          mark.style.setProperty('fill', '#6F3F68', 'important');
          mark.style.setProperty('stroke', '#3F233C', 'important');
          mark.style.setProperty('stroke-width', '0.18px', 'important');
          mark.style.setProperty('paint-order', 'stroke fill', 'important');
          mark.style.setProperty('opacity', '1', 'important');
          mark.textContent = localizeDigits(String(layerNumber), language);

          var badge = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'rect'
          );
          badge.setAttribute('x', (markX - 12).toFixed(3));
          badge.setAttribute('y', (markY - 10).toFixed(3));
          badge.setAttribute('width', '24');
          badge.setAttribute('height', '20');
          badge.setAttribute('rx', '2.5');
          badge.setAttribute('ry', '2.5');
          badge.setAttribute(
            'data-v131-layer-badge',
            String(layerNumber)
          );
          badge.style.setProperty('fill', '#EAF7F4', 'important');
          badge.style.setProperty('fill-opacity', '0.92', 'important');
          badge.style.setProperty('stroke', '#69BEB8', 'important');
          badge.style.setProperty('stroke-width', '0.9px', 'important');
          badge.style.setProperty('opacity', '1', 'important');

          var shadow = badge.cloneNode(true);
          shadow.removeAttribute('data-v131-layer-badge');
          shadow.setAttribute(
            'data-v131-layer-shadow',
            String(layerNumber)
          );
          shadow.setAttribute('x', (markX - 10.5).toFixed(3));
          shadow.setAttribute('y', (markY - 8.5).toFixed(3));
          shadow.style.setProperty('fill', '#2F625E', 'important');
          shadow.style.setProperty('fill-opacity', '0.22', 'important');
          shadow.style.setProperty('stroke', 'none', 'important');

          group.appendChild(shadow);
          group.appendChild(badge);
          group.appendChild(mark);
          eligibleCount += 1;
        });

      group.setAttribute(
        'data-v131-eligible-mark-count',
        String(eligibleCount)
      );
      cycles.appendChild(group);
      root.dataset.v131LayerMarks = 'visible';
      root.dataset.v131LayerMarkPattern =
        'black-multiples-of-3-offset-0-then-1-to-10-repeat';
    }

    function cellPositionFromGeometry(node, clockwise) {
      var x = Number(node.getAttribute('x'));
      var y = Number(node.getAttribute('y'));
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      var angle = Math.atan2(y - 1800, x - 2200) * 180 / Math.PI;
      var rawIndex = (angle + 90) / (360 / DIVISIONS);
      /*
       * Approved price nodes are positioned at cell centres one geometric
       * step after the north boundary. Converting their angle without this
       * correction shifts every displayed value forward: 2 appears where
       * 1 belongs and 37 replaces 36 at the end of the first ring.
       */
      var numberIndex = positiveModulo(
        Math.round(clockwise ? rawIndex : -rawIndex) - 1,
        DIVISIONS
      );
      return numberIndex === 0 ? DIVISIONS : numberIndex;
    }

    function ensureArabicCardinalDirectionsV142() {
      if (!wheelDocument) return false;
      var svg = wheelDocument.getElementById('wheel');
      if (!svg) return false;

      var existing =
        wheelDocument.getElementById('v144ArabicCardinalDirections');
      if (existing) {
        if (existing.parentNode === svg &&
            existing !== svg.lastElementChild) {
          svg.appendChild(existing);
        }
        return true;
      }

      var NS = 'http://www.w3.org/2000/svg';
      var group = wheelDocument.createElementNS(NS, 'g');
      group.id = 'v144ArabicCardinalDirections';
      group.setAttribute('aria-label', 'الاتجاهات الأربعة');
      group.setAttribute('pointer-events', 'none');

      var directions = [
        { label: 'الشمال', x: 2200, y: 140, rotation: 0 },
        { label: 'الشرق', x: 3860, y: 1800, rotation: 90 },
        { label: 'الجنوب', x: 2200, y: 3460, rotation: 0 },
        { label: 'الغرب', x: 540, y: 1800, rotation: -90 }
      ];

      directions.forEach(function (direction) {
        var text = wheelDocument.createElementNS(NS, 'text');
        text.setAttribute('x', String(direction.x));
        text.setAttribute('y', String(direction.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('direction', 'rtl');
        text.setAttribute('unicode-bidi', 'plaintext');
        text.setAttribute('lang', 'ar');
        text.setAttribute('aria-label', direction.label);
        text.setAttribute(
          'transform',
          'rotate(' + direction.rotation + ' ' +
            direction.x + ' ' + direction.y + ')'
        );
        text.style.fontFamily = 'Tahoma, Arial, sans-serif';
        text.style.fontSize = '32px';
        text.style.fontWeight = '500';
        text.style.fill = '#171513';
        text.style.paintOrder = 'stroke fill';
        text.style.stroke = 'rgba(255,255,255,0.32)';
        text.style.strokeWidth = '0.8px';
        text.textContent = direction.label;
        group.appendChild(text);
      });

      svg.appendChild(group);
      wheelDocument.documentElement.dataset.v144CardinalDirections =
        'same-wheel-document-safe-overlay';
      return true;
    }

    function ensureAngleRotationControlV145() {
      if (!wheelDocument) return false;
      var svg = wheelDocument.getElementById('wheel');
      var ticks = wheelDocument.getElementById('angleTicks');
      var labels = wheelDocument.getElementById('angleLabels');
      if (!svg || !ticks || !labels) return false;

      var existing = wheelDocument.getElementById('v147AngleDragHandle');
      if (existing) {
        if (existing.parentNode === svg &&
            existing !== svg.lastElementChild) {
          svg.appendChild(existing);
        }
        return true;
      }

      var NS = 'http://www.w3.org/2000/svg';
      var CX = 2200;
      var CY = 1800;
      var rotation = Number(
        wheelDocument.documentElement.dataset.v147AngleRotation || '0'
      );
      if (!Number.isFinite(rotation)) rotation = 0;

      var handle = wheelDocument.createElementNS(NS, 'g');
      handle.id = 'v147AngleDragHandle';
      handle.setAttribute('role', 'slider');
      handle.setAttribute('aria-label', 'تحريك إطار الزوايا');
      handle.setAttribute('aria-valuemin', '0');
      handle.setAttribute('aria-valuemax', '359');
      handle.setAttribute('aria-valuenow', String(rotation));
      handle.style.cursor = 'grab';
      handle.style.pointerEvents = 'all';
      handle.style.touchAction = 'none';

      var stem = wheelDocument.createElementNS(NS, 'line');
      stem.setAttribute('x1', '2200');
      stem.setAttribute('y1', '160');
      stem.setAttribute('x2', '2200');
      stem.setAttribute('y2', '184');
      stem.setAttribute('stroke', '#d9423b');
      stem.setAttribute('stroke-width', '4');
      stem.setAttribute('stroke-linecap', 'round');
      stem.setAttribute('pointer-events', 'none');

      var pin = wheelDocument.createElementNS(NS, 'circle');
      pin.setAttribute('cx', '2200');
      pin.setAttribute('cy', '190');
      pin.setAttribute('r', '12');
      pin.setAttribute('fill', '#e34a43');
      pin.setAttribute('stroke', '#fff7ed');
      pin.setAttribute('stroke-width', '3');
      pin.setAttribute('pointer-events', 'none');
      pin.style.filter = 'drop-shadow(0 2px 2px rgba(40,16,10,0.36))';

      var hit = wheelDocument.createElementNS(NS, 'circle');
      hit.setAttribute('cx', '2200');
      hit.setAttribute('cy', '187');
      hit.setAttribute('r', '38');
      hit.setAttribute('fill', 'transparent');
      hit.setAttribute('stroke', 'transparent');
      hit.style.pointerEvents = 'all';

      handle.appendChild(stem);
      handle.appendChild(pin);
      handle.appendChild(hit);
      svg.appendChild(handle);

      function normalize(value) {
        value %= 360;
        return value < 0 ? value + 360 : value;
      }

      function svgPoint(event) {
        var point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        var matrix = svg.getScreenCTM();
        return matrix ? point.matrixTransform(matrix.inverse()) : point;
      }

      function applyRotation(value) {
        rotation = normalize(value);
        var transform =
          'rotate(' + rotation.toFixed(3) + ' ' + CX + ' ' + CY + ')';
        ticks.setAttribute('transform', transform);
        labels.setAttribute('transform', transform);
        handle.setAttribute('transform', transform);
        handle.setAttribute('aria-valuenow', String(Math.round(rotation)));
        wheelDocument.documentElement.dataset.v147AngleRotation =
          rotation.toFixed(3);
      }

      function rotateFromEvent(event) {
        var point = svgPoint(event);
        var angle =
          (Math.atan2(point.y - CY, point.x - CX) * 180 / Math.PI) + 90;
        applyRotation(angle);
      }

      handle.addEventListener('pointerdown', function (event) {
        event.preventDefault();
        event.stopPropagation();
        handle.style.cursor = 'grabbing';
        if (handle.setPointerCapture) {
          try { handle.setPointerCapture(event.pointerId); } catch (error) {}
        }
        rotateFromEvent(event);
      });

      handle.addEventListener('pointermove', function (event) {
        if (!handle.hasPointerCapture ||
            !handle.hasPointerCapture(event.pointerId)) return;
        event.preventDefault();
        event.stopPropagation();
        rotateFromEvent(event);
      });

      function finish(event) {
        handle.style.cursor = 'grab';
        if (handle.releasePointerCapture &&
            handle.hasPointerCapture &&
            handle.hasPointerCapture(event.pointerId)) {
          try { handle.releasePointerCapture(event.pointerId); } catch (error) {}
        }
      }
      handle.addEventListener('pointerup', finish);
      handle.addEventListener('pointercancel', finish);

      handle.addEventListener('keydown', function (event) {
        var step = event.shiftKey ? 10 : 1;
        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          applyRotation(rotation + step);
        } else if (
          event.key === 'ArrowLeft' || event.key === 'ArrowDown'
        ) {
          event.preventDefault();
          applyRotation(rotation - step);
        } else if (event.key === 'Home') {
          event.preventDefault();
          applyRotation(0);
        }
      });
      handle.setAttribute('tabindex', '0');

      applyRotation(rotation);
      wheelDocument.documentElement.dataset.v147AngleHandle =
        'red-pin-under-360';
      return true;
    }

    function applyWheelModel() {
      pendingApply = false;
      if (!wheelDocument || !wheelDocument.documentElement) return;

      var root = wheelDocument.documentElement;
      ensureArabicCardinalDirectionsV142();
      ensureAngleRotationControlV145();
      var language = root.dataset.v50LiveLanguage || 'en';
      var dataType = root.dataset.dataType || '';
      var model = calculateAnchorModel(root);
      var renderRingCount = Math.max(
        1,
        Number(root.dataset.layoutSize || actualSizeInput.value || '11')
      );
      var showCycleNumbers = !!(
        highlightShowNumbersInput &&
        highlightShowNumbersInput.checked &&
        dataType === 'price'
      );
      var nodes = wheelDocument.querySelectorAll('.approved-cycle-number');

      nodes.forEach(function (node) {
        var cycleOffset = Number.parseInt(
          node.getAttribute('data-cycle-offset') || '0',
          10
        );
        var sourceTick = captureSourceTick(node);
        captureOriginalFont(node);

        if (dataType === 'price' && Number.isFinite(sourceTick)) {
          var position = cellPositionFromGeometry(
            node,
            root.dataset.layoutDirection !== 'counterclockwise'
          );
          if (!Number.isFinite(position)) return;
          var relativeTick = (cycleOffset * DIVISIONS) + position;
          /*
           * The centre is the zero anchor. The native geometry numbers cell
           * centres from one step after that anchor, so the display layer
           * must remove exactly one increment. Without this normalization
           * Value 1 renders as 2, Value 2 as 3, and Value 36 as 37.
           */
          var correctedTick =
            (model.anchorEndTick - DIVISIONS) + relativeTick - 1;
          var correctedValue =
            model.anchorBaseValue +
            (relativeTick * model.step) -
            model.step;
          var westernValue = formatValue(correctedValue, model.step);

          node.setAttribute('data-tick', String(correctedTick));
          node.setAttribute(
            'data-cycle-number',
            String(Math.floor((correctedTick - 1) / DIVISIONS) + 1)
          );
          node.setAttribute('data-v131-display-value', westernValue);
          node.setAttribute(
            'data-v131-ring-role',
            cycleOffset === 0 ? 'anchor-0' : 'outer-' + cycleOffset
          );
          var localizedValue = localizeDigits(westernValue, language);
          var cycleAngleNumber =
            positiveModulo(correctedTick - 1, MAJOR_CYCLE_TICKS) + 1;
          renderCycleNumberPair(
            node,
            localizedValue,
            cycleAngleNumber,
            language,
            showCycleNumbers,
            renderRingCount
          );
        }

        if (language === 'ar') {
          applyArabicFont(node, cycleOffset);
        } else {
          restoreOriginalFont(node);
        }
      });

      renderLayerMarks(
        root,
        language,
        dataType,
        renderRingCount,
        model
      );

      var outerCycles = visibleSizeInput
        ? clampOuterCycles(visibleSizeInput.value)
        : DEFAULT_OUTER_CYCLES;

      root.dataset.v131AnchorRing = '0';
      root.dataset.v131OuterCycleCount = String(outerCycles);
      root.dataset.v131AnchorStartValue =
        String(model.anchorBaseValue + model.step);
      root.dataset.v131AnchorEndValue = String(model.anchorEndValue);
      root.dataset.v131OuterStartValue =
        String(model.anchorEndValue + model.step);
      root.dataset.v131OuterEndValue =
        String(model.anchorEndValue + (outerCycles * DIVISIONS * model.step));
      root.dataset.v131CycleFontMode =
        language === 'ar'
          ? 'arabic-anchor-36-outer-46-50-54px'
          : 'english-original';

      if (lastTarget !== null) {
        applyFindHighlight(lastTarget);
      }
    }

    function scheduleApply() {
      if (pendingApply) return;
      pendingApply = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(applyWheelModel);
      });
    }

    function ensureHighlightStyle() {
      if (wheelDocument.getElementById('v131-find-highlight-style')) return;
      var style = wheelDocument.createElement('style');
      style.id = 'v131-find-highlight-style';
      style.textContent =
        '.approved-cycle-number.v131-found-number{' +
        'fill:#ffffff!important;' +
        'paint-order:stroke fill!important;' +
        'stroke:#526c7a!important;' +
        'stroke-width:1.4px!important;' +
        'stroke-linejoin:round!important;' +
        '}';
      wheelDocument.head.appendChild(style);
    }

    function polarPoint(radius, degree) {
      var angle = degree * Math.PI / 180;
      return {
        x: 2200 + (Math.cos(angle) * radius),
        y: 1800 + (Math.sin(angle) * radius)
      };
    }

    function annularSectorPath(
      innerRadius,
      outerRadius,
      numberIndex,
      clockwise
    ) {
      var step = 360 / DIVISIONS;
      var sign = clockwise ? 1 : -1;
      var centerDegree = (sign * numberIndex * step) - 90;
      var startDegree = centerDegree - (step / 2);
      var endDegree = centerDegree + (step / 2);

      var innerStart = polarPoint(innerRadius, startDegree);
      var outerStart = polarPoint(outerRadius, startDegree);
      var outerEnd = polarPoint(outerRadius, endDegree);
      var innerEnd = polarPoint(innerRadius, endDegree);

      return [
        'M', innerStart.x.toFixed(3), innerStart.y.toFixed(3),
        'L', outerStart.x.toFixed(3), outerStart.y.toFixed(3),
        'A', outerRadius.toFixed(3), outerRadius.toFixed(3),
        '0 0 1', outerEnd.x.toFixed(3), outerEnd.y.toFixed(3),
        'L', innerEnd.x.toFixed(3), innerEnd.y.toFixed(3),
        'A', innerRadius.toFixed(3), innerRadius.toFixed(3),
        '0 0 0', innerStart.x.toFixed(3), innerStart.y.toFixed(3),
        'Z'
      ].join(' ');
    }

    function clearFindHighlight() {
      if (!wheelDocument) return;
      var fill = wheelDocument.getElementById('v131FindHighlight');
      if (fill) fill.remove();

      wheelDocument
        .querySelectorAll('.approved-cycle-number.v131-found-number')
        .forEach(function (node) {
          node.classList.remove('v131-found-number');
          node.removeAttribute('data-v131-found');
        });

      lastFound = false;
      wheelDocument.documentElement.dataset.v131FindStatus = 'clear';
    }

    function applyFindHighlight(target) {
      if (!wheelDocument || !findInput) return false;
      if (!highlightVisibleInput ||
          !highlightVisibleInput.checked ||
          !highlightFillSelect ||
          (highlightFillSelect.value !== 'Cross' &&
           highlightFillSelect.value !== 'Levels')) {
        clearFindHighlight();
        return false;
      }

      var existingFill = wheelDocument.getElementById('v131FindHighlight');
      var existingNumber = wheelDocument.querySelector(
        '.approved-cycle-number.v131-found-number[data-v131-found="' +
        String(target) + '"]'
      );
      if (existingFill &&
          existingFill.getAttribute('data-v131-target') === String(target) &&
          existingFill.getAttribute('data-v131-fill-mode') ===
            highlightFillSelect.value &&
          existingNumber) {
        return true;
      }

      clearFindHighlight();
      ensureHighlightStyle();

      var match = null;
      wheelDocument
        .querySelectorAll('.approved-cycle-number[data-v131-display-value]')
        .forEach(function (node) {
          if (match) return;
          var value = Number(node.getAttribute('data-v131-display-value'));
          if (Number.isFinite(value) && Math.abs(value - target) < 1e-9) {
            match = node;
          }
        });

      if (!match) {
        findInput.setAttribute('aria-invalid', 'true');
        findInput.title = 'Number is outside the displayed wheel';
        wheelDocument.documentElement.dataset.v131FindStatus = 'not-found';
        return false;
      }

      var root = wheelDocument.documentElement;
      var cycleOffset = Number.parseInt(
        match.getAttribute('data-cycle-offset') || '0',
        10
      );
      var sourceTick = Number(match.getAttribute('data-v131-source-tick'));
      var position = cellPositionFromGeometry(
            node,
            root.dataset.layoutDirection !== 'counterclockwise'
          );
          if (!Number.isFinite(position)) return;
      var numberIndex = position === DIVISIONS ? 0 : position;
      var ringCount = Math.max(
        1,
        Number(root.dataset.layoutSize || actualSizeInput.value || '11')
      );
      var clockwise = root.dataset.layoutDirection !== 'counterclockwise';
      var specialFills = wheelDocument.getElementById('specialFills');

      if (!specialFills || root.dataset.viewMode !== 'circle36') {
        match.classList.add('v131-found-number');
        match.setAttribute('data-v131-found', String(target));
        lastFound = true;
        return true;
      }

      var fillMode = highlightFillSelect.value;
      var fill;

      if (fillMode === 'Levels') {
        var ringWidth = (1500 - 400) / ringCount;
        fill = wheelDocument.createElementNS(
          'http://www.w3.org/2000/svg',
          'g'
        );
        fill.setAttribute(
          'data-v131-highlight-role',
          'alternating-level-rings'
        );
        fill.setAttribute(
          'data-v131-start-cycle-offset',
          String(cycleOffset)
        );

        for (
          var highlightedRing = cycleOffset;
          highlightedRing < ringCount;
          highlightedRing += 2
        ) {
          var innerRadius = 400 + (highlightedRing * ringWidth);
          var outerRadius = innerRadius + ringWidth;
          var levelCircle = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'circle'
          );
          levelCircle.setAttribute('cx', '2200');
          levelCircle.setAttribute('cy', '1800');
          levelCircle.setAttribute(
            'r',
            String((innerRadius + outerRadius) / 2)
          );
          levelCircle.setAttribute('fill', 'none');
          levelCircle.setAttribute('stroke', '#8FA8B6');
          levelCircle.setAttribute('stroke-width', String(ringWidth));
          levelCircle.setAttribute('stroke-opacity', '0.30');
          levelCircle.setAttribute(
            'data-v131-highlighted-ring',
            String(highlightedRing)
          );
          fill.appendChild(levelCircle);
        }
      } else {
        fill = wheelDocument.createElementNS(
          'http://www.w3.org/2000/svg',
          'g'
        );
        fill.setAttribute(
          'data-v131-highlight-role',
          'alternating-radial-rays'
        );
        fill.setAttribute(
          'data-v131-start-ray-index',
          String(numberIndex)
        );

        for (
          var rayStep = 0;
          rayStep < DIVISIONS;
          rayStep += 2
        ) {
          var highlightedRayIndex = positiveModulo(
            numberIndex + rayStep,
            DIVISIONS
          );
          var rayPath = wheelDocument.createElementNS(
            'http://www.w3.org/2000/svg',
            'path'
          );
          rayPath.setAttribute(
            'd',
            annularSectorPath(
              180,
              1500,
              highlightedRayIndex,
              clockwise
            )
          );
          rayPath.setAttribute('fill', '#8FA8B6');
          rayPath.setAttribute('fill-opacity', '0.30');
          rayPath.setAttribute('stroke', 'none');
          rayPath.setAttribute(
            'data-v131-highlighted-ray',
            String(highlightedRayIndex)
          );
          fill.appendChild(rayPath);
        }
      }

      fill.id = 'v131FindHighlight';
      fill.setAttribute('pointer-events', 'all');
      fill.setAttribute('cursor', 'pointer');
      fill.setAttribute('role', 'button');
      fill.setAttribute('tabindex', '0');
      fill.setAttribute('aria-label', 'Clear selected highlight');
      fill.setAttribute('data-v131-target', String(target));
      fill.setAttribute('data-v131-fill-mode', fillMode);
      fill.setAttribute('data-v131-frame-color', '#8FA8B6');

      function dismissHighlight(event) {
        if (event) event.preventDefault();
        lastTarget = null;
        clearFindHighlight();
        findInput.setAttribute('aria-invalid', 'false');
        findInput.title = 'Selection cleared by clicking the highlight';
      }

      fill.addEventListener('click', dismissHighlight);
      fill.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          dismissHighlight(event);
        }
      });

      specialFills.appendChild(fill);

      match.classList.add('v131-found-number');
      match.setAttribute('data-v131-found', String(target));
      lastFound = true;
      findInput.setAttribute('aria-invalid', 'false');
      findInput.title = 'Located: ' + target;
      root.dataset.v131FindStatus = 'cell-highlighted';
      root.dataset.v131FindTarget = String(target);
      return true;
    }

    function runFind() {
      if (!discoverDocuments()) return false;
      var target = parseFiniteNumber(findInput.value);
      if (target === null || target <= 0) {
        findInput.setAttribute('aria-invalid', 'true');
        findInput.title = 'Enter a positive number';
        return false;
      }

      lastTarget = target;
      lastAnchor = null;

      return applyFindHighlight(target);
    }

    function applyDefaultOnes() {
      if (defaultsApplied) return;
      valueInput.value = '1';
      findInput.value = '1';
      incrementInput.value = '1';
      visibleSizeInput.value = String(DEFAULT_OUTER_CYCLES);
      actualSizeInput.value = String(DEFAULT_OUTER_CYCLES + 1);
      defaultsApplied = true;

      controlDocument.documentElement.dataset.v131DefaultValues = '1-1-1';
      dispatchControl(incrementInput);
      dispatchControl(valueInput);
      dispatchControl(actualSizeInput);
    }

    function attachControls() {
      valueInput = controlDocument.querySelector('input[aria-label="Value"]');
      findInput = controlDocument.querySelector('input[aria-label="Find"]');
      incrementInput =
        controlDocument.querySelector('input[aria-label="Increment"]');
      highlightVisibleInput =
        controlDocument.querySelector('input[aria-label="Highlight visible"]');
      highlightFillSelect =
        controlDocument.querySelector('select[aria-label="Highlight fill"]');
      highlightShowNumbersInput =
        controlDocument.querySelector('input[aria-label="Show numbers"]');
      highlightShowMarksInput =
        controlDocument.querySelector('input[aria-label="Show marks"]');

      if (!valueInput ||
          !findInput ||
          !incrementInput ||
          !highlightVisibleInput ||
          !highlightFillSelect ||
          !highlightShowNumbersInput ||
          !highlightShowMarksInput) return false;
      if (!setupOuterCycleProxy()) return false;

      /*
       * Value and Increment are native panel controls, but the approved
       * number layer is a separate rendering pass. Bind them explicitly so
       * every edit recalculates the displayed price values. The delayed
       * pass also runs after the native wheel has finished its own redraw.
       */
      [valueInput, incrementInput].forEach(function (control) {
        if (control.dataset.v136WheelModelAttached === 'true') return;
        control.dataset.v136WheelModelAttached = 'true';
        var refreshTimer = null;
        var refresh = function () {
          if (refreshTimer) clearTimeout(refreshTimer);
          scheduleApply();
          refreshTimer = setTimeout(function () {
            refreshTimer = null;
            scheduleApply();
          }, 120);
        };
        control.addEventListener('input', refresh);
        control.addEventListener('change', refresh);
        control.addEventListener('keyup', refresh);
      });

      findAction = findInput.parentElement
        ? findInput.parentElement.querySelector('.field-action')
        : null;

      if (!Array.prototype.some.call(
        highlightFillSelect.options,
        function (option) { return option.value === 'Cross'; }
      )) {
        var crossOption = controlDocument.createElement('option');
        crossOption.value = 'Cross';
        crossOption.textContent = 'Cross';
        highlightFillSelect.appendChild(crossOption);
      }

      highlightVisibleInput.checked = true;
      highlightFillSelect.value = 'Cross';
      highlightVisibleInput.dataset.v131HighlightActive = 'true';
      highlightFillSelect.dataset.v131HighlightFill = 'Cross';

      applyDefaultOnes();

      if (findInput.dataset.v131FindAttached === 'true') return true;
      findInput.dataset.v131FindAttached = 'true';
      findInput.title = 'Enter a number and press Enter or the search icon';

      highlightVisibleInput.addEventListener('change', function () {
        highlightVisibleInput.dataset.v131HighlightActive =
          highlightVisibleInput.checked ? 'true' : 'false';
        if (!highlightVisibleInput.checked) {
          clearFindHighlight();
          return;
        }
        var target = parseFiniteNumber(findInput.value);
        if (target !== null && target > 0) {
          lastTarget = target;
          applyFindHighlight(target);
        }
      });

      highlightFillSelect.addEventListener('change', function () {
        highlightFillSelect.dataset.v131HighlightFill =
          highlightFillSelect.value;
        if (highlightFillSelect.value !== 'Cross' &&
            highlightFillSelect.value !== 'Levels') {
          clearFindHighlight();
          return;
        }
        var target = parseFiniteNumber(findInput.value);
        if (highlightVisibleInput.checked &&
            target !== null &&
            target > 0) {
          lastTarget = target;
          applyFindHighlight(target);
        }
      });

      if (
        highlightShowMarksInput.dataset.v131LayerMarksAttached !==
        'true'
      ) {
        highlightShowMarksInput.dataset.v131LayerMarksAttached = 'true';
        highlightShowMarksInput.addEventListener('change', function () {
          controlDocument.documentElement.dataset.v131ShowLayerMarks =
            highlightShowMarksInput.checked ? 'true' : 'false';
          scheduleApply();
        });
      }

      if (
        highlightShowNumbersInput.dataset.v131CycleNumbersAttached !==
        'true'
      ) {
        highlightShowNumbersInput.dataset.v131CycleNumbersAttached = 'true';
        highlightShowNumbersInput.addEventListener('change', function () {
          controlDocument.documentElement.dataset.v131ShowCycleNumbers =
            highlightShowNumbersInput.checked ? 'true' : 'false';
          scheduleApply();
        });
      }

      findInput.addEventListener('input', function () {
        if (findInputTimer) clearTimeout(findInputTimer);
        findInputTimer = setTimeout(function () {
          findInputTimer = null;
          runFind();
        }, 120);
      });

      findInput.addEventListener('change', function () {
        if (findInputTimer) {
          clearTimeout(findInputTimer);
          findInputTimer = null;
        }
        runFind();
      });

      findInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          if (findInputTimer) {
            clearTimeout(findInputTimer);
            findInputTimer = null;
          }
          runFind();
        }
      });

      if (findAction) {
        findAction.setAttribute('role', 'button');
        findAction.setAttribute('tabindex', '0');
        findAction.setAttribute('aria-label', 'Find number');
        findAction.title = 'Find number';
        findAction.style.cursor = 'pointer';
        findAction.addEventListener('click', function (event) {
          event.preventDefault();
          runFind();
        });
        findAction.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            runFind();
          }
        });
      }
      return true;
    }

    function attachWheel() {
      if (wheelObserver) wheelObserver.disconnect();
      wheelDocument.addEventListener('gannzilla:language-change', scheduleApply);
      wheelObserver = new MutationObserver(scheduleApply);
      wheelObserver.observe(wheelDocument.getElementById('wheel'), {
        childList: true,
        subtree: true
      });
      applyWheelModel();
    }

    function boot(attempt) {
      if (discoverDocuments()) {
        attachControls();
        attachWheel();
        return;
      }
      if (attempt < 300) {
        setTimeout(function () { boot(attempt + 1); }, 100);
      }
    }

    frame.addEventListener('load', function () { boot(0); });
    boot(0);

    window.auditV131AnchorRing = function () {
      if (!wheelDocument || !controlDocument) return { ready: false };

      var root = wheelDocument.documentElement;
      var values = Array.prototype.slice.call(
        wheelDocument.querySelectorAll(
          '.approved-cycle-number[data-v131-display-value]'
        )
      ).map(function (node) {
        return Number(node.getAttribute('data-v131-display-value'));
      }).filter(Number.isFinite);

      return {
        ready: true,
        version: 'V131',
        visibleOuterCycleCount: Number(visibleSizeInput.value),
        internalRenderedRingCount: Number(actualSizeInput.value),
        anchorRingNumber: 0,
        anchorRingCountedInVisibleSize: false,
        defaultValue: valueInput.value,
        defaultFind: findInput.value,
        defaultIncrement: incrementInput.value,
        actualFirstValue: values.length ? Math.min.apply(Math, values) : null,
        actualLastValue: values.length ? Math.max.apply(Math, values) : null,
        value3600Model: {
          anchorStart: 3565,
          anchorEnd: 3600,
          outerStart: 3601,
          outerEnd: 3960
        },
        value1Model: {
          anchorStart: 1,
          anchorEnd: 36,
          outerStart: 37,
          outerEnd: 396
        },
        findActivated: findInput.dataset.v131FindAttached === 'true',
        highlightVisibleDefault: highlightVisibleInput.checked,
        highlightFillDefault: highlightFillSelect.value,
        highlightOptions: ['Levels', 'Cross'],
        levelsMeaning: 'complete-circular-ring',
        crossMeaning: 'complete-radial-ray',
        levelsColor: '#8FA8B6',
        crossColor: '#8FA8B6',
        highlightControlsConnected: true,
        findBehavior: 'auto-highlight-level-or-ray',
        findTrigger: 'automatic-on-input-change',
        findChangesValue: false,
        findCellColor: '#8FA8B6',
        findOneClearsHighlight: true,
        highlightedCellClickClears: true,
        highlightedCellKeyboardClears: true,
        lastFindTarget: lastTarget,
        lastFindAnchor: lastAnchor,
        lastFindFound: lastFound,
        outerFrameRadiusChanged: false,
        toolbarChanged: false,
        panelToggleChanged: false
      };
    };
  }());
  </script>
