<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — الدورة الأولى 1–360</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F7F1E3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل العجلة…</div>
  <script>
  (async function(){
    'use strict';
    var sourceApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/5fb2032b666ff17b2c04c0c837b1fdf41aceb216';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(sourceApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('WHEEL_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      var closeTag='</scr'+'ipt>';

      var controlStyle='<style id="wheel-direct-controls-style">'+
        'html,body{scrollbar-width:none!important;-ms-overflow-style:none!important;overscroll-behavior:none!important;scroll-behavior:auto!important}'+
        'html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}'+
        'html,body,svg{cursor:grab!important;touch-action:none!important}'+
        'html.wheel-pan-dragging,html.wheel-pan-dragging body,html.wheel-pan-dragging svg{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}'+
        '.first-cycle-number{font-size:24px!important;pointer-events:none!important}'+
      '</style>';

      var controls='<script>(function(){'+
        "'use strict';"+
        'var STEP=90,dragging=false,moved=false,startX=0,startY=0,startScrollX=0,startScrollY=0,suppressClickUntil=0;'+
        'var NS="http://www.w3.org/2000/svg",CX=2200,CY=1800;'+
        'function editable(target){return !!(target&&((target.tagName&&/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(target.tagName))||target.isContentEditable));}'+
        'function scroller(){return document.scrollingElement||document.documentElement;}'+
        'function focusWheel(){try{window.focus();document.documentElement.tabIndex=0;document.documentElement.focus({preventScroll:true});}catch(error){}}'+
        'function clearGroup(group){if(!group)return;while(group.firstChild)group.removeChild(group.firstChild);}'+
        'function colorClass(value){var mod=value%3;return mod===1?"number-red":mod===2?"number-blue":"number-black";}'+
        'function renderFirstCycle(){var svg=document.getElementById("wheel"),ringOne=document.getElementById("numbersRingOne"),ringTwo=document.getElementById("numbersRingTwo");if(!svg||!ringOne||!ringTwo)return false;clearGroup(ringOne);clearGroup(ringTwo);var old=document.getElementById("firstCycleNumbers1to360");if(old)old.remove();var group=document.createElementNS(NS,"g");group.id="firstCycleNumbers1to360";group.setAttribute("aria-label","الدورة الأولى من 1 إلى 360 على عشر عجلات");for(var ring=0;ring<10;ring+=1){var radius=235+(ring*110);for(var index=0;index<36;index+=1){var value=(ring*36)+(index===0?36:index),angle=(index*10-90)*Math.PI/180,x=CX+Math.cos(angle)*radius,y=CY+Math.sin(angle)*radius,text=document.createElementNS(NS,"text");text.setAttribute("x",x);text.setAttribute("y",y);text.setAttribute("data-wheel",ring+1);text.setAttribute("data-value",value);text.setAttribute("class","number-text first-cycle-number "+colorClass(value)+(index%9===0?" cardinal-number":""));text.textContent=value;group.appendChild(text);}}svg.appendChild(group);document.documentElement.dataset.firstCycleOneTo360=group.children.length===360?"true":"false";return group.children.length===360;}'+
        'function enforceFirstCycle(){var group=document.getElementById("firstCycleNumbers1to360");if(!group||group.children.length!==360)renderFirstCycle();}'+
        'function begin(clientX,clientY,target){if(editable(target))return false;var root=scroller();dragging=true;moved=false;startX=clientX;startY=clientY;startScrollX=root.scrollLeft;startScrollY=root.scrollTop;focusWheel();return true;}'+
        'function drag(clientX,clientY,event){if(!dragging)return;var dx=clientX-startX,dy=clientY-startY;if(!moved&&Math.hypot(dx,dy)>=3)moved=true;if(!moved)return;if(event&&event.preventDefault)event.preventDefault();document.documentElement.classList.add("wheel-pan-dragging");var root=scroller();root.scrollLeft=startScrollX-dx;root.scrollTop=startScrollY-dy;}'+
        'function finish(){if(!dragging)return;dragging=false;document.documentElement.classList.remove("wheel-pan-dragging");if(moved)suppressClickUntil=Date.now()+240;}'+
        'requestAnimationFrame(renderFirstCycle);setTimeout(renderFirstCycle,120);setTimeout(enforceFirstCycle,500);setTimeout(enforceFirstCycle,1500);var cycleChecks=0,cycleTimer=setInterval(function(){cycleChecks+=1;enforceFirstCycle();if(cycleChecks>=12)clearInterval(cycleTimer);},500);'+
        'document.addEventListener("mousedown",function(event){if(event.button!==0)return;begin(event.clientX,event.clientY,event.target);},true);'+
        'window.addEventListener("mousemove",function(event){if(!dragging)return;if((event.buttons&1)!==1){finish();return;}drag(event.clientX,event.clientY,event);},{capture:true,passive:false});'+
        'window.addEventListener("mouseup",finish,true);window.addEventListener("blur",finish);'+
        'document.addEventListener("selectstart",function(event){if(dragging)event.preventDefault();},true);'+
        'document.addEventListener("click",function(event){if(Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();}},true);'+
        'document.addEventListener("dragstart",function(event){event.preventDefault();},true);'+
        'document.addEventListener("wheel",function(event){if(event.ctrlKey)return;event.preventDefault();var factor=event.deltaMode===1?18:(event.deltaMode===2?window.innerHeight:1),dy=event.deltaY*factor,root=scroller();root.scrollTop+=dy;},{capture:true,passive:false});'+
        'document.addEventListener("keydown",function(event){if(editable(event.target))return;var step=event.shiftKey?240:STEP,dx=0,dy=0;if(event.key==="ArrowLeft")dx=-step;else if(event.key==="ArrowRight")dx=step;else if(event.key==="ArrowUp")dy=-step;else if(event.key==="ArrowDown")dy=step;else return;event.preventDefault();var root=scroller();root.scrollLeft+=dx;root.scrollTop+=dy;},true);'+
        'document.addEventListener("mousedown",focusWheel,true);'+
        'window.__auditKawkabatFirstCycle1To360=function(){var group=document.getElementById("firstCycleNumbers1to360"),ringOne=document.getElementById("numbersRingOne"),ringTwo=document.getElementById("numbersRingTwo");return{ok:!!group&&group.children.length===360&&!!ringOne&&ringOne.children.length===0&&!!ringTwo&&ringTwo.children.length===0,numberCount:group?group.children.length:0,numberedWheels:10,range:[1,360],topValues:[36,72,108,144,180,216,252,288,324,360],colorCycle:["red","blue","black"],topLayer:true};};'+
      '}());'+closeTag;

      html=html.replace('</head>',controlStyle+'</head>');
      html=html.replace('</body>',controls+'</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل العجلة: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
