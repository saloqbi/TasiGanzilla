<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — V41 No Tools Scrollbar Right</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/40301b75d1fa8f09e2ffc47375d8ecd8c46fafe1/public/kawkabat-al-arqam-al-sihria-restore-cardinals-pisces-ornate-frame-angle-ticks-inner-copper-boundary-v41.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('appFrame');
var poll=null;

function locateWheelDocument(doc,depth){
  if(!doc||depth>120)return null;
  try{if(doc.getElementById('wheel'))return doc;}catch(error){}
  var frames=[];
  try{frames=doc.querySelectorAll('iframe');}catch(error){return null;}
  for(var i=0;i<frames.length;i+=1){
    try{
      var found=locateWheelDocument(frames[i].contentDocument,depth+1);
      if(found)return found;
    }catch(error){}
  }
  return null;
}

function moveScrollbarRight(){
  try{
    var doc=locateWheelDocument(frame.contentDocument,0);
    if(!doc||!doc.documentElement||!doc.body)return false;

    var style=doc.getElementById('v41ScrollbarRightStyle');
    if(!style){
      style=doc.createElement('style');
      style.id='v41ScrollbarRightStyle';
      style.textContent='html{direction:ltr!important;scrollbar-gutter:stable;}body{direction:rtl!important;}svg#wheel{direction:rtl!important;}';
      (doc.head||doc.documentElement).appendChild(style);
    }

    doc.documentElement.setAttribute('dir','ltr');
    doc.body.setAttribute('dir','rtl');
    doc.documentElement.dataset.v41ScrollbarSide='right';
    doc.documentElement.dataset.v41WheelDirectionPreserved='rtl';
    doc.documentElement.dataset.v41WheelGeometryChanged='false';

    if(doc.defaultView){
      doc.defaultView.__auditKawkabatScrollbarRightV41=function(){
        return{
          ok:doc.documentElement.getAttribute('dir')==='ltr'&&doc.body.getAttribute('dir')==='rtl',
          scrollbarSide:'right',
          documentDirection:'ltr',
          contentDirection:'rtl',
          toolsPanelRemoved:true,
          wheelGeometryChanged:false,
          wheelNumbersChanged:false,
          ornateOuterFrameChanged:false,
          innerCopperBoundaryChanged:false
        };
      };
    }
    return true;
  }catch(error){return false;}
}

function start(){
  if(poll)clearInterval(poll);
  var attempts=0;
  poll=setInterval(function(){
    attempts+=1;
    if(moveScrollbarRight()||attempts>=2600){
      clearInterval(poll);
      poll=null;
    }
  },100);
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
