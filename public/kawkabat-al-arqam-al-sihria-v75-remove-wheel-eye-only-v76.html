<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Numbers Constellation — Remove Wheel Eye Only V76</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f7f1e3}
</style>
</head>
<body>
<iframe id="appFrame" title="Magic Numbers Constellation" allowfullscreen src="https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/7e288121e3cd3fa9dc4701ca0cb96f3814f0db8d/public/kawkabat-al-arqam-al-sihria-v74-hide-wheel-scrollbars-test-v75.html"></iframe>
<script>
(function(){
'use strict';

var frame=document.getElementById('appFrame');
var timer=null;
var WHEEL_KEY='tasi-gannzilla-wheel-visible-v65';
var BUTTON_ID='v65WheelToggleBtn';
var STYLE_ID='v76RemoveWheelEyeStyle';

try{localStorage.setItem(WHEEL_KEY,'true');}catch(error){}

function visit(doc,callback,depth){
  if(!doc||depth>180)return;
  callback(doc);
  var frames=doc.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i+=1){
    try{visit(frames[i].contentDocument,callback,depth+1);}catch(error){}
  }
}

function neutralize(doc){
  var button=doc.getElementById(BUTTON_ID);
  if(!button)return false;

  if(button.dataset.hidden==='true'){
    try{button.click();}catch(error){}
  }

  var style=doc.getElementById(STYLE_ID);
  if(!style){
    style=doc.createElement('style');
    style.id=STYLE_ID;
    style.textContent='#'+BUTTON_ID+'{display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;min-width:0!important;height:0!important;margin:0!important;padding:0!important;border:0!important;}';
    doc.head.appendChild(style);
  }

  if(button.dataset.v76Neutralized!=='true'){
    var replacement=button.cloneNode(true);
    replacement.id=BUTTON_ID;
    replacement.type='button';
    replacement.disabled=true;
    replacement.dataset.hidden='false';
    replacement.dataset.v76Neutralized='true';
    replacement.setAttribute('aria-hidden','true');
    replacement.setAttribute('tabindex','-1');
    replacement.title='';
    replacement.removeAttribute('aria-label');
    button.replaceWith(replacement);
  }

  try{
    doc.defaultView.__auditKawkabatRemoveWheelEyeOnlyV76=function(){
      var hiddenButton=doc.getElementById(BUTTON_ID);
      return{
        ok:!!hiddenButton&&hiddenButton.dataset.v76Neutralized==='true'&&hiddenButton.disabled,
        sourceVersion:'V75',
        wheelEyeVisible:false,
        wheelEyeInteractive:false,
        wheelForcedVisible:true,
        panelToggleChanged:false,
        zoomChanged:false,
        drawingToolsChanged:false,
        connectionChanged:false,
        fullscreenChanged:false,
        languageChanged:false,
        wheelGeometryChanged:false,
        ornateFrameChanged:false
      };
    };
  }catch(error){}

  return true;
}

function apply(){
  var applied=false;
  try{
    visit(frame.contentDocument,function(doc){
      if(neutralize(doc))applied=true;
    },0);
  }catch(error){}
  return applied;
}

function start(){
  try{localStorage.setItem(WHEEL_KEY,'true');}catch(error){}
  if(timer)clearInterval(timer);
  timer=setInterval(apply,250);
  apply();
}

frame.addEventListener('load',start);
start();
}());
</script>
</body>
</html>
