<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Magic Numbers Constellation — 1 to 360 with balanced days and zodiac</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e3;font-family:Arial,Tahoma,sans-serif}
    body{display:grid;place-items:center;color:#43515a}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">Loading approved structure…</div>
  <script>
  (async function(){
    'use strict';
    var approvedApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/d9af47f4be4649f4bb687fc937476c40a9b1c54a';
    var wheelUrl='https://htmlpreview.github.io/?https://github.com/saloqbi/TasiGanzilla/blob/d2914da0c93ae549c759ef2922b3907e71864812/public/kawkabat-wheel-approved-1-360-all-days-zodiac-balanced-v9.html';
    function decodeBase64(value){var binary=atob(String(value||'').replace(/\s/g,'')),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
    try{
      var response=await fetch(approvedApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('APPROVED_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);
      html=html.replace('</style>',
        '.work-frame{right:0!important;width:calc(100% - 390px)!important;overflow:hidden!important;outline:none!important}'+
        '.page-scrollbar{right:auto!important;left:375px!important;top:7px!important;bottom:7px!important}'+
        '@media(max-width:950px){.work-frame{left:330px!important;width:calc(100% - 330px)!important}.page-scrollbar{left:315px!important}}'+
        '</style>');
      html=html.replace(/<iframe class="work-frame"[^>]*>[\s\S]*?<\/iframe>/,
        '<iframe id="workFrame" class="work-frame" title="Magic Numbers Constellation" tabindex="0" src="'+wheelUrl+'"></iframe>');
      var directionRuntime='<scr'+'ipt>'+
        "(function(){'use strict';"+
        "var frame=document.getElementById('workFrame'),checkbox=document.querySelector('input[aria-label=\"Layout clockwise\"]'),centerX=2200,retryTimer=null;"+
        "function mirroredX(value){return String((centerX*2)-Number(value));}"+
        "function applyDirection(clockwise){try{var doc=frame&&frame.contentDocument;if(!doc||!doc.getElementById('wheel'))return false;var numbers=doc.querySelectorAll('#numbersRingOne text,#numbersRingTwo text,[id^=\"approvedCycle\"][id$=\"Numbers\"] text');if(numbers.length<432)return false;numbers.forEach(function(node){if(!node.hasAttribute('data-clockwise-x')){node.setAttribute('data-clockwise-x',node.getAttribute('x'));node.setAttribute('data-clockwise-y',node.getAttribute('y'));}var x=node.getAttribute('data-clockwise-x'),y=node.getAttribute('data-clockwise-y');node.setAttribute('x',clockwise?x:mirroredX(x));node.setAttribute('y',y);});var labels=doc.querySelectorAll('#allBalancedDaysZodiac .day-zodiac-cell');labels.forEach(function(node){if(!node.hasAttribute('data-clockwise-transform'))node.setAttribute('data-clockwise-transform',node.getAttribute('transform')||'');if(clockwise){node.setAttribute('transform',node.getAttribute('data-clockwise-transform'));return;}var index=Number(node.getAttribute('data-index'))||0,match=node.getAttribute('data-clockwise-transform').match(/translate\\(([-\\d.]+)\\s+([-\\d.]+)\\)/);if(!match)return;var rotation=(((-index*10)%360)+360)%360;if(rotation>90&&rotation<270)rotation+=180;node.setAttribute('transform','translate('+mirroredX(match[1])+' '+match[2]+') rotate('+rotation+')');});doc.documentElement.dataset.layoutDirection=clockwise?'clockwise':'counterclockwise';return true;}catch(error){return false;}}"+
        "function syncWithRetry(){if(retryTimer){clearInterval(retryTimer);retryTimer=null;}var tries=0;function run(){tries+=1;if(applyDirection(!!checkbox.checked)||tries>=200){if(retryTimer){clearInterval(retryTimer);retryTimer=null;}}}run();if(tries<200&&!applyDirection(!!checkbox.checked))retryTimer=setInterval(run,100);}"+
        "if(!frame||!checkbox)return;checkbox.title='Checked: clockwise; unchecked: counterclockwise';checkbox.addEventListener('change',syncWithRetry);frame.addEventListener('load',syncWithRetry);window.__setKawkabatLayoutClockwise=function(value){checkbox.checked=!!value;syncWithRetry();return checkbox.checked;};syncWithRetry();"+
        "}());"+
        '</scr'+'ipt>';
      html=html.replace('</body>',directionRuntime+'</body>');
      document.open();document.write(html);document.close();
    }catch(error){document.body.innerHTML='<div class="loading">Unable to load structure: '+String(error.message||error)+'</div>';}
  }());
  </script>
</body>
</html>
