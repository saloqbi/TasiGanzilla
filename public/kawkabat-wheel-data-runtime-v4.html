<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوكبة الأرقام السحرية — Data Type Runtime V4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F7F1E3}
    body{display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;color:#5A4C44}
    .loading{font-weight:800}
  </style>
</head>
<body>
  <div class="loading">جارٍ تحميل Runtime نوع البيانات…</div>
  <script>
  (async function(){
    'use strict';

    var sourceApi='https://api.github.com/repos/saloqbi/TasiGanzilla/git/blobs/b45c46e69048f381fce315352e5b5442f0dfe17b';

    function decodeBase64(value){
      var binary=atob(String(value||'').replace(/\s/g,''));
      var bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    try{
      var response=await fetch(sourceApi,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(!response.ok)throw new Error('VIEW_V2_HTTP_'+response.status);
      var payload=await response.json();
      var html=decodeBase64(payload.content);

      html=html.replace('View Runtime V2','Data Type Runtime V4');
      html=html.replace("var modeKey=params.get('view')||'circle24'","var modeKey=params.get('view')||'circle36'");
      html=html.replace(
        "circle24:{label:'Circle of 24',shape:'circle',divisions:24},",
        "circle24:{label:'Circle of 24',shape:'circle',divisions:24},circle36:{label:'Circle of 36',shape:'circle',divisions:36},"
      );
      html=html.replace("var meta=modes[modeKey]||modes.circle24","var meta=modes[modeKey]||modes.circle36");
      html=html.replace(/__auditKawkabatViewRuntimeV2/g,'__auditKawkabatDataRuntimeV4');

      var dataMarker="\"document.documentElement.dataset.viewMode=modeKey;document.documentElement.dataset.clockwise=direction==='cw'?'true':'false';\"+";
      var dataRuntime=
        "\"var dataType=params.get('dataType')||'price';\"+\n"+
        "        \"function pad2Data(value){return String(value).padStart(2,'0');}\"+\n"+
        "        \"function dateLabel(offset){var date=new Date(Date.UTC(2019,11,31)+(offset*86400000));return pad2Data(date.getUTCDate())+'.'+pad2Data(date.getUTCMonth()+1);}\"+\n"+
        "        \"function timeLabel(offset){var hours=((offset%24)+24)%24;return pad2Data(hours)+':00';}\"+\n"+
        "        \"cycleGroups.forEach(function(group){Array.prototype.forEach.call(group.children,function(node){var raw=Number(node.getAttribute('data-value')||node.textContent),offset=Math.max(0,raw-1),dateValue=dateLabel(offset),timeValue=timeLabel(offset);if(dataType==='date')node.textContent=dateValue;else if(dataType==='time')node.textContent=timeValue;else if(dataType==='priceDate')node.textContent=raw+'·'+dateValue;else if(dataType==='priceTime')node.textContent=raw+'·'+timeValue;if(dataType==='date'||dataType==='time')node.style.setProperty('font-size','16px','important');else if(dataType==='priceDate'||dataType==='priceTime')node.style.setProperty('font-size','13px','important');});});\"+\n"+
        "        \"document.documentElement.dataset.dataType=dataType;\"+\n"+
        "        \"document.documentElement.dataset.viewMode=modeKey;document.documentElement.dataset.clockwise=direction==='cw'?'true':'false';\"+";

      if(html.indexOf(dataMarker)<0)throw new Error('DATA_RUNTIME_MARKER_NOT_FOUND');
      html=html.replace(dataMarker,dataRuntime);

      if(html.indexOf("circle36:{label:'Circle of 36'")<0)throw new Error('CIRCLE36_MODE_PATCH_FAILED');
      if(html.indexOf("document.documentElement.dataset.dataType=dataType")<0)throw new Error('DATA_TYPE_PATCH_FAILED');

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="loading">تعذر تحميل Runtime نوع البيانات: '+String(error.message||error)+'</div>';
    }
  }());
  </script>
</body>
</html>
